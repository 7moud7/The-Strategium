  const [perModelWounds,setPerModelWounds]=useState({}); // {entryId: {modelIdx: woundsLeft}}
  // Wound/destroy resolution now happens automatically as part of resolving
  // an attack in the Combat Roller — these manual controls are collapsed by
  // default and only need opening for the rare case the auto-resolution
  // doesn't cover (terrain damage, a mission rule, a correction, etc).
  const [manualOverrideOpen,setManualOverrideOpen]=useState({}); // {entryId: bool}
  const cmdReactionTimer=React.useRef(null);
  // logAction — call this whenever a meaningful game event occurs
  const actionLogRef=React.useRef([]);
  function logAction(unitName,action,detail='',vpDelta=0,undoFns=null){
    const id=Date.now().toString(36)+Math.random().toString(36).slice(2,5);
    const entry={id,round,phase,player:activePlayer,unitName,action,detail,vpDelta,ts:new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}),undoFns};
    actionLogRef.current=[entry,...actionLogRef.current].slice(0,300);
    setActionLog([...actionLogRef.current]);
  }

  // ── COMMANDER REACTION SYSTEM ───────────────────────────────────────────
  // Future-proof by design: call triggerReaction(eventType, details) from
  // ANYWHERE, including event types you invent later — there's nothing to
  // register. Unknown eventTypes just get an auto-generated readable label
  // and Gemini still reacts in character. Rapid-fire events (e.g. 3 units
  // dying in one Fight phase) get buffered behind a short cooldown and
  // merged into a single reaction instead of spamming the API.
  const EVENT_LABELS={
    enemy_vp:'enemy scored Victory Points',
    own_vp:'just scored Victory Points',
    unit_destroyed:'a unit was destroyed',
    unit_charged:'a unit charged into combat',
    stratagem_used:'a Stratagem was activated',
    battle_shock_failed:'a Battle-shock test was failed',
    battle_shock_passed:'a Battle-shock test was passed',
    cp_low:'Command Points are running critically low',
    round_end:'the round ended',
    ability_used:'a special ability was used',
    shooting_resolved:'shooting attacks were resolved',
    melee_resolved:'melee combat was resolved',
    mission_scored:'a Mission Card was scored',
    fallback:'a unit fell back from combat',
    cp_gained:'Command Points were generated',
  };
  function humanizeEvent(eventType){
    return EVENT_LABELS[eventType]||eventType.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
  }
  function resolveCommander(army){
    const fid=army?.factionId;
    let c=COMMANDERS[fid]||COMMANDERS.SM; // fallback to generic
    if(fid==='SM'&&army?.chapter){
      // chapter field is the chapter name (e.g. 'Ultramarines')
      c=SM_CHAPTER_COMMANDERS[army.chapter]||SM_CHAPTER_COMMANDERS['generic']||c;
    }
    return c||null;
  }
  const reactionQueueRef=React.useRef([]); // buffered {eventType,details} awaiting a reaction
  const reactionLockRef=React.useRef(false); // true while a call is in-flight OR cooling down
  const reactionCooldownTimer=React.useRef(null);
  const REACTION_COOLDOWN_MS=3500;

  async function processReactionQueue(){
    if(reactionLockRef.current) return;
    const batch=reactionQueueRef.current;
    if(!batch.length) return;
    reactionQueueRef.current=[];
    reactionLockRef.current=true;

    const cmd1=resolveCommander(p1Army), cmd2=resolveCommander(p2Army);
    // Always use the ACTIVE player's commander — never switch to opponent
    const speaker=activePlayer===1?cmd1:cmd2, speakerPlayer=activePlayer;
    if(!speaker){ reactionLockRef.current=false; return; }

    const description=batch.map(ev=>`${humanizeEvent(ev.eventType)}${ev.details?` (${ev.details})`:''}`).join('; ');
    // Instant placeholder — zero latency, no canned-line authoring needed
    setCmdReaction({name:speaker.name,img:speaker.img,imgPos:speaker.imgPos,accent:speaker.accent||'var(--gold)',text:'…',player:speakerPlayer,thinking:true});

    try{
      // Map event types to character reaction context so Gemini matches the personality patterns
      const primaryEvent=batch[0]?.eventType||'unknown';
      const eventHint={
        'own_vp':'The player just scored Victory Points on the battlefield.',
        'unit_destroyed':'An enemy unit was just destroyed.',
        'unit_charged':'A unit just declared a charge into combat.',
        'stratagem_used':'A stratagem was just activated.',
        'cp_gained':'Command Points were just generated.',
        'ability_used':'A special ability was just used.',
        'shooting_resolved':'Shooting attacks were just resolved.',
        'melee_resolved':'Melee combat was just resolved.',
        'mission_scored':'A mission card was just scored for VP.',
        'fallback':'A unit just fell back from melee combat.',
        'battle_shocked':'A unit is now Battle-shocked.',
        'cp_low':'Command Points are critically low.',
      }[primaryEvent]||'';

      // Commander commentary layer — personality drives the reaction, not rules analysis
      // (Rules analysis happens separately in the Rules Engine when queries are made)
      const text=await callGemini(
        speaker.voice +
        '\n\nCURRENT BATTLE STATE:' +
        '\n- Game: ' + (mode?.name||'Standard') +
        '\n- Round: ' + round + '/5' +
        '\n- Phase: ' + (PHASES[phase]||'Unknown') + ' Phase' +
        '\n- VP: ' + ((vp['p'+speakerPlayer]||0)+(vp['p'+speakerPlayer+'sec']||0)) +
        '\n\n' + eventHint +
        '\n\nRespond as your character in ONE sentence (max 16 words). Raw battlefield quote only. Match tone examples exactly. No rules explanation.',
        [{role:'user',parts:[{text:'EVENT: '+description}]}],
        60, 1.0
      );
      setCmdReaction(prev=>prev&&prev.thinking?{...prev,text:text||'...',thinking:false}:prev);
      if(text){
        // If you've imported a Dawn-of-War-style voice bank for this faction
        // and this event has a clean category match, play a real bark
        // instead of speaking the (dynamically-generated) text aloud.
        const voiceFactionKey=(speaker.key||'').startsWith('SM')?'SM':speaker.key;
        const barkCategory=Object.entries(DOW_CATEGORY_TO_EVENTS).find(([,evs])=>evs.includes(primaryEvent))?.[0];
        const played=barkCategory&&AudioEngine.playVoiceBark(voiceFactionKey,barkCategory);
        if(!played) AudioEngine.speak(text,deriveVoiceProfile(speaker));
      }
    }catch(e){
      console.error('Gemini reaction error:',e);
      setCmdReaction(prev=>prev&&prev.thinking?{...prev,text:'Vox-link disrupted — hold position.',thinking:false}:prev);
    }finally{
      if(cmdReactionTimer.current) clearTimeout(cmdReactionTimer.current);
      cmdReactionTimer.current=setTimeout(()=>setCmdReaction(null),5000);
      if(reactionCooldownTimer.current) clearTimeout(reactionCooldownTimer.current);
      reactionCooldownTimer.current=setTimeout(()=>{
        reactionLockRef.current=false;
        if(reactionQueueRef.current.length) processReactionQueue();
      },REACTION_COOLDOWN_MS);
    }
  }

  function triggerReaction(eventType, details, reactingPlayer=null){
    // Only show commander reactions for the ACTIVE player's events
    // If no player specified, assume active player (safe default for own-turn events)
    // Never react to unit_destroyed events during the opponent's handling
    if(reactingPlayer!==null && reactingPlayer!==activePlayer) return;
    if(!p1Army?.factionId&&!p2Army?.factionId) return;
    // Extra guard: unit_destroyed reactions always use active player context
    reactionQueueRef.current.push({eventType, details, forPlayer: activePlayer});
    processReactionQueue();
  }



  // Army helpers
  const army1=p1Army;
  const army2=p2Army;
  const activeArmy=activePlayer===1?army1:army2;
  const inactiveArmy=activePlayer===1?army2:army1;

  // Fid for commander
  const fid=activeArmy?.factionId;
  const chapter=activeArmy?.chapter;
  let cmd=COMMANDERS[fid]||{name:'War Commander',title:'',voice:'You are a war commander. Give concise tactical advice for Warhammer 40K 10th Edition.'};
  if(fid==='SM'&&chapter){
    const key=SM_CHAPTERS.find(c=>c.name===chapter)?.id||'generic';
    cmd=SM_CHAPTER_COMMANDERS[key]||cmd;
  }



  // Stratagems for current phase/army
  const detStrats=activeArmy?.detachment?.stratagems||[];
  const phaseStrats=[...coreStrats,...detStrats].filter(s=>{
    const p=(s.phase||'').toLowerCase();
    const ph=PHASES[phase].toLowerCase();
    return !p||p.includes(ph)||p.includes('any');
  });

  // All units across both armies for wounds tracking
  const allUnits=[
    ...(army1?.units||[]).map(e=>({...e,player:1,army:army1})),
    ...(army2?.units||[]).map(e=>({...e,player:2,army:army2})),
  ];

  // Below Half-strength check (approximated from current wound ratio relative to max,
  // which matches the rule exactly for single-model units and gives a sensible signal
  // for squads using the app's simplified wound-tracking model).
  // Below Half-strength (core rules): multi-model units count REMAINING MODELS
  // vs Starting Strength; single-model units compare remaining wounds instead.
  function isBelowHalfStrength(entry){
    if(destroyed[entry.id]) return false;
    const u=entry.unit;
    const comp=u.unit_composition||[];
    let startModels=0;
    comp.forEach(c=>{const d=c.description||c.desc||String(c);const m=String(d).match(/^(\d+)/);if(m)startModels+=parseInt(m[1]);});
    if(!startModels) startModels=1;
    const perW=parseInt(u.models?.[0]?.w)||1;
    if(startModels<=1){
      const curW=wounds[entry.id]??perW;
      return curW<perW/2;
    }
    // Remaining models: prefer the per-model tracker if it exists, else derive
    // from the pooled wound total.
    const pmw=perModelWounds[entry.id];
    let alive;
    if(pmw&&Object.keys(pmw).length){
      alive=Array.from({length:startModels},(_,mi)=>pmw[mi]??perW).filter(w=>w>0).length;
    }else{
      const totalW=wounds[entry.id]??(startModels*perW);
      alive=Math.ceil(totalW/perW);
    }
    return alive<startModels/2;
  }
  const activeArmyShockCandidates=(activeArmy?.units||[]).filter(e=>isBelowHalfStrength(e)&&!destroyed[e.id]);

  function modCP(player,delta){
    setCP(c=>({...c,[`p${player}`]:Math.max(0,(c[`p${player}`]||0)+delta)}));
  }

  function modVP(player,type,delta){
    const key=`p${player}${type}`;
    setVP(v=>({...v,[key]:Math.max(0,(v[key]||0)+delta)}));
  }

  const p1Total=(vp.p1||0)+(vp.p1sec||0);
  const p2Total=(vp.p2||0)+(vp.p2sec||0);

  // Re-activate primary missions each new round (they score repeatedly)
  React.useEffect(()=>{
    setMissionCards(cs=>cs.map(c=>{
      if(c.type==='primary'&&c.status==='scored'&&c.lastScoredRound!==undefined&&c.lastScoredRound<round)
        return {...c,status:'active'};
      return c;
    }));
  },[round]);

  // Reset fight phase tracking when entering Fight Phase
  React.useEffect(()=>{
    if(phase===4){
      setFightPhaseStep(1);
      setFightActivated({});
    }
  },[phase]);

  // Reset activation tracking when phase changes + expire effects whose
  // duration has elapsed. Durations follow the 10th-edition timing rules:
  //  end_of_phase        → gone as soon as the phase changes
  //  end_of_turn         → gone when the turn passes (player switch / new round)
  //  end_of_round        → gone when a new battle round starts
  //  start_of_next_turn  → gone when the OWNING player's next turn begins
  //  battle/while_active → stay until removed manually
  const prevTiming=React.useRef({phase,activePlayer,round});
  React.useEffect(()=>{
    const prev=prevTiming.current;
    const phaseChanged=prev.phase!==phase||prev.activePlayer!==activePlayer||prev.round!==round;
    const turnChanged=prev.activePlayer!==activePlayer||prev.round!==round;
    const roundChanged=prev.round!==round;
    prevTiming.current={phase,activePlayer,round};
    if(!phaseChanged) return;
    setActivated({});
    setUnitAction({});
    setActiveEffects(fx=>fx.filter(f=>{
      const code=normalizeExpiry(f.expires);
      if(code==='end_of_phase') return false;
      if(code==='end_of_turn'&&turnChanged) return false;
      if(code==='end_of_round'&&roundChanged) return false;
      if(code==='start_of_next_turn'&&turnChanged&&(f.player==null||f.player===activePlayer)) return false;
      return true;
    }));
  },[phase,activePlayer,round]);

  // Reset battle-shock test results at the start of each new Command Phase for the active player
  React.useEffect(()=>{
    if(phase===0) setShockTests({});
  },[phase,activePlayer,round]);

  // Clear Battle-shocked status once a unit's controller reaches their next Command Phase
  React.useEffect(()=>{
    setBattleShocked(b=>{
      const next={...b};
      let changed=false;
      for(const [eid,info] of Object.entries(next)){
        if(info.player===activePlayer&&phase===0&&round>=info.until){
          delete next[eid];
          changed=true;
        }
      }
      return changed?next:b;
    });
  },[phase,activePlayer,round]);

  function endTurn(){
    setShowEndTurn(false);
    triggerReaction('round_end',`Round ${round}, ${activeArmy?.name||'army'} ends its turn`);
    setPhase(0); // Always reset to Command Phase
    if(!passPlay){
      setRound(r=>r+1);
      return;
    }
    if(activePlayer===firstPlayer){
      // Switch to other player
      setActivePlayer(activePlayer===1?2:1);
      setPhase(0);
    } else {
      // Both have gone — new round
      setActivePlayer(firstPlayer);
      setRound(r=>r+1);
      setPhase(0);
    }
  }



  // Phase-specific prompts
  const phasePrompts={
    0: activeArmy?.units?.filter(u=>u.unit.keywords?.some(k=>k.toLowerCase().includes('leader'))).map(u=>`${u.unit.name}: Check command abilities`)||[],
    2: activeArmy?.units?.filter(u=>(u.unit.weapons||[]).some(w=>w.type==='Ranged')).map(u=>u.unit.name)||[],
    3: activeArmy?.units?.filter(u=>!destroyed[u.id]).map(u=>u.unit.name)||[],
    4: allUnits.filter(e=>engaged[e.id]&&!destroyed[e.id]).map(e=>e.unit.name)||[],
  };

  return(
    <>
      {/* ── WAITING FOR CHALLENGER (online host) ── */}
      {remote&&!p2Army&&(
        <div style={{position:'fixed',inset:0,zIndex:450,background:'rgba(5,5,8,.96)',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:14,padding:24}}>
          <div style={{fontFamily:"'Cinzel',serif",fontSize:12,letterSpacing:3,color:'var(--brass)',textTransform:'uppercase'}}>Online Battle</div>
          <div style={{fontFamily:"'Cinzel',serif",fontSize:34,letterSpacing:10,color:'var(--gold)',border:'1px solid var(--goldborder)',padding:'12px 26px'}}>{remote.code}</div>
          <div style={{fontSize:11,color:'var(--text2)',textAlign:'center',maxWidth:300,lineHeight:1.7}}>
            Give this code to your opponent. On their device: <b>War → Join Online Battle</b>. The battle begins the moment they register their army.
          </div>
          <div className="spinner"/>
          <button className="btn btn-outline btn-sm" onClick={onEnd}>Cancel Battle</button>
        </div>
      )}
      {/* ── BATTLE HEADER ── */}
      <div style={{background:'var(--bg0)',borderBottom:'1px solid var(--goldborder)',flexShrink:0}}>
        {/* Active player banner */}
        <div style={{background:'var(--golddim)',borderBottom:'1px solid var(--goldborder)',padding:'5px 10px 5px 14px',display:'flex',justifyContent:'space-between',alignItems:'center',flexShrink:0}}>
          <div style={{fontFamily:"'Cinzel',serif",fontSize:11,fontWeight:700,color:'var(--gold)',letterSpacing:1}}>
            {activePlayer===1?p1Label:p2Label}'s Turn
          </div>
          <div style={{display:'flex',gap:6,alignItems:'center'}}>
            {remote&&<span style={{fontSize:9,color:'var(--blueBright)',border:'1px solid var(--blueBright)',padding:'0 5px',letterSpacing:2}}>🌐 {remote.code}</span>}
            <span style={{fontSize:9,color:'var(--text3)'}}>Round {round}/5</span>
            <span style={{fontSize:9,color:'var(--gold)'}}>{PHASES[phase]} Phase</span>
            <button className="btn-home" onClick={()=>setShowPause(true)} title="Pause / Main Menu"
              style={{width:26,height:26,fontSize:13,marginLeft:4}}>
              ⌂
            </button>

          </div>
        </div>
        {remote&&!canAct&&(
          <div style={{background:'rgba(74,122,184,.12)',borderBottom:'1px solid var(--blueBright)',padding:'4px 12px',fontSize:9,color:'var(--blueBright)',letterSpacing:1,textAlign:'center'}}>
            ⏳ {activePlayer===1?p1Label:p2Label} is taking their turn — you are watching live. Controls unlock on your turn.
          </div>
        )}
        {/* Score bar */}
        <div style={{display:'flex',alignItems:'stretch',borderBottom:'1px solid var(--border)'}}>
          <div style={{flex:1,padding:'6px 12px',background:activePlayer===1?'rgba(200,168,75,.06)':'transparent',borderRight:'1px solid var(--border)'}}>
            <div style={{fontSize:8,letterSpacing:2,color:'var(--text3)',fontFamily:"'Cinzel',serif",marginBottom:3}}>
              {(passPlay?p1Label:'YOU').toUpperCase()} {activePlayer===1&&<span style={{color:'var(--gold)'}}>◆ ACTIVE</span>}
              {defenderPlayer===1&&<span style={{fontSize:7,color:'var(--text3)',marginLeft:4,letterSpacing:.5}}>DEF</span>}
            </div>
            <div style={{display:'flex',gap:8,alignItems:'baseline'}}>
              <span style={{fontFamily:'Cinzel,serif',fontSize:20,fontWeight:700,color:'var(--gold)'}}>{p1Total}</span>
              <span style={{fontSize:9,color:'var(--text3)'}}>VP</span>
              <span style={{fontSize:9,color:'var(--text3)',marginLeft:4}}>{cp.p1}CP</span>
            </div>
          </div>

          <div style={{flex:1,padding:'6px 12px',background:activePlayer===2?'rgba(200,168,75,.06)':'transparent',borderLeft:'1px solid var(--border)',textAlign:'right'}}>
            <div style={{fontSize:8,letterSpacing:2,color:'var(--text3)',fontFamily:'Cinzel,serif',marginBottom:3}}>
              {passPlay?p2Label.toUpperCase():'OPPONENT'} {activePlayer===2&&<span style={{color:'var(--gold)'}}>◆ ACTIVE</span>}
            </div>
            <div style={{display:'flex',gap:8,alignItems:'baseline',justifyContent:'flex-end'}}>
              <span style={{fontSize:9,color:'var(--text3)'}}>{cp.p2}CP</span>
              <span style={{fontSize:9,color:'var(--text3)'}}>VP</span>
              <span style={{fontFamily:'Cinzel,serif',fontSize:20,fontWeight:700,color:'var(--text2)'}}>{p2Total}</span>
            </div>
          </div>
        </div>

        {/* Commander Reaction Toast */}
        {/* Fixed + above every modal (z-index 500 > .modal-overlay's 200) so a
            commander reaction firing mid-roll-off is never hidden behind the
            dice modal that triggered it. */}
        {cmdReaction&&(
          <div style={{
            position:'fixed',top:8,left:8,right:8,zIndex:500,
            display:'flex',alignItems:'center',gap:10,
            padding:'8px 12px',
            background:cmdReaction.player===1?'rgba(9,9,14,.97)':'rgba(14,9,9,.97)',
            border:`1px solid ${cmdReaction.accent}`,
            boxShadow:'0 4px 20px rgba(0,0,0,.5)',
            animation:'fadeIn .3s ease',
            cursor:'pointer',
          }} onClick={()=>setCmdReaction(null)}>
            {cmdReaction.img&&(
              <img src={cmdReaction.img} alt={cmdReaction.name}
                style={{width:36,height:36,objectFit:'cover',objectPosition:cmdReaction.imgPos||'center top',flexShrink:0,border:`1px solid ${cmdReaction.accent}`,opacity:.9}}
                onError={e=>{e.target.style.display='none'}}/>
            )}
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontFamily:"'Cinzel',serif",fontSize:9,fontWeight:700,color:cmdReaction.accent,letterSpacing:1,textTransform:'uppercase',marginBottom:2}}>{cmdReaction.name}</div>
              <div style={{fontSize:11,color:'var(--text2)',lineHeight:1.5,fontStyle:'italic',opacity:cmdReaction.thinking?0.55:1,transition:'opacity .2s'}}>{cmdReaction.text}</div>
            </div>
            <div style={{fontSize:10,color:'var(--text3)',flexShrink:0}}>✕</div>
          </div>
        )}

        {/* Phase bar */}
        <div className="phase-bar" style={{borderBottom:'none'}}>
          {PHASES.map((p,i)=>(
            <div key={p} className={`phase-btn ${phase===i?'active':''}`}
              style={{opacity:i<phase?0.5:i===phase?1:0.3,cursor:'default'}}>
              <span className="phase-btn-icon">{PHASE_ICONS[i]}</span>
              <span className="phase-btn-label">{i<phase?'✓':p.slice(0,3)}</span>
            </div>
          ))}

          <button className="anim-press" onClick={()=>{
              if(!canAct) return;
              playSFX('phase'); if(phase<4){
                // Check for unactivated units — warn before proceeding
                const activeUnits=(activeArmy?.units||[]).filter(e=>!destroyed[e.id]);
                const unactivated=activeUnits.filter(e=>!activated[e.id]);
                if(unactivated.length>0){setShowPhaseConfirm({count:unactivated.length,nextPhase:phase+1});}
                else{setPhase(p=>p+1);}
              }else{setShowEndTurn(true);}
            }}
            style={{padding:'8px 10px',background:phase<4?'var(--bg2)':'var(--reddim)',border:'none',cursor:'pointer',borderLeft:'1px solid var(--border)',flexShrink:0}}>
            <div style={{fontSize:8,letterSpacing:1,color:phase<4?'var(--gold)':'var(--redBright)',fontFamily:"'Cinzel',serif"}}>{phase<4?'NEXT':'END'}</div>
            <div style={{fontSize:8,letterSpacing:1,color:phase<4?'var(--text3)':'var(--redBright)',fontFamily:"'Cinzel',serif"}}>{phase<4?PHASES[phase+1]?.slice(0,5)?.toUpperCase():'TURN'}</div>
          </button>
        </div>
      </div>

      {/* Tabs */}
      <div className="tabs" style={{padding:'0 12px',flexShrink:0}}>
        {[
          {k:'battle',l:'Score'},
          {k:'units',l:'Battlefield'},
          {k:'actions',l:'Actions'},
        ].map(t=>(
          <div key={t.k} className={`tab ${tab===t.k?'active':''}`}
            onClick={()=>{setTab(t.k);playSFX('activate');}}
            style={{fontSize:9,padding:'8px 10px'}}>
            {t.l}
          </div>
        ))}
        <div className={`tab tab-commander ${showCommander?'active':''}`} onClick={()=>setShowCommander(true)} style={{fontSize:9}}>
          ⚔ COMMANDER
        </div>
      </div>

      <div style={{flex:1,overflow:'hidden',display:'flex',flexDirection:'column'}}>

        {/* ── SCORE TAB ── */}
        {tab==='battle'&&(
          <div style={{flex:1,overflowY:'auto',padding:12}}>

            {/* Command Phase — CP, Battle-shock, Stratagems */}
            {phase===0&&(<div style={{marginBottom:10}}>{(()=>{
              const cpGainedThisRound=cpGainedRound[`p${activePlayer}`]===round;
              return(
              <div style={{background:'var(--bg1)',border:'1px solid var(--goldborder)',borderLeft:'3px solid var(--gold)',padding:'10px 12px',marginBottom:8}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
                  <div style={{fontFamily:"'Cinzel',serif",fontSize:10,letterSpacing:2,color:'var(--gold)',textTransform:'uppercase'}}>Command Phase</div>
                  <div style={{fontSize:11,color:'var(--gold)',fontFamily:"'Cinzel',serif",fontWeight:700}}>{cp[`p${activePlayer}`]||0} CP</div>
                </div>

                {/* Step 1: Gain CP */}
                <div style={{marginBottom:10}}>
                  <div style={{fontSize:9,letterSpacing:1.5,color:'var(--brass)',textTransform:'uppercase',fontFamily:"'Cinzel',serif",marginBottom:5}}>1. Command Points</div>
                  <div style={{fontSize:10,color:'var(--text2)',marginBottom:6,lineHeight:1.5}}>
                    Gain 1CP at the start of your Command Phase (max 1CP/round from all sources combined).
                  </div>
                  <button className={`btn btn-sm ${cpGainedThisRound?'btn-outline':'btn-gold'}`} style={{width:'100%'}}
                    disabled={cpGainedThisRound||!canAct}
                    onClick={()=>{
                      modCP(activePlayer,1);
                      setCpGainedRound(c=>({...c,[`p${activePlayer}`]:round}));
                    }}>
                    {cpGainedThisRound?'✓ CP Gained This Round':'Gain 1 CP'}
                  </button>
                </div>

                {/* Step 2: Battle-shock */}
                <div style={{marginBottom:10}}>
                  <div style={{fontSize:9,letterSpacing:1.5,color:'var(--brass)',textTransform:'uppercase',fontFamily:"'Cinzel',serif",marginBottom:5}}>2. Battle-shock Tests</div>
                  {activeArmyShockCandidates.length===0?(
                    <div style={{fontSize:10,color:'var(--text3)',fontStyle:'italic'}}>No units below half-strength.</div>
                  ):(
                    <div style={{display:'flex',flexDirection:'column',gap:4}}>
                      {activeArmyShockCandidates.map(e=>{
                        const result=shockTests[e.id];
                        const ld=parseInt((e.unit.models?.[0]?.ld||'7').replace('+',''))||7;
                        return(
                          <div key={e.id} style={{background:'var(--bg2)',border:'1px solid var(--border)',padding:'7px 10px'}}>
                            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:result?0:6}}>
                              <span style={{fontSize:10,fontFamily:"'Cinzel',serif",color:'var(--text)'}}>{e.unit.name}</span>
                              <span style={{fontSize:9,color:'var(--text3)'}}>Need {ld}+ on 2D6</span>
                            </div>
                            {result?(
                              <div style={{fontSize:9,color:result==='passed'?'var(--greenBright)':'var(--redBright)',letterSpacing:.5,fontWeight:700}}>
                                {result==='passed'?'✓ PASSED':'✗ FAILED — Battle-shocked until next Command Phase'}
                              </div>
                            ):(
                              <div style={{display:'flex',gap:4}}>
                                <button className="btn btn-xs btn-gold" style={{flex:1}}
                                  onClick={()=>{setShockTests(s=>({...s,[e.id]:'passed'}));triggerReaction('battle_shock_passed',e.unit.name);}}>Passed</button>
                                <button className="btn btn-xs btn-danger" style={{flex:1}}
                                  onClick={()=>{
                                    setShockTests(s=>({...s,[e.id]:'failed'}));
                                    setBattleShocked(b=>({...b,[e.id]:{until:round+1,player:activePlayer}}));
                                    triggerReaction('battle_shock_failed',e.unit.name);
                                  }}>Failed</button>
                              </div>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>

                {/* Step 3: Stratagems */}
                <div style={{marginBottom:4}}>
                  <div style={{fontSize:9,letterSpacing:1.5,color:'var(--brass)',textTransform:'uppercase',fontFamily:"'Cinzel',serif",marginBottom:5}}>3. Command Phase Abilities &amp; Stratagems</div>
                  <button className="btn btn-outline btn-sm" style={{width:'100%'}} onClick={()=>setStratForUnit({unit:{name:'Command Phase'},id:'_cmd'})}>
                    Use a Stratagem
                  </button>
                </div>
              </div>
              );
            })()} </div>)}

            {/* ── ARMY RULE ── faction-wide ability for the active player */}
            {(()=>{
              const army=activePlayer===1?p1Army:p2Army;
              const enemy=activePlayer===1?p2Army:p1Army;
              const rule=ARMY_ABILITIES[army?.factionId];
              if(!rule) return null;
              const useKey=`p${activePlayer}:${rule.name}`;
              const used=!!armyAbilityUsed[useKey];
              const enemyUnits=(enemy?.units||[]).filter(e=>!destroyed[e.id]);
              const ownUnits=(army?.units||[]).filter(e=>!destroyed[e.id]);
              // Current army-wide instance of this rule for this player (e.g. Oath target already marked)
              const current=activeEffects.find(f=>f.name.startsWith(rule.name)&&f.player===activePlayer);
              const selOption=rule.options?.[armyRuleOptionIdx]||null;

              function activateArmyRule(){
                const mods=(selOption?selOption.modifiers:rule.modifiers)||[];
                const targetEntry=rule.targeting==='enemy_unit'?enemyUnits.find(e=>e.id===armyRuleTargetId):null;
                const ownEntry=rule.targeting==='own_unit'?ownUnits.find(e=>e.id===armyRuleUnitId):null;
                if(rule.targeting==='enemy_unit'&&!targetEntry) return;
                if(rule.targeting==='own_unit'&&!ownEntry) return;
                // Replace any previous instance of this army rule: a new Oath
                // target replaces the old one; a unit can only have one Order.
                setActiveEffects(fx=>fx.filter(f=>{
                  const base=f.name.split(':')[0].split(' → ')[0].trim();
                  if(base!==rule.name||f.player!==activePlayer) return true;
                  return ownEntry ? f.unitId!==ownEntry.id : false;
                }));
                const label=selOption?`${rule.name}: ${selOption.name}`:rule.name;
                const name=targetEntry?`${label} → ${stripHTML(targetEntry.unit.name)}`:label;
                addEffect(name,army?.factionName||'Army rule',
                  (selOption?selOption.summary:'').slice(0,90),
                  rule.duration||'start_of_next_turn',
                  ownEntry?ownEntry.id:null,
                  {player:activePlayer,modifiers:mods,targetUnitId:targetEntry?.id||null});
                if(rule.cadence==='once_per_battle') setArmyAbilityUsed(u=>({...u,[useKey]:true}));
                logAction(army?.factionName||'Army',rule.name.toUpperCase(),selOption?.name||stripHTML(targetEntry?.unit?.name||''));
                triggerReaction('ability_used',rule.name);
              }

              const canActivate=(rule.modifiers||rule.options)&&(rule.cadence!=='once_per_battle'||!used);
              return(
                <div style={{background:'var(--bg1)',border:'1px solid var(--goldborder)',borderLeft:'3px solid var(--brass)',padding:'8px 12px',marginBottom:8}}>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',cursor:'pointer'}} onClick={()=>setArmyRuleOpen(o=>!o)}>
                    <div style={{fontSize:9,letterSpacing:2,color:'var(--brass)',fontFamily:"'Cinzel',serif",textTransform:'uppercase'}}>
                      Army Rule · {rule.name}
                    </div>
                    <span style={{fontSize:9,color:'var(--text3)'}}>{armyRuleOpen?'▲':'▼'}</span>
                  </div>
                  {armyRuleOpen&&(
                    <div style={{marginTop:6}}>
                      <div style={{fontSize:10,color:'var(--text2)',lineHeight:1.55,marginBottom:6}}>{rule.summary}</div>
                      {current&&(
                        <div style={{fontSize:9,color:'var(--gold)',marginBottom:6}}>
                          ✦ Active: {current.name} · lasts {expiryLabel(current.expires)}
                        </div>
                      )}
                      {rule.cadence==='once_per_battle'&&used&&!current&&(
                        <div style={{fontSize:9,color:'var(--text3)',marginBottom:6}}>Already used this battle.</div>
                      )}
                      {canActivate&&(
                        <div style={{display:'flex',flexDirection:'column',gap:5}}>
                          {rule.options&&(
                            <select value={armyRuleOptionIdx} onChange={e=>setArmyRuleOptionIdx(parseInt(e.target.value))}
                              style={{background:'var(--bg2)',color:'var(--text)',border:'1px solid var(--border)',padding:'5px 6px',fontSize:11}}>
                              {rule.options.map((o,i)=>(<option key={i} value={i}>{o.name}</option>))}
                            </select>
                          )}
                          {selOption&&<div style={{fontSize:9,color:'var(--text3)'}}>{selOption.summary}</div>}
                          {rule.targeting==='enemy_unit'&&(
                            <select value={armyRuleTargetId} onChange={e=>setArmyRuleTargetId(e.target.value)}
                              style={{background:'var(--bg2)',color:'var(--text)',border:'1px solid var(--border)',padding:'5px 6px',fontSize:11}}>
                              <option value="">— select enemy unit —</option>
                              {enemyUnits.map(e=>(<option key={e.id} value={e.id}>{stripHTML(e.unit.name)}</option>))}
                            </select>
                          )}
                          {rule.targeting==='own_unit'&&(
                            <select value={armyRuleUnitId} onChange={e=>setArmyRuleUnitId(e.target.value)}
                              style={{background:'var(--bg2)',color:'var(--text)',border:'1px solid var(--border)',padding:'5px 6px',fontSize:11}}>
                              <option value="">— select your unit —</option>
                              {ownUnits.map(e=>(<option key={e.id} value={e.id}>{stripHTML(e.unit.name)}</option>))}
                            </select>
                          )}
                          <button className="btn btn-gold btn-sm" style={{width:'100%'}}
                            disabled={(rule.targeting==='enemy_unit'&&!armyRuleTargetId)||(rule.targeting==='own_unit'&&!armyRuleUnitId)||!canAct}
                            onClick={activateArmyRule}>
                            {rule.cadence==='once_per_battle'?`Use ${rule.name}`:rule.targeting==='enemy_unit'?'Mark Target':rule.targeting==='own_unit'?'Issue to Unit':'Activate'}
                          </button>
                        </div>
                      )}
                      {!rule.modifiers&&!rule.options&&rule.cadence==='once_per_battle'&&!used&&(
                        <button className="btn btn-outline btn-sm" style={{width:'100%'}}
                          onClick={()=>{setArmyAbilityUsed(u=>({...u,[useKey]:true}));logAction(army?.factionName||'Army',rule.name.toUpperCase(),'used');triggerReaction('ability_used',rule.name);}}>
                          Mark {rule.name} as used
                        </button>
                      )}
                    </div>
                  )}
                </div>
              );
            })()}

            {/* Active Effects */}
            {activeEffects.length>0&&(
              <div style={{background:'var(--bg1)',border:'1px solid var(--border)',padding:'8px 12px',marginBottom:8}}>
                <div style={{fontSize:9,letterSpacing:2,color:'var(--brass)',fontFamily:"'Cinzel',serif",textTransform:'uppercase',marginBottom:6}}>Active Effects</div>
                {activeEffects.map(fx=>(
                  <div key={fx.id} style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',padding:'5px 0',borderBottom:'1px solid rgba(42,42,58,.5)'}}>
                    <div style={{flex:1}}>
                      <div style={{fontSize:11,color:'var(--gold)',fontFamily:"'Cinzel',serif",marginBottom:1}}>
                        {fx.name}{!fx.unitId&&<span style={{fontSize:8,color:'var(--brass)',marginLeft:5}}>ARMY-WIDE · P{fx.player||'?'}</span>}
                      </div>
                      <div style={{fontSize:9,color:'var(--text3)'}}>{fx.source} · Lasts {expiryLabel(fx.expires)}</div>
                      {(fx.modifiers||[]).length>0&&(
                        <div style={{display:'flex',gap:3,flexWrap:'wrap',marginTop:2}}>
                          {fx.modifiers.map((m,i)=>(
                            <span key={i} style={{fontSize:8,padding:'0 4px',background:'var(--golddim)',border:'1px solid var(--goldborder)',color:'var(--gold)'}}>{m.label}</span>
                          ))}
                        </div>
                      )}
                      {fx.desc&&<div style={{fontSize:9,color:'var(--text2)',marginTop:2}}>{fx.desc}</div>}
                    </div>
                    <button onClick={()=>removeEffect(fx.id)} style={{background:'none',border:'none',color:'var(--text3)',cursor:'pointer',fontSize:11,paddingLeft:8,flexShrink:0}}>✕</button>
                  </div>
                ))}
              </div>
            )}

            {/* Fight Phase Priority Queue — shown in Score tab during phase 4 */}
            {phase===4&&(()=>{
              const getBothEntries=()=>[
                ...(p1Army?.units||[]).map(e=>({...e,_player:1})),
                ...(passPlay?(p2Army?.units||[]).map(e=>({...e,_player:2})):[]),
              ];
              const allE=getBothEntries();
              const eligible=allE.filter(e=>{
                if(destroyed[e.id]||fightActivated[e.id]) return false;
                const ci=chargedUnits[e.id];
                const cThisTurn=ci?.round===round&&chargeSuccess[e.id]===true;
                const cPrev=ci&&ci.round<round&&chargeSuccess[e.id]===true;
                return engaged[e.id]||cThisTurn||cPrev;
              });
              const fought=allE.filter(e=>fightActivated[e.id]&&!destroyed[e.id]);
              if(!eligible.length&&!fought.length) return null;
              const priority=e=>{
                const ci=chargedUnits[e.id];
                if((ci?.round===round&&chargeSuccess[e.id]===true)||(e.unit?.keywords||[]).some(k=>(k||'').toLowerCase().includes('fights first'))||(e.unit?.abilities||[]).some(a=>(a.name||'').toLowerCase().includes('fights first'))) return 1;
                if((e.unit?.keywords||[]).some(k=>(k||'').toLowerCase().includes('fights last'))) return 3;
                return 2;
              };
              const groups={1:[],2:[],3:[]};
              eligible.forEach(e=>{const p=priority(e);groups[p].push(e);});
              return(
                <div style={{marginBottom:10}}>
                  <div style={{fontSize:9,letterSpacing:2,color:'var(--brass)',fontFamily:"'Cinzel',serif",textTransform:'uppercase',marginBottom:6,paddingBottom:4,borderBottom:'1px solid var(--goldborder)'}}>
                    Fight Phase — Priority Order
                  </div>
                  <div style={{fontSize:9,color:'var(--text3)',marginBottom:6,lineHeight:1.6}}>
                    {groups[1].length?<span>Defender picks first among <strong style={{color:'var(--gold)'}}>Fights First</strong> units. </span>:null}
                    {!groups[1].length&&groups[2].length?<span>Active player picks first. </span>:null}
                    Alternate activations after first selection.
                  </div>
                  {[{p:1,label:'Fights First',color:'var(--gold)'},{p:2,label:'Normal Combat',color:'var(--text2)'},{p:3,label:'Fights Last',color:'var(--text3)'}].map(({p,label,color})=>{
                    const units=groups[p]||[];
                    if(!units.length) return null;
                    return(
                      <div key={p} style={{marginBottom:5}}>
                        <div style={{fontSize:8,color,letterSpacing:.5,marginBottom:2,textTransform:'uppercase'}}>{label}</div>
                        {units.map(e=>(
                          <div key={e.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'4px 8px',marginBottom:1,background:'var(--bg1)',border:`1px solid ${color}44`}}>
                            <span style={{fontSize:10,color,fontFamily:"'Cinzel',serif"}}>{stripHTML(e.unit?.name)}</span>
                            <span style={{fontSize:8,color:'var(--text3)'}}>{e._player===1?(passPlay?p1Label:'You'):(passPlay?p2Label:'Opp')}</span>
                          </div>
                        ))}
                      </div>
                    );
                  })}
                  {fought.length>0&&<div style={{marginTop:4,fontSize:8,color:'var(--greenBright)'}}>✓ Fought this phase: {fought.map(e=>stripHTML(e.unit?.name)).join(', ')}</div>}

                    </div>

                </div>
              );
            })()}

            {/* Fight-back callout — shows which enemy units can fight back NOW */}
            {phase===4&&(()=>{

            {[{p:1,label:passPlay?'Player 1':'You'},{p:2,label:passPlay?'Player 2':'Opponent'}].map(({p,label})=>(
              <div key={p} style={{background:'var(--bg1)',border:'1px solid var(--border)',padding:12,marginBottom:8}}>
                <div style={{fontFamily:'Cinzel,serif',fontSize:10,letterSpacing:2,color:p===activePlayer?'var(--gold)':'var(--text3)',marginBottom:10,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                  {label.toUpperCase()}
                  <span style={{fontSize:9,color:'var(--text3)'}}>TOTAL: {(vp[`p${p}`]||0)+(vp[`p${p}sec`]||0)}VP</span>
                </div>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8,marginBottom:8}}>
                  {[
                    {label:'Primary VP',vpKey:'',color:'var(--gold)'},
                    {label:'Secondary VP',vpKey:'sec',color:'var(--blueBright)'},
                  ].map(f=>(
                    <div key={f.label} style={{background:'var(--bg2)',border:'1px solid var(--border)',padding:'6px 8px',textAlign:'center'}}>
                      <div style={{fontSize:8,color:'var(--text3)',letterSpacing:.5,fontFamily:'Cinzel,serif',marginBottom:4,textTransform:'uppercase'}}>{f.label}</div>
                      <div style={{fontFamily:'Cinzel,serif',fontSize:18,fontWeight:700,color:f.color,marginBottom:4}}>
                        {vp[`p${p}${f.vpKey}`]||0}
                      </div>
                      <div style={{display:'flex',gap:2,justifyContent:'center'}}>
                        <button onClick={()=>modVP(p,f.vpKey,-1)} className="counter-btn" style={{width:20,height:20,fontSize:12}}>−</button>
                        <button onClick={()=>{modVP(p,f.vpKey,1);if(p!==ap){triggerReaction('enemy_vp');}else{triggerReaction('own_vp');}}} className="counter-btn" style={{width:20,height:20,fontSize:12}}>+</button>
                      </div>
                    </div>
                  ))}
                  <div style={{background:'var(--bg2)',border:'1px solid var(--border)',padding:'6px 8px',textAlign:'center'}}>
                    <div style={{fontSize:8,color:'var(--text3)',letterSpacing:.5,fontFamily:'Cinzel,serif',marginBottom:4,textTransform:'uppercase'}}>Command Pts</div>
                    <div style={{fontFamily:'Cinzel,serif',fontSize:18,fontWeight:700,color:'var(--text2)',marginBottom:4}}>{cp[`p${p}`]||0}</div>
                    <div style={{display:'flex',gap:2,justifyContent:'center'}}>
                      <button onClick={()=>modCP(p,-1)} className="counter-btn" style={{width:20,height:20,fontSize:12}}>−</button>
                      <button onClick={()=>modCP(p,1)} className="counter-btn" style={{width:20,height:20,fontSize:12}}>+</button>
                    </div>
                  </div>
                </div>
              </div>
            ))}

            {/* Battle Round */}
            <div style={{background:'var(--bg1)',border:'1px solid var(--border)',padding:12,marginBottom:8}}>
              <div className="section-label" style={{marginTop:0}}>Battle Round</div>
              <div style={{display:'flex',gap:4}}>
                {[1,2,3,4,5].map(r=>(
                  <button key={r} className={`size-btn ${round===r?'active':''}`}
                    style={{flex:1,textAlign:'center'}} onClick={()=>setRound(r)}>{r}</button>

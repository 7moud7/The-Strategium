            </div>

            {/* Rules Reference */}
            <div style={{background:'var(--bg1)',border:'1px solid var(--border)',padding:12,marginBottom:8}}>
              <details>
                <summary style={{fontFamily:"'Cinzel',serif",fontSize:9,letterSpacing:3,color:'var(--brass)',textTransform:'uppercase',cursor:'pointer',userSelect:'none',listStyle:'none',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                  <span>Phase Rules Reference</span><span style={{fontSize:11}}>▾</span>
                </summary>
                <div style={{marginTop:10}}>
                  <RulesRefPanel phase={phase} army={activeArmy} coreStrats={coreStrats}/>
                </div>
              </details>
            </div>




            {/* ── MISSION CARDS ─────────────────────────────────────────── */}
            {(()=>{
              const primaryCards=missionCards.filter(c=>c.type==='primary'&&c.status==='active');
              const mySecCards=missionCards.filter(c=>c.type!=='primary'&&c.status==='active'&&(c.player===activePlayer||!c.player));
              const allActive=[...primaryCards,...mySecCards];
              const scoredHistory=missionCards.filter(c=>c.status==='scored'||c.status==='failed');
              if(allActive.length===0&&scoredHistory.length===0) return null;
              return(
                <div style={{marginTop:8}}>
                  <div className="section-label" style={{marginTop:0}}>Mission Cards</div>
                  {allActive.map(card=>(
                    <MissionCardRow key={card.id} card={card} activePlayer={activePlayer} passPlay={passPlay}
                      missionCards={missionCards} setMissionCards={setMissionCards}
                      modVP={modVP} logAction={logAction} triggerReaction={triggerReaction} round={round}/>
                  ))}
                  {/* History */}
                  {scoredHistory.length>0&&(
                    <div style={{fontSize:9,color:'var(--text3)',letterSpacing:.5,marginTop:6,display:'flex',flexWrap:'wrap',gap:4}}>
                      {scoredHistory.map(c=>(
                        <span key={c.id} style={{
                          padding:'1px 6px',background:'var(--bg0)',border:`1px solid ${c.status==='scored'?'var(--greenBright)':'var(--red)'}`,
                          color:c.status==='scored'?'var(--greenBright)':'var(--redBright)',fontSize:8,letterSpacing:.5,
                        }}>
                          {c.status==='scored'?'✓':'✕'} {c.name}
                        </span>
                      ))}
                    </div>
                  )}
                </div>
              );
            })()}
          </div>
        )}

        {/* ── UNITS TAB ── */}
        {/* ── BATTLEFIELD TAB ── */}
        {tab==='units'&&(
          <div style={{flex:1,overflowY:'auto',padding:10}}>

            {/* Phase context header */}
            {(()=>{
              // Phase actions sourced from WH40K 10th Ed Core Rules
              const PHASE_ACTIONS={
                0:[ // Command Phase
                  {id:'cp',label:'1. Gain Command Points',desc:'Both players gain 1CP. Outside of this, each player can only gain a maximum of 1CP per battle round from all other sources combined.'},
                  {id:'battleshock',label:'2. Battle-shock Tests',desc:'Take a Battle-shock test (2D6 vs LD) for each of your units that is Below Half-strength. Failed = Battle-shocked until your next Command Phase: OC becomes 0, cannot use Stratagems on them, must take Desperate Escape tests if they Fall Back.'},
                  {id:'abilities',label:'3. Command Phase Abilities',desc:'Resolve any other rules that trigger in the Command Phase (abilities, auras, detachment rules).'},
                ],
                1:[ // Movement Phase — Step 1: Move Units
                  {id:'move',label:'Normal Move',desc:'Move up to M″. No model can end within Engagement Range (1″ horizontal / 5″ vertical) of any enemy.'},
                  {id:'advance',label:'Advance',desc:'Roll D6 and add to M″ for this phase. Cannot shoot (except Assault weapons) or declare a charge this turn.'},
                  {id:'stationary',label:'Remain Stationary',desc:'Do not move any models. Weapons with [HEAVY] gain +1 to Hit this turn.'},
                  {id:'fallback',label:'Fall Back (if in ER)',desc:'Only available if within Engagement Range. Move up to M″ away — can move through enemy models (Desperate Escape tests for each). Cannot shoot or charge this turn.'},
                  {id:'reinforce',label:'Set Up Reinforcements',desc:'In the Reinforcements step: set up any Reserves units. They count as having made a Normal move this turn. Cannot be set up within 9″ of enemies.'},
                ],
                2:[ // Shooting Phase
                  {id:'shoot',label:'Select Unit & Shoot',desc:'Unit eligible unless it: Advanced (except Assault weapons), Fell Back, or is within Engagement Range of enemy (except Pistols, and Monsters/Vehicles). Select targets — must be visible and within range. Resolve Hit rolls, Wound rolls, Saving Throws.'},
                  {id:'pistol',label:'Shoot with Pistol only',desc:'If within Engagement Range: can ONLY shoot Pistols, and only at units you are in Engagement Range of. Cannot combine Pistols with other weapons (unless Monster/Vehicle).'},
                  {id:'skip',label:'Skip Shooting',desc:'Unit does not shoot this turn.'},
                ],
                3:[ // Charge Phase
                  {id:'charge',label:'Declare Charge',desc:'Eligible if: within 12″ of an enemy, did NOT Advance or Fall Back this turn, and is NOT already within Engagement Range. Roll 2D6 — must be enough to end within Engagement Range of all targets without touching non-targets. On success, charging unit gains Fights First until end of turn.'},
                  {id:'skip',label:'Skip Charge',desc:'Unit does not declare a charge this phase.'},
                ],
                4:[ // Fight Phase — alternating, non-active player starts
                  {id:'fightsfirst',label:'Fights First units fight',desc:'Units with Fights First ability (or that made a Charge move this turn) fight first. Alternate between players starting with non-active player. For each unit: 1) Pile In up to 3″ (must end closer to nearest enemy), 2) Make melee attacks, 3) Consolidate up to 3″ (must end closer to nearest enemy or towards objective).'},
                  {id:'fight',label:'Remaining units fight',desc:'All remaining eligible units fight. Eligible = within Engagement Range of enemy OR made a Charge move this turn. Alternate between players starting with non-active player. Same sequence: Pile In → Attacks → Consolidate.'},
                  {id:'counter',label:'Counter-Offensive (2CP)',desc:'Just after an enemy unit has fought: spend 2CP to fight immediately with one of your eligible units within Engagement Range that has not yet fought.'},
                ],
              };
              const phaseActions=PHASE_ACTIONS[phase]||[];
              const activeUnits=(activeArmy?.units||[]).filter(e=>!destroyed[e.id]);
              const allActivated=activeUnits.length>0&&activeUnits.every(e=>activated[e.id]);
              const activatedCount=activeUnits.filter(e=>activated[e.id]).length;

              return(
                <>
                  {/* Phase header */}
                  <div style={{background:'var(--bg1)',border:'1px solid var(--goldborder)',borderLeft:'3px solid var(--gold)',padding:'9px 12px',marginBottom:8,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                    <div>
                      <div style={{fontFamily:"'Cinzel',serif",fontSize:10,letterSpacing:2,color:'var(--gold)',textTransform:'uppercase',marginBottom:3}}>{PHASES[phase]} Phase</div>
                      <div style={{fontSize:9,color:'var(--text3)'}}>{activatedCount}/{activeUnits.length} units activated</div>
                    </div>
                    <div style={{display:'flex',alignItems:'center',gap:6}}>
                      {activeUnits.length>0&&(
                        <div style={{height:4,width:60,background:'var(--bg3)',overflow:'hidden'}}>
                          <div style={{height:'100%',width:`${activeUnits.length?activatedCount/activeUnits.length*100:0}%`,background:'var(--gold)',transition:'width .3s'}}/>
                        </div>
                      )}
                      {allActivated&&activeUnits.length>0&&(
                        <div style={{fontSize:9,color:'var(--greenBright)',letterSpacing:1,fontFamily:"'Cinzel',serif"}}>ALL DONE</div>
                      )}
                    </div>
                  </div>

                  {/* Phase actions quick-ref */}
                  <div style={{marginBottom:8}}>
                    <details>
                      <summary style={{fontSize:9,letterSpacing:1.5,color:'var(--brass)',fontFamily:"'Cinzel',serif",textTransform:'uppercase',cursor:'pointer',listStyle:'none',display:'flex',justifyContent:'space-between',alignItems:'center',padding:'5px 8px',background:'var(--bg1)',border:'1px solid var(--border)'}}>
                        <span>Phase Actions</span><span style={{fontSize:10}}>▾</span>
                      </summary>
                      <div style={{border:'1px solid var(--border)',borderTop:'none'}}>
                        {phaseActions.map(a=>(
                          <div key={a.id} style={{padding:'6px 10px',borderBottom:'1px solid rgba(42,42,58,.5)',display:'flex',gap:8,alignItems:'flex-start'}}>
                            <div style={{width:5,height:5,background:'var(--gold)',flexShrink:0,marginTop:4,transform:'rotate(45deg)'}}/>
                            <div>
                              <div style={{fontFamily:"'Cinzel',serif",fontSize:10,color:'var(--text)',letterSpacing:.3,marginBottom:1}}>{a.label}</div>
                              <div style={{fontSize:9,color:'var(--text3)',lineHeight:1.4}}>{a.desc}</div>
                            </div>
                          </div>
                        ))}
                      </div>
                    </details>
                  </div>
                </>
              );
            })()}

            {/* Unit list — active player's army always shown first and expanded;
                the other player's army is collapsed by default to keep focus on whoever is acting. */}
            {[
              {army:army1,player:1,label:passPlay?p1Label:null},
              // In fight phase, always show opponent section so fight-back can be resolved
              {army:army2,player:2,label:passPlay?p2Label:(phase===4?'Opponent (Fight Phase)':null)},
            ].filter(a=>a.army)
              .sort((a,b)=>(a.player===activePlayer?-1:1)-(b.player===activePlayer?-1:1))
              .map(({army,player,label})=>{
                const isActiveSection=player===activePlayer;
                const sectionOpen=oppSectionOpen[player]??isActiveSection;
                return(
              <div key={player}>
                {label&&(
                  <div className="section-label" style={{marginTop:4,display:'flex',justifyContent:'space-between',alignItems:'center',cursor:isActiveSection?'default':'pointer'}}
                    onClick={isActiveSection?undefined:()=>setOppSectionOpen(s=>({...s,[player]:!sectionOpen}))}>
                    <span>{label}{isActiveSection?' (Active)':''}</span>
                    {!isActiveSection&&<span style={{fontSize:10,color:'var(--text3)'}}>{sectionOpen?'▾ Hide':'▸ Show'}</span>}
                  </div>
                )}
                {(isActiveSection||sectionOpen)&&(army.units||[]).map(entry=>{
                  const u=entry.unit;
                  // Unit wound pool = models in the unit × wounds per model
                  // (using only the first profile's W made a 10-Boy mob show 1/1W)
                  const perModelW=parseInt(u.models?.[0]?.w)||1;
                  const unitModels=(()=>{const c=u.unit_composition||[];let t=0;c.forEach(x=>{const m=String(x.description||x.desc||x).match(/^(\d+)/);if(m)t+=parseInt(m[1]);});return t||1;})();
                  const maxW=perModelW*unitModels;
                  const curW=wounds[entry.id]??maxW;
                  const pct=Math.max(0,(curW/maxW)*100);
                  const isDestroyed=destroyed[entry.id];
                  const isEngaged=engaged[entry.id];
                  const isActive=player===activePlayer;
              // In fight phase, engaged enemy units can also activate (fight-back)
              const canActInFightPhase=phase===4&&!isActive&&(engaged[entry.id]||chargedUnits[entry.id]);
                  const isActivated=!!activated[entry.id];
                  const chosenAction=unitAction[entry.id];
                  const wc=curW<=0||isDestroyed?'var(--redBright)':curW<=maxW/3?'#ffaa44':curW<=maxW*2/3?'#ddcc44':'#66cc80';

                  // Context-aware actions for this unit based on phase + unit state
                  const unitPhaseActions=(()=>{
                    // Fight phase is the one exception to "only the active player's
                    // units get actions" — an inactive-army unit that's engaged (or
                    // charged) gets its own Fight action so it can strike back in
                    // the same combat, per the alternating-activations rule. Every
                    // other phase stays active-player-only.
                    if(!isActive&&!(phase===4&&canActInFightPhase)) return [];
                    const kws=(u.keywords||[]).map(k=>k.toLowerCase());
                    const abilities=(u.abilities||[]).map(a=>(a.name||'').toLowerCase());
                    const hasAdvanced=unitAction[entry.id]==='advance';
                    // Any active battle effect (army rule, stratagem) granting
                    // Advance & Charge counts too — e.g. Waaagh!, Fights First
                    // detachment rules — not just a datasheet ability.
                    const fxAllowsAdvanceCharge=(activeEffects||[]).some(f=>
                      (!f.unitId||f.unitId===entry.id)&&(f.modifiers||[]).some(m=>m.stat==='advance_and_charge'));
                    const movedUnits=Object.entries(unitAction).filter(([id,v])=>['move','advance'].includes(v)).map(([id])=>id);
                    const isVehicle=kws.includes('vehicle')||kws.includes('monster');

                    // Actions per core rules based on phase + unit state
                    const prevAction=unitAction[entry.id];
                    const didAdvance=prevAction==='advance';
                    const didFallBack=prevAction==='fallback';
                    const isInER=isEngaged; // tracked via "In Combat" toggle in fight phase
                    const rangedWeapons=(u.weapons||[]).filter(w=>w.type==='Ranged'||(w.type||'').toLowerCase()==='ranged');
                    const hasAssault=rangedWeapons.some(w=>{
                      const ab=(w.abilities||w.keywords||'').toLowerCase();
                      return ab.includes('assault');
                    });
                    const hasPistol=rangedWeapons.some(w=>(w.abilities||'').toLowerCase().includes('pistol'));
                    const hasChargeException=fxAllowsAdvanceCharge||(u.abilities||[]).some(a=>
                      parseModifiersFromText(a.description||a.rule||a.effect||'').some(m=>m.stat==='advance_and_charge'));

                    switch(phase){
                      case 0: // Command Phase — phase-level, not unit-level
                        return [{id:'done',label:'Command Phase resolved',note:''}];

                      case 1: // Movement Phase
                        return [
                          {id:'move',label:'Normal Move',note:'Up to M″'},
                          {id:'advance',label:'Advance',note:'+D6″, no shooting* or charge'},
                          {id:'stationary',label:'Remain Stationary',note:'Heavy weapons get +1 Hit'},
                          // Fall Back only if in Engagement Range
                          ...(isInER?[{id:'fallback',label:'Fall Back',note:'No shoot or charge this turn'}]:[]),
                        ];

                      case 2: { // Shooting Phase
                        // Advanced: can only shoot if weapon has [ASSAULT]
                        // Fell Back: cannot shoot at all
                        // In Engagement Range: can only shoot Pistols
                        const fellBack=prevAction==='fallback'||fallbackUnits[entry.id]===round;
                        const inER_shoot=isInER;
                        if(fellBack) return [{id:'skip',label:'Cannot Shoot',note:'Fell Back this turn — cannot shoot or charge'}];
                        if(inER_shoot&&!hasPistol) return [{id:'skip',label:'Cannot Shoot',note:'In Engagement Range, no Pistols'}];
                        if(didAdvance&&!hasAssault&&!hasPistol) return [
                          {id:'skip',label:'Cannot Shoot',note:'Advanced this turn (no Assault weapons)'},
                        ];
                        return [
                          ...(!didAdvance||hasAssault?[{id:'shoot',label:'Shoot',note:inER_shoot?'Pistols only against units in ER':didAdvance?'Assault weapons only':''}]:[]),
                          ...(inER_shoot&&hasPistol&&!(!didAdvance||hasAssault)?[{id:'shoot',label:'Shoot Pistols',note:'At units in Engagement Range only'}]:[]),
                          {id:'skip',label:'Skip Shooting',note:''},
                        ].filter((a,i,arr)=>arr.findIndex(x=>x.id===a.id)===i);
                      }

                      case 3: { // Charge Phase
                        // Cannot charge if: Advanced (without exception), Fell Back, already in ER
                        const fellBack3=prevAction==='fallback'||fallbackUnits[entry.id]===round;
                        const alreadyInER=isInER;
                        if(fellBack3) return [{id:'skip',label:'Cannot Charge',note:'Fell Back this turn — cannot charge'}];
                        if(alreadyInER) return [{id:'skip',label:'Cannot Charge',note:'Already in Engagement Range'}];
                        const canCharge=!didAdvance||hasChargeException;
                        return [
                          ...(canCharge?[{id:'charge',label:'Declare Charge',note:didAdvance&&hasChargeException?'Exception ability overrides Advance restriction':'Roll 2D6 — beat distance to target'}]:[]),
                          ...(!canCharge?[{id:'skip',label:'Cannot Charge',note:'Advanced this turn'}]:[]),
                          {id:'skip',label:'Skip Charge',note:''},
                        ].filter((a,i,arr)=>a.id!=='skip'||arr.filter(x=>x.id==='skip').indexOf(a)===0);
                      }

                      case 4: { // Fight Phase — priority system per rules
                        const chargedInfo=chargedUnits[entry.id];
                        const chargedThisTurn=chargedInfo?.round===round&&chargeSuccess[entry.id]===true;
                        const chargedPrevRound=chargedInfo&&chargedInfo.round<round&&chargeSuccess[entry.id]===true;
                        const alreadyFought=fightActivated[entry.id];
                        const hasFell=fallbackUnits[entry.id]===round;

                        // Can't fight if: already fought, fell back this round, or not eligible
                        if(alreadyFought) return [{id:'skip',label:'Already Fought',note:'This unit has already fought this phase'}];
                        if(hasFell) return [{id:'skip',label:'Fell Back',note:'Cannot fight after falling back'}];

                        const eligibleFight=isInER||chargedThisTurn||chargedPrevRound;
                        if(!eligibleFight) return [{id:'skip',label:'Not Eligible',note:'Not in Engagement Range — did not charge or not in combat'}];

                        // Determine priority
                        const hasFightsFirst=(u.keywords||[]).some(k=>(k||'').toLowerCase().includes('fights first'))||
                          (u.abilities||[]).some(a=>(a.name||'').toLowerCase().includes('fights first'));
                        const isFightsFirst=chargedThisTurn||hasFightsFirst;
                        const isFightsLast=(u.keywords||[]).some(k=>(k||'').toLowerCase().includes('fights last'))||
                          (u.abilities||[]).some(a=>(a.name||'').toLowerCase().includes('fights last'));

                        // Priority label for display
                        const priorityNote=isFightsFirst
                          ?`Priority 1 — ${chargedThisTurn?'Charged':'Fights First ability'} · ${isActive?'Defender picks first among Fights First units':'Alternate activations'}`
                          :isFightsLast
                            ?'Priority 3 — Fights Last · Active player picks first'
                            :'Priority 2 — Normal · Active player picks first';

                        return [
                          {id:'fight',label:'Fight',note:priorityNote,priority:isFightsFirst?1:isFightsLast?3:2},
                          {id:'skip',label:'Pass',note:'Pass — opponent may now activate'},
                        ];
                      }

                      default: return [];
                    }
                  })();

                  // Fight phase context: melee weapons when engaged
                  const meleWeapons=(u.weapons||[]).filter(w=>w.type==='Melee'||(w.type||'').toLowerCase()==='melee');
                  const showFightContext=phase===4&&isEngaged&&!isDestroyed&&isActive;

                  // Phase-relevant abilities
                  const phaseAbilNames={0:['command','aura','buff'],1:['move','advance','swift','scout'],2:['shoot','fire','range'],3:['charge','pile in','martial'],4:['fight','melee','combat','attack','strikes']};
                  const relevantAbils=(u.abilities||[]).filter(a=>{
                    // Leader/Epic Hero/Supreme Commander/Damaged are permanent army-building
                    // or state-driven rules, never a phase-triggered action — exclude them
                    // here the same way the other ability lists in the app already do.
                    const nameOnly=(a.name||'').toLowerCase().trim();
                    if(nameOnly==='leader'||nameOnly==='supreme commander'||nameOnly==='epic hero'||nameOnly.startsWith('leader (')||nameOnly.startsWith('damaged')) return false;
                    const n=nameOnly+' '+(a.description||'').toLowerCase();
                    return (phaseAbilNames[phase]||[]).some(kw=>n.includes(kw));
                  });

                  return(
                    <div key={entry.id} style={{
                      background:isDestroyed?'var(--reddim)':isActivated?'rgba(58,138,58,.04)':'var(--bg1)',
                      border:`1px solid ${isDestroyed?'var(--red)':isActivated?'var(--greenBright)':(isEngaged&&phase===4)?'#c6a':isActive?'var(--border)':'rgba(42,42,58,.4)'}`,
                      marginBottom:5,opacity:isDestroyed?0.6:isActive?1:0.7,
                      transition:'all .15s',
                    }}>
                      {/* Unit header row */}
                      <div style={{display:'flex',alignItems:'center',gap:8,padding:'8px 10px'}}>
                        {/* Status dot */}
                        <div style={{width:8,height:8,flexShrink:0,
                          background:isDestroyed?'var(--redBright)':isActivated?'var(--greenBright)':isEngaged?'var(--blueBright)':'var(--border)',
                          transform:'rotate(45deg)',
                        }}/>
                        <div style={{flex:1,minWidth:0}}>
                          <div style={{fontSize:12,fontFamily:"'Cinzel',serif",letterSpacing:.3,
                            color:isDestroyed?'var(--text3)':isActivated?'var(--greenBright)':'var(--text)',
                            textDecoration:isDestroyed?'line-through':'underline dotted rgba(200,168,75,.4)',
                            marginBottom:1,cursor:'pointer'}}
                            onClick={()=>setUnitDetailModal({...entry,_armyFactionId:army.factionId,_siblings:army.units})}
                            title="Tap to view stats, weapons & abilities">{entryDisplayName(entry,army.units)}</div>
                          {/* Model count from sizeIdx */}
                          {(()=>{
                            const sIdx=entry.sizeIdx||0;
                            const costDesc=u.costs?.[sIdx]?.description||u.costs?.[0]?.description||'';
                            const countMatch=costDesc.match(/(\d+)\s*model/i);
                            if(!countMatch) return null;
                            return(
                              <div style={{fontSize:9,color:'var(--text3)',marginBottom:2,letterSpacing:.3}}>
                                {countMatch[1]} models
                              </div>
                            );
                          })()}
                          <div style={{display:'flex',gap:3,flexWrap:'wrap'}}>
                            {isDestroyed&&<span style={{fontSize:8,color:'var(--redBright)',border:'1px solid var(--red)',padding:'1px 4px',letterSpacing:.5}}>DESTROYED</span>}
                            {battleShocked[entry.id]&&!isDestroyed&&<span style={{fontSize:8,color:'#ffaa44',border:'1px solid #ffaa44',padding:'1px 4px',letterSpacing:.5}} title="OC 0 · Cannot be targeted by Stratagems · Desperate Escape if Falls Back">⚡ BATTLE-SHOCKED</span>}
                            {isActivated&&!isDestroyed&&<span style={{fontSize:8,color:'var(--greenBright)',border:'1px solid var(--greenBright)',padding:'1px 4px',letterSpacing:.5}}>ACTIVATED{chosenAction?' · '+chosenAction.toUpperCase():''}</span>}
                            {isEngaged&&!isDestroyed&&<span style={{fontSize:8,color:'#c6a',border:'1px solid #c6a',padding:'1px 4px',letterSpacing:.5}}>⚔ IN COMBAT{chargedUnits[entry.id]?.round===round?' · CHARGED':''}</span>}
                            {!isActive&&!isDestroyed&&!canActInFightPhase&&<span style={{fontSize:8,color:'var(--text3)',border:'1px solid var(--border)',padding:'1px 4px',letterSpacing:.5}}>INACTIVE</span>}
                          </div>
                        </div>
                        {!isDestroyed&&(
                          <div style={{textAlign:'right',flexShrink:0}}>
                            <span style={{fontSize:13,fontWeight:700,color:wc,fontFamily:"'Cinzel',serif"}}>{curW}</span>
                            <span style={{fontSize:9,color:'var(--text3)'}}>/{maxW}W</span>
                          </div>
                        )}
                      </div>

                      {!isDestroyed&&(
                        <>
                          {/* Wound bar */}
                          <div style={{height:2,background:'var(--bg3)',margin:'0 10px 6px'}}>
                            <div style={{height:'100%',width:`${pct}%`,background:wc,transition:'width .3s'}}/>
                          </div>

                          {/* PHASE ACTIONS — active player only, not yet activated */}
                          {canAct&&(isActive||canActInFightPhase)&&!isActivated&&unitPhaseActions.length>0&&(
                            <div style={{padding:'0 10px 6px'}}>
                              <div style={{fontSize:8,letterSpacing:1.5,color:'var(--text3)',textTransform:'uppercase',fontFamily:"'Cinzel',serif",marginBottom:4}}>Select Action</div>
                              <div style={{display:'flex',gap:3,flexWrap:'wrap'}}>
                                {unitPhaseActions.map(a=>(
                                  <button key={a.id}
                                    onClick={()=>{
                                      playSFX('activate');
                                      setUnitAction(ua=>({...ua,[entry.id]:a.id}));
                                      setActivated(ac=>({...ac,[entry.id]:true}));
                                      logAction(u.name,a.label.toUpperCase(),a.note||'',0,()=>{setActivated(ac=>({...ac,[entry.id]:false}));setUnitAction(ua=>{const n={...ua};delete n[entry.id];return n;});});
                                      // Fall Back: disengage + mark so unit can't fight/charge/shoot this turn
                                      if(a.id==='fallback'){
                                        setEngaged(g=>({...g,[entry.id]:false}));
                                        setChargeSuccess(cs=>({...cs,[entry.id]:false}));
                                        setFallbackUnits(fb=>({...fb,[entry.id]:round}));
                                        triggerReaction('fallback',u.name);
                                      }
                                      // Shoot opens the Shooting Assistant directly on this unit
                                      if(a.id==='shoot') setShootingUnit(entry);
                                      // Fight: mark as activated in fight phase, open roller
                                      if(a.id==='fight'){
                                        setFightActivated(fa=>({...fa,[entry.id]:true}));
                                        setFightUnit(entry);
                                      }
                                      // Charge: mark as charged; prompt for success confirmation
                                      if(a.id==='charge'){
                                        playSFX('charge'); setChargedUnits(c=>({...c,[entry.id]:round}));
                                        // Show charge confirmation after a tick
                                        setTimeout(()=>{
                                          setChargeSuccess(cs=>({...cs,[entry.id]:'pending'}));
                                        },100);
                                      }
                                    }}
                                    style={{
                                      fontSize:9,padding:'4px 8px',cursor:'pointer',
                                      background:'var(--bg2)',border:'1px solid var(--border)',
                                      color:'var(--text2)',letterSpacing:.3,transition:'all .1s',
                                      fontFamily:"'Cinzel',serif",textTransform:'uppercase',
                                    }}
                                    onMouseEnter={e=>{e.currentTarget.style.borderColor='var(--gold)';e.currentTarget.style.color='var(--gold)';}}
                                    onMouseLeave={e=>{e.currentTarget.style.borderColor='var(--border)';e.currentTarget.style.color='var(--text2)';}}>
                                    {a.label}
                                    {a.note&&<span style={{fontSize:8,color:'var(--brass)',marginLeft:4}}>({a.note})</span>}
                                  </button>
                                ))}
                                {/* Use Stratagem — opens inline stratagem picker for this unit */}
                                <button
                                  onClick={()=>setStratForUnit(entry)}
                                  style={{fontSize:9,padding:'4px 8px',cursor:'pointer',background:'transparent',border:'1px solid var(--goldborder)',color:'var(--brass)',letterSpacing:.3}}>
                                  Stratagem
                                </button>
                                <button onClick={()=>{setUnitAction(ua=>({...ua,[entry.id]:'skip'}));setActivated(ac=>({...ac,[entry.id]:true}));}}
                                  style={{fontSize:9,padding:'4px 8px',cursor:'pointer',background:'transparent',border:'1px solid var(--border)',color:'var(--text3)',letterSpacing:.3}}>
                                  Skip
                                </button>
                              </div>
                            </div>
                          )}

                          {/* Already activated — show chosen action with undo */}
                          {(isActive||canActInFightPhase)&&isActivated&&(
                            <div style={{padding:'0 10px 6px',display:'flex',alignItems:'center',gap:6}}>
                              <div style={{fontSize:9,color:'var(--greenBright)',flex:1}}>
                                ✓ {chosenAction?chosenAction.replace(/_/g,' ').toUpperCase():'ACTIVATED'}
                              </div>
                              <button onClick={()=>{
                                setActivated(ac=>({...ac,[entry.id]:false}));
                                setUnitAction(ua=>{const n={...ua};delete n[entry.id];return n;});
                                // Fight is the only phase action gated by a second,
                                // separate flag (fightActivated) — undoing the choice
                                // must also clear it, or the unit stays stuck as
                                // "Already Fought" forever (e.g. after accidentally
                                // dismissing the Fight roller before it resolved).
                                if(chosenAction==='fight') setFightActivated(fa=>{const n={...fa};delete n[entry.id];return n;});
                              }}
                                style={{fontSize:8,padding:'2px 6px',background:'none',border:'1px solid var(--border)',color:'var(--text3)',cursor:'pointer',letterSpacing:.5}}>
                                Undo
                              </button>
                            </div>
                          )}

                          {/* FIGHT PHASE — melee weapons for engaged units */}
                          {showFightContext&&meleWeapons.length>0&&(
                            <div style={{padding:'0 10px 6px',borderTop:'1px solid var(--border)'}}>
                              <div style={{fontSize:8,letterSpacing:1.5,color:'#c6a',textTransform:'uppercase',fontFamily:"'Cinzel',serif",margin:'5px 0 3px'}}>Melee Weapons</div>
                              {meleWeapons.map((w,i)=>(
                                <div key={i} style={{display:'flex',justifyContent:'space-between',padding:'2px 0',fontSize:10,color:'var(--text2)'}}>
                                  <span style={{fontFamily:"'Cinzel',serif",fontSize:10}}>{w.name}</span>
                                  <span style={{fontSize:9,color:'var(--text3)'}}>A:{w.attacks} S:{w.strength} AP:{w.ap} D:{w.damage}</span>
                                </div>
                              ))}
                            </div>
                          )}

                          {/* Ability activation */}
                          {isActive&&relevantAbils.length>0&&(
                            <div style={{padding:'0 10px 6px',borderTop:'1px solid var(--border)'}}>
                              <div style={{fontSize:8,letterSpacing:1.5,color:'var(--gold)',textTransform:'uppercase',fontFamily:"'Cinzel',serif",margin:'5px 0 4px'}}>Phase Abilities</div>
                              {relevantAbils.slice(0,4).map((a,i)=>{
                                const parsed=parseAbility(a);
                                const alreadyActive=activeEffects.some(fx=>fx.name===a.name&&fx.unitId===entry.id);
                                return(
                                  <div key={i} style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:3,padding:'4px 6px',background:'var(--bg2)',border:`1px solid ${alreadyActive?'var(--gold)':'var(--border)'}`}}>
                                    <div style={{flex:1,minWidth:0,cursor:'pointer'}} onClick={()=>setAbilityIntel(a)} title="Tap for full ability info">
                                      <div style={{fontSize:10,color:alreadyActive?'var(--gold)':'var(--text)',letterSpacing:.3,textDecoration:'underline dotted rgba(200,168,75,.4)'}}>{a.name}</div>
                                      {parsed?.leaderOnly&&<div style={{fontSize:8,color:'var(--blueBright)',letterSpacing:.5}}>Leader only</div>}
                                    </div>
                                    {alreadyActive?(
                                      <span style={{fontSize:8,color:'var(--gold)',border:'1px solid var(--gold)',padding:'1px 4px',letterSpacing:.5,flexShrink:0}}>ACTIVE</span>
                                    ):(
                                      <button
                                        style={{fontSize:8,padding:'3px 7px',background:'var(--bg1)',border:'1px solid var(--goldborder)',color:'var(--gold)',cursor:'pointer',letterSpacing:.5,flexShrink:0}}
                                        onClick={()=>{addEffect(a.name,u.name,parsed?.rawText?.slice(0,80)||'',parsed?.durationCode||'end_of_phase',entry.id,{modifiers:parsed?.modifiers||[]});logAction(u.name,'ABILITY',a.name);triggerReaction('ability_used',a.name);}}>
                                        Use
                                      </button>
                                    )}
                                  </div>
                                );
                              })}
                            </div>
                          )}

                          {/* Per-model wound tracking for multi-model units */}
                          {(()=>{
                            // Get actual model count from unit_composition (e.g. "9 Boyz + 1 Boss Nob")
                            function getCompositionCount(unit){
                              const comp=unit.unit_composition||[];
                              if(!comp.length) return parseInt(unit.models?.length)||1;
                              // Parse "X ModelName" entries and sum them
                              let total=0;
                              comp.forEach(c=>{
                                const desc=c.description||c.desc||String(c);
                                const m=desc.match(/^(\d+)/);
                                if(m) total+=parseInt(m[1]);
                              });
                              return total||parseInt(unit.models?.length)||1;
                            }
                            // Get per-stat-profile wound value (first profile = leader/boss if 2 profiles)
                            function getProfileWounds(unit, profileIdx){
                              return parseInt(unit.models?.[profileIdx]?.w)||parseInt(unit.models?.[0]?.w)||1;
                            }
                            const modelCount=getCompositionCount(u);
                            const modelWounds=parseInt(u.models?.[0]?.w)||1;
                            const isMultiModel=modelCount>1;
                            const pmw=perModelWounds[entry.id]||{};
                            // Initialize model wounds if needed
                            const getModelW=(mi)=>pmw[mi]??modelWounds;
                            const totalW=isMultiModel
                              ? Array.from({length:modelCount},(_,mi)=>getModelW(mi)).reduce((a,b)=>a+b,0)
                              : (wounds[entry.id]??maxW);
                            const isModelDead=(mi)=>getModelW(mi)<=0;
                            const aliveModels=isMultiModel?Array.from({length:modelCount},(_,mi)=>mi).filter(mi=>!isModelDead(mi)).length:1;

                            // Model labels from composition: "Boss Nob", "Makari", etc.
                            function modelLabel(mi,unit){
                              // Build named slots from unit_composition
                              const comp=unit.unit_composition||[];
                              const slots=[];
                              comp.forEach(c=>{
                                const desc=stripHTML(c.description||c.desc||String(c));
                                // Range entries ("9-19 Boyz") have no space between the
                                // count and the dash, so this must be checked BEFORE the
                                // plain "N Name" match below — otherwise it falls through
                                // and the raw "9-19 Boyz" string gets used as a model name.
                                const rangeM=desc.match(/^(\d+)-\d+\s+(.+)/);
                                const m=rangeM||desc.match(/^(\d+)\s+(.+)/);
                                if(m){
                                  const cnt=parseInt(m[1]), nm=m[2].trim();
                                  for(let i=0;i<cnt;i++) slots.push(nm);
                                } else {
                                  slots.push(desc.trim());
                                }
                              });
                              if(slots[mi]) return slots[mi];
                              // Fallback: use stat profile name for each profile index
                              const profileName=stripHTML(unit.models?.[mi]?.name||unit.models?.[0]?.name||'');
                              if(profileName&&profileName.toLowerCase()!==stripHTML(unit.name||'').toLowerCase()){
                                return profileName;
                              }
                              // Last resort: unit name + number
                              return `${stripHTML(unit.name||'Model')} ${mi+1}`;
                            }
                            // Get identifying weapons per model from wargear
                            function modelWeaponLabel(mi,unit,entryWargear){
                              if(mi===0&&unit.models?.length===1) return '';
                              const kws=(unit.keywords||[]).map(k=>k.toLowerCase());
                              // Boss nob / sergeant is always first model
                              if(mi===0){
                                if(kws.includes('character')) return '★ Character';
                                const bossKws=['boss','nob','sergeant','champion','leader'];
                                if(bossKws.some(k=>unit.name?.toLowerCase().includes(k))) return '⊕ Boss';
                                return '⊕ Leader';
                              }
                              // Try to find distinct weapon from wargear
                              const special=['meltagun','plasma','flamer','heavy bolter','lascannon','rocket','missile','grenade'];
                              if(entryWargear?.selected){
                                const sel=JSON.stringify(entryWargear.selected).toLowerCase();
                                const found=special.find(w=>sel.includes(w));
                                if(found) return `[${found}]`;
                              }
                              return '';
                            }

                            const overrideOpen=!!manualOverrideOpen[entry.id];
                            return(
                              <div style={{padding:'4px 10px 8px'}}>
                                {/* Wound/destroy resolution happens automatically when an attack
                                    is resolved in the Combat Roller — these controls are for the
                                    rare case that needs a manual correction (terrain, a mission
                                    rule, an undo), so they stay tucked away until asked for. */}
                                <button className="btn btn-xs btn-ghost" style={{width:'100%',marginBottom:overrideOpen?6:0,fontSize:8,letterSpacing:1}}
                                  onClick={()=>setManualOverrideOpen(m=>({...m,[entry.id]:!overrideOpen}))}>
                                  {overrideOpen?'▲ Hide Manual Override':'⚙ Manual Override'}
                                </button>
                                {overrideOpen&&(<>
                                {isMultiModel&&(
                                  <div style={{marginBottom:6}}>
                                    <div style={{fontSize:8,letterSpacing:1.5,color:'var(--text3)',textTransform:'uppercase',fontFamily:"'Cinzel',serif",marginBottom:4}}>
                                      Models ({aliveModels}/{modelCount} alive)
                                    </div>
                                    <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(90px,1fr))',gap:3}}>
                                      {Array.from({length:modelCount},(_,mi)=>{
                                        const mw=getModelW(mi);
                                        const dead=isModelDead(mi);
                                        const wlabel=modelWeaponLabel(mi,u,entry.wargear);
                                        return(
                                          <div key={mi} style={{
                                            background:dead?'var(--reddim)':mw<modelWounds?'rgba(200,168,75,.05)':'var(--bg2)',
                                            border:`1px solid ${dead?'var(--red)':mw<modelWounds?'#ddcc44':'var(--border)'}`,
                                            padding:'4px 6px',opacity:dead?0.5:1,
                                          }}>
                                            <div style={{fontSize:9,color:mi===0?'var(--gold)':'var(--text)',fontFamily:"'Cinzel',serif",marginBottom:2,textDecoration:dead?'line-through':'none'}}>
                                              {modelLabel(mi,u)}{wlabel?<span style={{fontSize:7,color:'var(--brass)',marginLeft:2}}>{wlabel}</span>:null}
                                            </div>
                                            {!dead&&(
                                              <div style={{fontSize:10,color:'var(--text2)',marginBottom:3}}>{mw}/{modelWounds}W</div>
                                            )}
                                            {dead?(
                                              <div style={{fontSize:8,color:'var(--redBright)',letterSpacing:.5}}>DEAD</div>
                                            ):(
                                              <div style={{display:'flex',gap:2}}>
                                                <button className="counter-btn" style={{width:18,height:18,fontSize:10,background:'var(--reddim)',color:'var(--redBright)',border:'1px solid var(--red)'}}
                                                  onClick={()=>{
                                                    const newW=Math.max(0,mw-1);
                                                    setPerModelWounds(p=>({...p,[entry.id]:{...p[entry.id],[mi]:newW}}));
                                                    // Update total wounds
                                                    const totalAfter=Array.from({length:modelCount},(_,j)=>j===mi?newW:getModelW(j)).reduce((a,b)=>a+b,0);
                                                    setWounds(w=>({...w,[entry.id]:totalAfter}));
                                                    logAction(u.name,`Wound dealt`,`${modelLabel(mi,u)} → ${newW}/${modelWounds}W`,-0,()=>{
                                                      setPerModelWounds(p=>({...p,[entry.id]:{...p[entry.id],[mi]:mw}}));
                                                      const t2=Array.from({length:modelCount},(_,j)=>j===mi?mw:getModelW(j)).reduce((a,b)=>a+b,0);
                                                      setWounds(w=>({...w,[entry.id]:t2}));
                                                    });
                                                  }}>−</button>
                                                <button className="counter-btn" style={{width:18,height:18,fontSize:10}}
                                                  onClick={()=>{
                                                    const newW=Math.min(modelWounds,mw+1);
                                                    setPerModelWounds(p=>({...p,[entry.id]:{...p[entry.id],[mi]:newW}}));
                                                    const t2=Array.from({length:modelCount},(_,j)=>j===mi?newW:getModelW(j)).reduce((a,b)=>a+b,0);
                                                    setWounds(w=>({...w,[entry.id]:t2}));
                                                  }}>+</button>
                                              </div>
                                            )}
                                          </div>
                                        );
                                      })}
                                    </div>
                                    {/* Auto-destroy when all models dead */}
                                    {aliveModels===0&&!isDestroyed&&(
                                      <button className="btn btn-xs btn-danger" style={{width:'100%',marginTop:4}}
                                        onClick={()=>{playSFX('destroy'); setDestroyed(d=>({...d,[entry.id]:true})); setEngaged(g=>({...g,[entry.id]:false})); triggerReaction('unit_destroyed',u.name);logAction(u.name,'DESTROYED','All models slain');}}>
                                        Mark Unit Destroyed
                                      </button>
                                    )}
                                  </div>
                                )}
                                {/* Single-model or total wound bar */}
                                {!isMultiModel&&(
                                  <div style={{display:'flex',gap:3,flexWrap:'wrap'}}>
                                    <button className="btn btn-sm btn-danger" style={{flex:1,minWidth:48}}
                                      onClick={()=>{
                                        const prev=wounds[entry.id]??maxW;
                                        const nw=Math.max(0,prev-1);
                                        playSFX('wound'); setWounds(w=>({...w,[entry.id]:nw}));
                                        logAction(u.name,'WOUND',`${nw}/${maxW}W remaining`,0,()=>setWounds(w=>({...w,[entry.id]:prev})));
                                      }}>− W</button>
                                    <button className="btn btn-sm btn-outline"
                                      onClick={()=>setWounds(w=>({...w,[entry.id]:Math.min(maxW,(w[entry.id]??maxW)+1)}))}>+ W</button>
                                    <button className="btn btn-sm btn-outline"
                                      onClick={()=>setWounds(w=>({...w,[entry.id]:maxW}))}>Full</button>
                                  </div>
                                )}
                                {!isDestroyed&&(
                                  <button className="btn btn-xs btn-danger" style={{width:'100%',marginTop:4}}
                                    onClick={()=>{playSFX('destroy'); setDestroyed(d=>({...d,[entry.id]:true})); setEngaged(g=>({...g,[entry.id]:false})); triggerReaction('unit_destroyed',u.name);logAction(u.name,'DESTROYED','',0,()=>setDestroyed(d=>({...d,[entry.id]:false})));}}>
                                    Mark Destroyed
                                  </button>
                                )}
                                </>)}
                                {phase===4&&(
                                  <div style={{display:'flex',gap:3,marginTop:4,flexWrap:'wrap'}}>
                                    <button className="btn btn-sm btn-outline" style={{flex:1}}
                                      onClick={()=>{
                                        const next=!isEngaged;
                                        setEngaged(g=>({...g,[entry.id]:next}));
                                        if(next){triggerReaction('unit_charged',u.name);logAction(u.name,'IN COMBAT','Engaged in melee',0,()=>setEngaged(g=>({...g,[entry.id]:false})));}
                                      }}>
                                      {isEngaged?'Not in Combat':'In Combat'}
                                    </button>
                                  </div>
                                )}
                              </div>
                            );
                          })()}
                        </>
                      )}
                      {isDestroyed&&(
                        <button className="btn btn-xs btn-outline" style={{margin:'4px 10px 8px',display:'block'}}
                          onClick={()=>{setDestroyed(d=>({...d,[entry.id]:false}));setWounds(w=>({...w,[entry.id]:maxW}));}}>
                          Restore
                        </button>
                      )}
                    </div>
                  );
                })}
              </div>
            );})}
          </div>
        )}

        {/* ── ACTIONS LOG TAB ── */}
        {tab==='actions'&&(
          <div style={{flex:1,overflowY:'auto',padding:10}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
              <span style={{fontSize:9,letterSpacing:1.5,color:'var(--brass)',fontFamily:"'Cinzel',serif",textTransform:'uppercase'}}>
                Battle Actions — {actionLog.length} recorded
              </span>
              {actionLog.length>0&&(

                        {passPlay?(entry.player===1?p1Label:p2Label):(entry.player===activePlayer?'YOU':'OPP')}

                      <span style={{fontSize:8,color:'var(--text3)'}}>R{entry.round} · {PHASES[entry.phase]?.slice(0,4)}</span>

                      {entry.action}
                    </div>
                    {entry.detail&&<div style={{fontSize:9,color:'var(--text3)',lineHeight:1.4}}>{entry.detail}</div>}
                  </div>
                  {entry.undoFns&&(
                    <button className="btn btn-xs btn-outline" style={{flexShrink:0}} onClick={()=>{
                      entry.undoFns();
                      setActionLog(l=>l.filter(a=>a.id!==entry.id));
                      actionLogRef.current=actionLogRef.current.filter(a=>a.id!==entry.id);
                    }}>↩ Undo</button>
                  )}
                </div>
              </div>
            ))}
          </div>
        )}


      </div>

      {/* Phase Confirmation Modal — unactivated units */}
      {showPhaseConfirm&&(
        <div className="modal-overlay">
          <div className="modal anim-slide-up" style={{maxWidth:360}}>

            </div>

              <button className="btn btn-outline" style={{flex:1}} onClick={()=>setShowPhaseConfirm(null)}>← Stay</button>

            </div>

      {/* Pause / Save Game Modal */}

        const fightUnitIsActive=(activeArmy?.units||[]).some(e=>e.id===fightUnit.id);

                      <button className="btn btn-xs btn-gold" style={{marginTop:6,width:'100%'}} disabled={!canAfford}
                        onClick={()=>{
                          modCP(activePlayer,-cost);
                          logAction(unitDetailModal.unit.name,`STRATAGEM: ${s.name}`,`${cost}CP`,0,()=>modCP(activePlayer,cost));
                          triggerReaction('stratagem_used',s.name);

                    </div>
                  );
                })}
              </div>
            </div>
          </div>
        </div>
      )}

      {/* Commander Panel */}
      {showCommander&&(
        <CommanderPanel
          battle={battle}
          activePlayer={activePlayer}
          round={round}
          phase={phase}
          cp={cp}
          vp={vp}
          wounds={wounds}
          destroyed={destroyed}
          engaged={engaged}
          coreStrats={coreStrats}
          rulesData={rulesData}
          missionCards={missionCards}
          onClose={()=>setShowCommander(false)}
        />
      )}
    </>
  );
}



// ── STABLE SCREEN WRAPPER ────────────────────────────────────────────────────
// Several screens below (ArmyScreen, CollectionScreen, UnitBrowserScreen, …)
// are declared as nested functions inside App() because they close over a lot
// of App's state and setters. The cost: a plain `function X(){...}` declared
// inside a component body is a NEW function object every render, so
// `<X/>` gets a different element `type` each time — React reads that as "a
// different component" and unmounts/remounts the whole screen, wiping its own
// local state (which unit panel was open, which faction you were browsing,
// search text, wizard step…). That's the bug behind "changing a box count /
// adding a unit kicks me back a few steps": any App-level state change
// (adding a unit, editing a box) re-renders App, which redeclares the screen
// function, which resets it.
//
// stableScreen(key) returns a component whose identity never changes across
// renders. Call `registerScreen(key, fn)` once per App render with that
// render's freshly-closed-over screen function, then render `<Stable/>` —
// React keeps reusing the same wrapper type forever, so the screen's own
// hooks/state persist exactly like a normal top-level component's would.
const __screenSlots={};
function registerScreen(key,fn){ __screenSlots[key]=fn; }
function stableScreen(key){
  const Wrapper=(props)=> (__screenSlots[key]?__screenSlots[key](props):null);
  Wrapper.displayName='Stable_'+key;
  return Wrapper;
}
const StableMenuScreen=stableScreen('menu');
const StableArmiesScreen=stableScreen('armies');
const StableFactionsScreen=stableScreen('factions');
const StableSmChapterScreen=stableScreen('smChapter');
const StableDetachmentsScreen=stableScreen('detachments');
const StableArmyScreen=stableScreen('army');
const StableUnitBrowserScreen=stableScreen('unitBrowser');
const StableCollectionScreen=stableScreen('collection');
const StableAoSWarscrollsScreen=stableScreen('aosWarscrolls');

// ── MAIN APP ──────────────────────────────────────────────────────────────────

function App(){
  const [appOpen,setAppOpen]=useState(false);
  const [index,setIndex]=useState(null);
  const [indexStatus,setIndexStatus]=useState('loading');
  const [coreStrats,setCoreStrats]=useState([]);
  const [screen,setScreen]=useState('armies');
  const [tab,setTab]=useState('roster');
  // Ambient soundtrack for everywhere that isn't a live battle (menu, Armoury,
  // Collection, setup screens); BattleScreen takes over with its own
  // faction-coloured palette while a battle is open, then this resumes.

  const [storagePersisted,setStoragePersisted]=useState(null);

  // Personal sound-pack import (Settings & Backup → Audio). Reads a .zip you

  const [soundImportBusy,setSoundImportBusy]=useState(false);
  const [soundImportReview,setSoundImportReview]=useState(null); // {sfx,voice} pending matches
  const [soundImportMsg,setSoundImportMsg]=useState('');
  const [importedSoundCounts,setImportedSoundCounts]=useState(null); // what's currently saved
  async function refreshImportedSoundCounts(){
    const sfx=await idbGetAllSounds(SOUND_SFX_STORE);
    const voice=await idbGetAllSounds(SOUND_VOICE_STORE);
    setImportedSoundCounts({sfx:Object.keys(sfx).length,voice:Object.keys(voice).length});
  }
  React.useEffect(()=>{ refreshImportedSoundCounts(); },[]);
  async function handleSoundPackFiles(files){
    if(!files||!files.length) return;
    setSoundImportBusy(true); setSoundImportMsg('Reading zip(s)…'); setSoundImportReview(null);
    try{
      const merged={sfx:{},voice:{}};
      for(const file of files){
        const {sfx,voice}=await processSoundPackZip(file);
        for(const [k,v] of Object.entries(sfx)) (merged.sfx[k]=merged.sfx[k]||[]).push(...v);
        for(const [k,v] of Object.entries(voice)) (merged.voice[k]=merged.voice[k]||[]).push(...v);
      }
      const sfxCount=Object.keys(merged.sfx).length;
      const voiceCount=Object.keys(merged.voice).length;
      if(!sfxCount&&!voiceCount){
        setSoundImportMsg('No matching audio found — expected either weapon/event sound folders, or a Dawn-of-War-style race/unit/category layout with a commander-ish unit folder (force_commander, warboss, farseer, commander, canoness, archon, lord, captain…).');
      } else {
        setSoundImportMsg(`Matched ${sfxCount} SFX key(s) and ${voiceCount} voice categor${voiceCount===1?'y':'ies'}. Review below, then save.`);
        setSoundImportReview(merged);
      }
    }catch(e){
      setSoundImportMsg('Could not read that zip: '+e.message);
    }finally{ setSoundImportBusy(false); }
  }
  async function saveSoundImportReview(){
    if(!soundImportReview) return;
    setSoundImportBusy(true);
    for(const [key,entries] of Object.entries(soundImportReview.sfx)){
      const e=entries[0]; // one clip per SFX key — first match wins
      await idbPutSound(SOUND_SFX_STORE,key,{mime:e.mime,bytes:e.bytes});
    }
    for(const [key,entries] of Object.entries(soundImportReview.voice)){
      await idbPutSound(SOUND_VOICE_STORE,key,entries.map(e=>({mime:e.mime,bytes:e.bytes})));
    }
    await AudioEngine.loadCustomSounds();
    await refreshImportedSoundCounts();
    setSoundImportReview(null); setSoundImportMsg('Saved — these sounds are now used on this device.');
    setSoundImportBusy(false);
  }
  async function clearImportedSounds(){
    await idbDeleteSoundStore(SOUND_SFX_STORE);
    await idbDeleteSoundStore(SOUND_VOICE_STORE);

  // Auto-identify unit photos across EVERY faction in one pass (Settings & Backup),
  // instead of running the AI matcher one faction at a time from the Armoury.
  const [allIdBusy,setAllIdBusy]=useState(false);
  const [allIdProgress,setAllIdProgress]=useState('');
  const allIdCancelRef=useRef(false);
  async function runAllFactionsIdentify(){
    if(allIdBusy||!index) return;
    if(!getGeminiKey()){ alert('Set your Gemini API key first (just below).'); return; }
    setAllIdBusy(true); allIdCancelRef.current=false;
    const imagesIdx=await loadImagesIndex();
    const fids=Object.keys(index).filter(id=>!['UA','UN','TL'].includes(id));
    let totalAssigned=0;
    for(let fi=0;fi<fids.length;fi++){
      if(allIdCancelRef.current) break;
      const fid=fids[fi];
      const imgs=imagesIdx[fid]||[];
      if(!imgs.length) continue;
      setAllIdProgress(`Faction ${fi+1}/${fids.length}: ${index[fid].name} — loading roster…`);
      let units=[];
      try{
        const file=index[fid].file||fid.toLowerCase()+'.json';
        const data=await fetchJSON(file);
        units=data?.units||[];
      }catch(e){ continue; }
      if(!units.length) continue;
      const assigned=await identifyFactionPhotos(fid,units,imgs,{
        onProgress:(i,total,n)=>setAllIdProgress(`Faction ${fi+1}/${fids.length}: ${index[fid].name} — photo ${i}/${total} (${totalAssigned+n} total matched)`),
        cancelRef:allIdCancelRef
      });
      totalAssigned+=assigned;
    }
    setAllIdProgress(allIdCancelRef.current
      ? `Stopped — ${totalAssigned} new photo${totalAssigned!==1?'s':''} assigned before stopping.`
      : `Done — ${totalAssigned} new photo${totalAssigned!==1?'s':''} assigned across all factions.`);
    setAllIdBusy(false);
  }
  function exportBackup(){
    const data={_app:'The Strategium',_version:1,_date:new Date().toISOString()};
    BACKUP_KEYS.forEach(k=>{data[k]=load(k,null);});
    const blob=new Blob([JSON.stringify(data,null,1)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=`strategium-backup-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),5000);
  }
  function importBackup(file){
    if(!file) return;
    const reader=new FileReader();
    reader.onload=()=>{
      try{
        const data=JSON.parse(reader.result);
        if(!data||data._app!=='The Strategium') throw new Error('not a Strategium backup file');
        if(data.wh40k_v3) setArmies(data.wh40k_v3);
        if(data.wh40k_battles) setSavedBattles(data.wh40k_battles);
        if(data.wh40k_collection) setCollection(data.wh40k_collection);
        if(data.wh40k_wishlist) setWishlist(data.wh40k_wishlist);
        if(data.wh40k_paintqueue) setPaintQueue(data.wh40k_paintqueue);
        if(data.wh40k_metalists) setMetaLists(data.wh40k_metalists);
        if(data.wh40k_unitimages) save('wh40k_unitimages',data.wh40k_unitimages);
        alert('Backup restored — collection, armies and battles loaded.');
      }catch(e){alert('Restore failed: '+e.message);}
    };
    reader.readAsText(file);
  }

  const active=armies.find(a=>a.id===activeId);

  function createArmy(fid,fname,det,chapter=null){

    const a={id:Date.now().toString(),name:chName?`${chName} Army`:`${fname} Army`,

  function upArmy(id,patch){setArmies(p=>p.map(a=>a.id===id?{...a,...patch}:a));}

  // Add unit — checks for leader/bodyguard prompts
  function handleAdd(unit,si){
    if(!active) return;
    if(isEpicHero(unit)&&active.units.some(e=>e.unit.id===unit.id)) return;
    setSelUnit(null);

    if(isLeader(unit)){
      // Leader added — find eligible bodyguards already in army (unoccupied)
      const eligible=active.units.filter(e=>
        (unit.leads||[]).includes(e.unit.id)&&!e.attachedLeader
      );
      setLeaderPrompt({unit,si,eligible});
    } else {
      // Bodyguard added — find compatible unattached leaders already in army
      const pendingLeaders=active.units.filter(e=>
        isLeader(e.unit)&&(e.unit.leads||[]).includes(unit.id)&&!e.attachedTo
      );
      if(pendingLeaders.length>0){
        // Add the unit first unattached, then prompt
        const entry={id:Date.now().toString(),unit,sizeIdx:si,attachedLeader:null,attachedTo:null};
        upArmy(active.id,{units:[...active.units,entry]});
        setBodyguardPrompt({entry,leaders:pendingLeaders});
      } else {
        doAdd(unit,si,null);
      }
    }
  }

  function doAdd(unit,si,bodyguardEntryId){
    const entry={id:Date.now().toString(),unit,sizeIdx:si,attachedLeader:null,attachedTo:null};
    let newUnits=[...active.units,entry];
    if(bodyguardEntryId){
      // Mark leader's attachedTo = bodyguard entry id
      newUnits=newUnits.map(e=>e.id===bodyguardEntryId?{...e,attachedTo:entry.id}:e);
      entry.attachedLeader=bodyguardEntryId;
      newUnits[newUnits.length-1]=entry;
    }
    const updates={units:newUnits};
    // Supreme Commander: this unit MUST be the Warlord — auto-assign on add
    if(mustBeWarlord(unit)) updates.warlordId=entry.id;
    upArmy(active.id,updates);
    setLeaderPrompt(null);
  }

  function attachLeaderToBodyguard(leaderId,bodyguardEntryId){
    if(!bodyguardEntryId){setLeaderPrompt(null);return;}
    upArmy(active.id,{units:active.units.map(e=>{
      if(e.id===bodyguardEntryId) return{...e,attachedLeader:leaderId};
      if(e.id===leaderId) return{...e,attachedTo:bodyguardEntryId};
      return e;
    })});
    setLeaderPrompt(null);

  const armyWarnings=useMemo(()=>{
    if(!active) return [];
    const warnings=[];
    // 1. Warlord not assigned
    if(!active.warlordId){
      const supreme=active.units.find(e=>mustBeWarlord(e.unit));
      const eligible=supreme||active.units.find(e=>canBeWarlordRule(e.unit));

    const supremeUnit=active.units.find(e=>mustBeWarlord(e.unit));
    if(supremeUnit&&active.warlordId&&active.warlordId!==supremeUnit.id){
      warnings.push({type:'error',msg:`${supremeUnit.unit.name} has Supreme Commander — it must be your Warlord.`,
        entryId:supremeUnit.id,field:'warlord'});

                <div key={b.id} style={{background:'var(--bg1)',border:'1px solid var(--goldborder)',padding:'11px 14px',marginBottom:5,borderLeft:'3px solid var(--gold)',display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:10}}>

                  <div style={{display:'flex',flexDirection:'column',gap:3,flexShrink:0}}>
                    <button className="btn btn-xs btn-gold"

        ):armies.map(a=>{
          const used=a.units.reduce((s,e)=>s+pts(e.unit,e.sizeIdx),0);

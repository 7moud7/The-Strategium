                  Save: {bestSave?`${bestSave}+ (AP ${totalAp})`:'—'}
                </div>
                {hitModCapped&&(
                  <div style={{fontSize:8,color:'var(--brass)',marginTop:2}}>Hit modifier capped at ±1 (core rules)</div>
                )}
                {(stealthPenalty!==0||damagedPenalty!==0||targetDefense?.fnp||targetDefense?.loneOp||targetDefense?.demise)&&(
                  <div style={{display:'flex',gap:4,flexWrap:'wrap',marginTop:3}}>
                    {stealthPenalty!==0&&<span style={{fontSize:8,padding:'1px 5px',background:'var(--bg1)',border:'1px solid var(--border)',color:'var(--blueBright)'}}>Target has STEALTH — -1 to Hit applied</span>}
                    {damagedPenalty!==0&&<span style={{fontSize:8,padding:'1px 5px',background:'var(--reddim)',border:'1px solid var(--red)',color:'var(--redBright)'}}>Attacker DAMAGED — -1 to Hit applied</span>}
                    {attackerDamaged&&!attackerDamaged.minusHit&&<span style={{fontSize:8,padding:'1px 5px',background:'var(--reddim)',border:'1px solid var(--red)',color:'var(--redBright)'}}>Attacker DAMAGED — check datasheet effect</span>}
                    {targetDefense?.fnp&&<span style={{fontSize:8,padding:'1px 5px',background:'var(--bg1)',border:'1px solid var(--border)',color:'#ddcc44'}}>Target FEEL NO PAIN {targetDefense.fnp}+ — it may ignore each wound on a {targetDefense.fnp}+</span>}
                    {targetDefense?.loneOp&&<span style={{fontSize:8,padding:'1px 5px',background:'var(--bg1)',border:'1px solid var(--border)',color:'var(--text2)'}}>Target is a LONE OPERATIVE — only targetable within 12″ (unless closest)</span>}
                    {targetDefense?.demise&&<span style={{fontSize:8,padding:'1px 5px',background:'var(--bg1)',border:'1px solid var(--border)',color:'var(--redBright)'}}>Target has DEADLY DEMISE {targetDefense.demise} — on death roll a D6: on 6, nearby units take mortal wounds</span>}
                  </div>
                )}
                {fxHints.length>0&&(
                  <div style={{display:'flex',gap:4,flexWrap:'wrap',marginTop:3}}>
                    {fxHints.map((m,i)=>(
                      <span key={i} style={{fontSize:8,padding:'1px 5px',background:'var(--golddim)',border:'1px solid var(--goldborder)',color:'var(--gold)'}}>
                        {m.label} <span style={{opacity:.6}}>({m._src})</span>
                      </span>
                    ))}
                  </div>
                )}
                {/* Expected-value line + commander counsel */}
                {rollMath&&(
                  <div style={{marginTop:5,paddingTop:5,borderTop:'1px solid var(--border)'}}>
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:8}}>
                      <div style={{fontSize:9,color:'var(--text2)'}}>
                        <span style={{color:'var(--brass)',letterSpacing:1}}>ODDS:</span>{' '}
                        {rollMath.attacks} atk → <b>{rollMath.hits}</b> hits → <b>{rollMath.wounds}</b> wnd → <b>{rollMath.unsaved}</b> unsaved → <b style={{color:'var(--gold)'}}>~{rollMath.damage} dmg</b>
                        {rollMath.modelsSlain>0&&<span> (~{rollMath.modelsSlain} slain)</span>}
                      </div>
                      {commander&&(
                        <button onClick={askCounsel} disabled={counselBusy}
                          style={{fontSize:8,padding:'3px 8px',background:'var(--bg1)',border:'1px solid var(--goldborder)',color:'var(--gold)',cursor:'pointer',letterSpacing:1,flexShrink:0,fontFamily:"'Cinzel',serif"}}>
                          {counselBusy?'…':'⚜ COUNSEL'}
                        </button>
                      )}
                    </div>
                    {counsel&&(
                      <div style={{marginTop:5,padding:'6px 9px',background:'rgba(200,168,75,.06)',borderLeft:`3px solid ${commander?.accent||'var(--gold)'}`,fontSize:10,color:'var(--text2)',lineHeight:1.55,fontStyle:'italic'}}>
                        <div style={{fontSize:8,color:commander?.accent||'var(--gold)',letterSpacing:1,fontFamily:"'Cinzel',serif",fontStyle:'normal',marginBottom:2}}>{commander?.name}</div>
                        {counsel}
                      </div>
                    )}
                  </div>
                )}
              </div>

              {/* Step 1 — Attacks */}
              <div style={{padding:'8px 10px',borderBottom:'1px solid var(--border)'}}>
                <div style={{display:'flex',alignItems:'center',gap:8}}>
                  <div style={{flex:1}}>
                    <div style={{fontSize:10,fontFamily:"'Cinzel',serif",color:'var(--text)'}}>1. Attacks ({totalAtk} per model)</div>
                    <div style={{fontSize:9,color:'var(--text3)'}}>
                      Roll {totalAtk} dice per model · tap + to add {totalAtk}
                      {carrierInfo.counts[weapon?.name]>0&&(
                        <span style={{color:'var(--brass)'}}> · {carrierInfo.counts[weapon.name]} model{carrierInfo.counts[weapon.name]!==1?'s':''} carry this → {totalAtk*carrierInfo.counts[weapon.name]} total</span>
                      )}
                    </div>
                  </div>
                  <div style={{display:'flex',alignItems:'center',gap:3,flexShrink:0}}>
                    <button className="counter-btn" onClick={()=>setNumAtk(v=>String(Math.max(0,(parseInt(v)||0)-totalAtk)))} style={{width:26,height:26}}>−</button>
                    <input type="number" min="0" value={numAtk} onChange={e=>setNumAtk(e.target.value)}
                      style={{width:44,textAlign:'center',fontSize:14,fontWeight:700,padding:'3px',border:'1px solid var(--border)',background:'var(--bg2)',color:'var(--text)'}}/>
                    <button className="counter-btn" onClick={()=>setNumAtk(v=>String((parseInt(v)||0)+totalAtk))} style={{width:26,height:26}}>+</button>
                  </div>
                </div>
              </div>

              {/* Step 2 — Hits */}
              <div style={{padding:'8px 10px',borderBottom:'1px solid var(--border)'}}>
                <div style={{display:'flex',alignItems:'center',gap:8}}>
                  <div style={{flex:1}}>
                    <div style={{fontSize:10,fontFamily:"'Cinzel',serif",color:'var(--text)'}}>2. Hits (on {hitTarget}+)</div>
                    <div style={{fontSize:9,color:'var(--text3)'}}>How many dice hit?</div>
                  </div>
                  <div style={{display:'flex',alignItems:'center',gap:3,flexShrink:0}}>
                    <button className="counter-btn" onClick={()=>setHits(v=>String(Math.max(0,(parseInt(v)||0)-1)))} style={{width:26,height:26}}>−</button>
                    <input type="number" min="0" value={hits} onChange={e=>setHits(e.target.value)}
                      style={{width:44,textAlign:'center',fontSize:14,fontWeight:700,padding:'3px',border:'1px solid var(--border)',background:'var(--bg2)',color:'var(--text)'}}/>
                    <button className="counter-btn" onClick={()=>setHits(v=>String((parseInt(v)||0)+1))} style={{width:26,height:26}}>+</button>
                  </div>
                </div>
              </div>

              {/* Step 3 — Wound rolls */}
              <div style={{padding:'8px 10px',borderBottom:'1px solid var(--border)'}}>
                <div style={{display:'flex',alignItems:'center',gap:8}}>
                  <div style={{flex:1}}>
                    <div style={{fontSize:10,fontFamily:"'Cinzel',serif",color:'var(--text)'}}>3. Wounds (on {effectiveWoundTarget||'?'}+)</div>
                    <div style={{fontSize:9,color:'var(--text3)'}}>How many hits wounded?</div>
                  </div>
                  <div style={{display:'flex',alignItems:'center',gap:3,flexShrink:0}}>
                    <button className="counter-btn" onClick={()=>setWoundSuccesses(v=>String(Math.max(0,(parseInt(v)||0)-1)))} style={{width:26,height:26}}>−</button>
                    <input type="number" min="0" value={woundSuccesses} onChange={e=>setWoundSuccesses(e.target.value)}
                      style={{width:44,textAlign:'center',fontSize:14,fontWeight:700,padding:'3px',border:'1px solid var(--border)',background:'var(--bg2)',color:'var(--text)'}}/>
                    <button className="counter-btn" onClick={()=>setWoundSuccesses(v=>String((parseInt(v)||0)+1))} style={{width:26,height:26}}>+</button>
                  </div>
                </div>
              </div>

              {/* Step 4 — Opponent's saves */}
              <div style={{padding:'8px 10px',borderBottom:'1px solid var(--border)'}}>
                <div style={{display:'flex',alignItems:'center',gap:8}}>
                  <div style={{flex:1}}>
                    <div style={{fontSize:10,fontFamily:"'Cinzel',serif",color:'var(--text)'}}>4. Opponent's Saves ({bestSave?bestSave+'+':'no save'})</div>
                    <div style={{fontSize:9,color:'var(--text3)'}}>Of those {woundSuccesses||0} wounds, how many did they FAIL to save?</div>
                  </div>
                  <div style={{display:'flex',alignItems:'center',gap:3,flexShrink:0}}>
                    <button className="counter-btn" onClick={()=>setFailedSaves(v=>String(Math.max(0,(parseInt(v)||0)-1)))} style={{width:26,height:26}}>−</button>
                    <input type="number" min="0" max={parseInt(woundSuccesses)||0} value={failedSaves}
                      onChange={e=>setFailedSaves(String(Math.min(parseInt(e.target.value)||0,parseInt(woundSuccesses)||0)))}
                      style={{width:44,textAlign:'center',fontSize:14,fontWeight:700,padding:'3px',border:'1px solid var(--border)',background:'var(--bg2)',color:'var(--text)'}}/>
                    <button className="counter-btn" onClick={()=>setFailedSaves(v=>String(Math.min((parseInt(v)||0)+1,parseInt(woundSuccesses)||0)))} style={{width:26,height:26}}>+</button>
                  </div>
                </div>
              </div>

              {/* Step 5 — assign the resulting damage to models */}
              <div style={{padding:'8px 10px'}}>
                <div style={{fontSize:10,fontFamily:"'Cinzel',serif",color:'var(--text)',marginBottom:6}}>
                  5. Damage — assign each failed save to a model ({totalWoundResults}/{parseInt(failedSaves)||0})
                </div>
                {/* Model grid for target */}
                {modelWounds&&(
                  <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(80px,1fr))',gap:4,marginBottom:8}}>
                    {modelWounds.map((mw,mi)=>{
                      const dead = mw<=0;
                      return(
                        <div key={mi}
                          onClick={()=>!dead&&addWound(mi)}
                          style={{
                            background:dead?'var(--reddim)':'var(--bg2)',
                            border:`1px solid ${dead?'var(--red)':'var(--border)'}`,
                            padding:'6px 4px',textAlign:'center',
                            cursor:dead?'default':'pointer',
                            opacity:dead?0.5:1,
                            transition:'all .12s',
                          }}>
                          <div style={{fontSize:8,color:'var(--text3)',marginBottom:2}}>
                            {mi===0&&(unit.models||[]).length>1?'Leader':'Model '+(mi+1)}
                          </div>
                          <div style={{fontSize:12,fontWeight:700,color:dead?'var(--redBright)':mw<targetModelW?'#ddcc44':'var(--text)',fontFamily:"'Cinzel',serif"}}>
                            {dead?'☠':mw+'/'+targetModelW}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                  <div style={{fontSize:9,color:'var(--text3)'}}>
                    {totalWoundResults} wound{totalWoundResults!==1?'s':''} assigned
                    {killedModels>0&&<span style={{color:'var(--redBright)',marginLeft:6}}>☠ {killedModels} slain</span>}
                  </div>
                  {totalWoundResults>0&&(
                    <button className="btn btn-xs btn-ghost" onClick={removeLastWound}>↩ Undo last</button>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* Apply & Resolve */}
          {targetEntry&&totalWoundResults>0&&!resolved&&(
            <button className="btn btn-danger anim-press"
              style={{width:'100%',padding:'10px',fontSize:11,letterSpacing:2,fontFamily:"'Cinzel',serif",marginBottom:8}}
              onClick={handleApply}>
              ⚡ {isShoot&&weapons.length>1&&!firedWeapons.has(weapon.name)&&weapons.filter(w=>!firedWeapons.has(w.name)).length>1
                ?`Apply & Fire Next Weapon`
                :`Apply ${killedModels>0?`(${killedModels} slain) `:''}— ${isShoot?'Resolve Shooting':'Resolve Fight'}`}
            </button>
          )}

          {/* Skip weapon (no wounds) */}
          {isShoot&&targetEntry&&totalWoundResults===0&&!resolved&&(
            <button className="btn btn-outline btn-sm" style={{width:'100%',marginBottom:6}}
              onClick={()=>{
                setFiredWeapons(s=>new Set([...s,weapon.name]));
                const remaining=weapons.filter(w=>!firedWeapons.has(w.name)&&w.name!==weapon.name);
                if(remaining.length===0) onClose();
                else setSelWeaponName(remaining[0].name);
              }}>
              Skip (no hits) → {weapons.filter(w=>!firedWeapons.has(w.name)&&w.name!==weapon.name)[0]?.name||'End Shooting'}
            </button>
          )}

          {/* Done */}
          {(resolved||allWeaponsFired)&&(
            <div className="anim-fade-in" style={{background:'var(--bg1)',border:'1px solid var(--greenBright)',padding:12,textAlign:'center'}}>
              <div style={{fontSize:11,color:'var(--greenBright)',fontFamily:"'Cinzel',serif",letterSpacing:2,marginBottom:8}}>
                {isShoot?'SHOOTING RESOLVED':'ATTACKS RESOLVED'}
              </div>
              <button className="btn btn-gold" style={{width:'100%'}} onClick={onClose}>Close</button>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}





function ShootingAssistantFull({unit, entry, army, enemyArmy, wounds:battleWounds, destroyed:battleDestroyed, applyWounds, setDestroyed, perModelWounds, setPerModelWounds, onClose, onLog, triggerReaction}){
  const [step, setStep]=React.useState(0); // 0=weapon, 1=profile, 2=target, 3=resolve
  const [selWeapon, setSelWeapon]=React.useState(null);
  const [selProfile, setSelProfile]=React.useState(null);
  const [targetEntry, setTargetEntry]=React.useState(null); // the selected enemy unit entry
  const [targetSize, setTargetSize]=React.useState(null);
  const [targetToughness, setTargetToughness]=React.useState('');
  const [targetSave, setTargetSave]=React.useState('');
  const [targetInv, setTargetInv]=React.useState('');
  const [useInv, setUseInv]=React.useState(false);
  const [numAtk, setNumAtk]=React.useState('');
  const [hits, setHits]=React.useState('');
  const [woundsInput, setWoundsInput]=React.useState('');
  const [hazardRolls, setHazardRolls]=React.useState([]);
  const [showAttackSeq, setShowAttackSeq]=React.useState(false);

  if(!unit) return null;

  // When the player selects a target unit, auto-derive its Toughness/Save/Invulnerable
  // from its actual datasheet instead of asking the player to type numbers in by hand.
  React.useEffect(()=>{
    if(!targetEntry){ setTargetToughness(''); setTargetSave(''); setTargetInv(''); return; }
    const m=targetEntry.unit.models?.[0];
    if(m){
      setTargetToughness(m.t||'');
      setTargetSave((m.sv||'').replace('+',''));
      setTargetInv((m.inv||'').replace('+',''));
    }
  },[targetEntry]);

  // Live enemy units eligible to be targeted (not destroyed)
  const liveEnemyUnits=(enemyArmy?.units||[]).filter(e=>!battleDestroyed?.[e.id]);

  const allWeapons=(unit.weapons||[]);
  const rangedWeapons=allWeapons.filter(w=>w.type==='Ranged'||(w.type||'').toLowerCase()==='ranged');
  const melee=step===0&&rangedWeapons.length===0;

  const activeWeapon=selProfile||selWeapon;
  const analysis=activeWeapon?analyseWeapon(activeWeapon):null;

  // Check if weapon has multiple profiles
  const profiles=selWeapon?allWeapons.filter(w=>
    w.name&&selWeapon.name&&
    (w.name===selWeapon.name||(w.profile&&w.profile===selWeapon.name)||(w.line&&selWeapon.line&&w.line!==selWeapon.line&&w.name?.split(' – ')[0]===selWeapon.name?.split(' – ')[0]))
  ):[];
  const hasProfiles=profiles.length>1;

  // Attack calculation helpers
  const atkNum=parseInt(numAtk)||0;
  const hitNum=parseInt(hits)||0;
  const woundNum=parseInt(woundsInput)||0;
  const apVal=parseInt(activeWeapon?.ap)||0;
  const dmgVal=activeWeapon?.damage||'1';
  const strVal=parseInt(activeWeapon?.strength)||0;

  // Blast bonus
  const blastBonus=analysis?.hasBlast&&targetSize?(
    targetSize>=11?Math.max(0,6-atkNum):
    targetSize>=6?Math.max(0,3-atkNum):0
  ):0;

  const woundTarget=targetToughness?analysis?.getWoundTarget(targetToughness):'?';
  // Normal save is worsened by AP (AP is negative or zero on the weapon profile).
  // A save can never be improved beyond 1+, but an unmodified roll of 1 always fails regardless.
  const normalSaveModified=targetSave?Math.min(7,Math.max(2,parseInt(targetSave)-apVal)):null;
  const invSaveVal=targetInv?parseInt(targetInv):null; // invulnerable saves are NEVER modified by AP
  // Use whichever save is better (lower number) for the defender — exactly as the real rules require.
  const bestSave=(()=>{
    if(invSaveVal!=null&&normalSaveModified!=null) return invSaveVal<=normalSaveModified?{val:invSaveVal,type:'invulnerable'}:{val:normalSaveModified,type:'normal'};
    if(invSaveVal!=null) return {val:invSaveVal,type:'invulnerable'};
    if(normalSaveModified!=null) return {val:normalSaveModified,type:'normal'};
    return null;
  })();
  const saveRequired=`${parseInt(targetSave)||0}+ (AP ${apVal===0?'0':apVal})`;
  const modifiedSave=normalSaveModified!=null?`${normalSaveModified}+`:(apVal<0?`${Math.abs(apVal)} worse`:'No AP modifier');

  // Hazardous tracking
  function rollHazardous(){
    if(!analysis?.isHazardous) return;
    const roll=Math.ceil(Math.random()*6);
    setHazardRolls(prev=>[...prev,{roll,fail:roll===1}]);
  }

  const STEP_LABELS=['Select Weapon','Firing Mode','Target','Resolve'];

  return(
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div style={{
        background:'var(--bg0)',width:'100%',maxWidth:540,
        maxHeight:'92vh',border:'1px solid var(--goldborder)',
        borderBottom:'none',display:'flex',flexDirection:'column',overflow:'hidden',
      }}>
        {/* Header */}
        <div style={{padding:'10px 14px',borderBottom:'1px solid var(--border)',background:'var(--bg1)',flexShrink:0}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
            <div style={{fontFamily:"'Cinzel',serif",fontSize:13,fontWeight:700,color:'var(--gold)',letterSpacing:.5}}>
              Shooting: {unit.name}
            </div>
            <button onClick={onClose} style={{background:'none',border:'1px solid var(--border)',color:'var(--text3)',width:24,height:24,cursor:'pointer',fontSize:11}}>✕</button>
          </div>
          {/* Step indicator */}
          <div style={{display:'flex',gap:2}}>
            {STEP_LABELS.map((l,i)=>(
              <div key={i} style={{flex:1,padding:'4px 2px',textAlign:'center',fontSize:8,letterSpacing:.5,textTransform:'uppercase',
                background:step===i?'var(--golddim)':step>i?'rgba(200,168,75,.08)':'transparent',
                border:`1px solid ${step===i?'var(--gold)':step>i?'var(--goldborder)':'var(--border)'}`,
                color:step===i?'var(--gold)':step>i?'var(--brass)':'var(--text3)',
                fontFamily:"'Cinzel',serif",cursor:step>i?'pointer':'default',
              }} onClick={()=>step>i&&setStep(i)}>
                {step>i?'✓ ':''}{l}
              </div>
            ))}
          </div>
        </div>

        <div style={{flex:1,overflowY:'auto',padding:12}}>

          {/* STEP 0: Select Weapon */}
          {step===0&&(
            <div>
              <div style={{fontSize:9,letterSpacing:2,color:'var(--brass)',fontFamily:"'Cinzel',serif",textTransform:'uppercase',marginBottom:8}}>Select Weapon</div>
              {rangedWeapons.length===0&&<div style={{color:'var(--text3)',fontSize:11,padding:8}}>No ranged weapons.</div>}
              {rangedWeapons.map((w,i)=>{
                const a=analyseWeapon(w);
                const kws=(w.abilities||'').split(',').map(s=>s.trim()).filter(Boolean);
                return(
                  <div key={i} onClick={()=>{setSelWeapon(w);setSelProfile(null);setStep(hasProfiles?1:2);}}
                    style={{background:'var(--bg1)',border:'1px solid var(--border)',padding:'10px 12px',marginBottom:4,cursor:'pointer',transition:'border-color .1s'}}
                    onMouseEnter={e=>e.currentTarget.style.borderColor='var(--goldborder)'}
                    onMouseLeave={e=>e.currentTarget.style.borderColor='var(--border)'}>
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:4}}>
                      <div style={{fontFamily:"'Cinzel',serif",fontSize:12,color:'var(--text)',letterSpacing:.3}}>{w.name}</div>
                      <div style={{display:'flex',gap:4,fontSize:10,color:'var(--text3)',flexShrink:0,marginLeft:8}}>
                        <span>A:{w.attacks}</span><span>S:{w.strength}</span><span>AP:{w.ap}</span><span>D:{w.damage}</span>
                      </div>
                    </div>
                    <div style={{display:'flex',gap:3,flexWrap:'wrap'}}>
                      {kws.filter(Boolean).map(k=>(
                        <span key={k} style={{fontSize:8,padding:'1px 5px',background:WEAPON_KEYWORDS[k.toLowerCase()]?'rgba(200,168,75,.1)':'var(--bg2)',
                          border:`1px solid ${WEAPON_KEYWORDS[k.toLowerCase()]?'var(--goldborder)':'var(--border)'}`,
                          color:WEAPON_KEYWORDS[k.toLowerCase()]?'var(--gold)':'var(--text3)',letterSpacing:.5,textTransform:'uppercase'}}>
                          {k}
                        </span>
                      ))}
                    </div>
                  </div>
                );
              })}
            </div>
          )}

          {/* STEP 1: Firing Mode / Profile */}
          {step===1&&selWeapon&&(
            <div>
              <div style={{fontSize:9,letterSpacing:2,color:'var(--brass)',fontFamily:"'Cinzel',serif",textTransform:'uppercase',marginBottom:8}}>Select Firing Mode</div>
              <div style={{background:'var(--bg1)',border:'1px solid var(--border)',padding:'8px 12px',marginBottom:10,fontSize:10,color:'var(--text3)',lineHeight:1.6}}>
                <strong style={{color:'var(--gold)'}}>{selWeapon.name}</strong> has multiple firing modes. Select the profile you wish to use before resolving attacks.
              </div>
              {profiles.map((p,i)=>(
                <div key={i} onClick={()=>{setSelProfile(p);setStep(2);}}
                  style={{background:'var(--bg1)',border:`1px solid ${selProfile?.line===p.line?'var(--gold)':'var(--border)'}`,
                    padding:'10px 12px',marginBottom:4,cursor:'pointer',transition:'border-color .1s'}}
                  onMouseEnter={e=>e.currentTarget.style.borderColor='var(--goldborder)'}
                  onMouseLeave={e=>selProfile?.line!==p.line&&(e.currentTarget.style.borderColor='var(--border)')}>
                  <div style={{fontFamily:"'Cinzel',serif",fontSize:11,color:'var(--text)',marginBottom:4}}>{p.name}</div>
                  <div style={{display:'flex',gap:6,fontSize:10,color:'var(--text3)'}}>
                    <span>Rng:{p.range||'—'}</span><span>A:{p.attacks}</span><span>S:{p.strength}</span><span>AP:{p.ap}</span><span>D:{p.damage}</span>
                  </div>
                  {p.abilities&&<div style={{fontSize:9,color:'var(--text3)',marginTop:3}}>{p.abilities}</div>}
                </div>
              ))}
            </div>
          )}

          {/* STEP 2: Target info */}
          {step===2&&activeWeapon&&(
            <div>
              <div style={{fontSize:9,letterSpacing:2,color:'var(--brass)',fontFamily:"'Cinzel',serif",textTransform:'uppercase',marginBottom:8}}>Target Information</div>

              {/* Weapon summary */}
              <div style={{background:'var(--golddim)',border:'1px solid var(--goldborder)',padding:'8px 12px',marginBottom:10}}>
                <div style={{fontFamily:"'Cinzel',serif",fontSize:11,color:'var(--gold)',marginBottom:4}}>{activeWeapon.name}</div>
                <div style={{display:'flex',gap:8,fontSize:10,color:'var(--text2)',flexWrap:'wrap'}}>
                  <span>A:{activeWeapon.attacks}</span><span>S:{activeWeapon.strength}</span><span>AP:{activeWeapon.ap}</span><span>D:{activeWeapon.damage}</span><span>Rng:{activeWeapon.range}</span>
                </div>
              </div>

              {/* Active keyword reminders */}
              {analysis&&analysis.activeKeywords.length>0&&(
                <div style={{marginBottom:10}}>
                  <div style={{fontSize:9,letterSpacing:2,color:'var(--brass)',fontFamily:"'Cinzel',serif",textTransform:'uppercase',marginBottom:6}}>Active Rules</div>
                  {analysis.activeKeywords.map((k,i)=>(
                    <div key={i} style={{background:'var(--bg1)',border:'1px solid var(--goldborder)',borderLeft:'3px solid var(--gold)',padding:'6px 10px',marginBottom:3}}>
                      <div style={{fontSize:9,fontWeight:700,color:'var(--gold)',letterSpacing:1,textTransform:'uppercase',marginBottom:2}}>{k.label}</div>
                      <div style={{fontSize:10,color:'var(--text2)',lineHeight:1.5}}>{k.reminder}</div>
                    </div>
                  ))}
                </div>
              )}

              {analysis?.hasBlast&&(
                <div style={{marginBottom:10}}>
                  <div style={{fontSize:9,letterSpacing:2,color:'var(--brass)',fontFamily:"'Cinzel',serif",textTransform:'uppercase',marginBottom:6}}>Target Unit Size (Blast)</div>
                  {[{label:'1–5 models',val:3},{label:'6–10 models',val:7},{label:'11+ models',val:12}].map(opt=>(
                    <div key={opt.val} onClick={()=>setTargetSize(opt.val)}
                      style={{background:targetSize===opt.val?'var(--golddim)':'var(--bg1)',border:`1px solid ${targetSize===opt.val?'var(--gold)':'var(--border)'}`,
                        padding:'7px 12px',marginBottom:3,cursor:'pointer',display:'flex',justifyContent:'space-between'}}>
                      <span style={{fontSize:11,color:targetSize===opt.val?'var(--gold)':'var(--text)'}}>{opt.label}</span>
                      {opt.val>=6&&<span style={{fontSize:9,color:'var(--gold)',letterSpacing:1}}>MIN {opt.val>=11?6:3} ATK</span>}
                    </div>
                  ))}
                </div>
              )}

              {/* Target unit picker — derives Toughness/Save/Invulnerable automatically */}
              <div style={{fontSize:9,letterSpacing:2,color:'var(--brass)',fontFamily:"'Cinzel',serif",textTransform:'uppercase',marginBottom:6}}>Select Target Unit</div>
              {liveEnemyUnits.length===0&&(
                <div style={{fontSize:11,color:'var(--text3)',padding:'10px 0'}}>No live enemy units to target.</div>
              )}
              <div style={{display:'flex',flexDirection:'column',gap:4,marginBottom:12}}>
                {liveEnemyUnits.map(e=>{
                  const m=e.unit.models?.[0];
                  const isSel=targetEntry?.id===e.id;
                  return(
                    <div key={e.id} onClick={()=>setTargetEntry(e)}
                      style={{
                        background:isSel?'var(--golddim)':'var(--bg1)',
                        border:`1px solid ${isSel?'var(--gold)':'var(--border)'}`,
                        padding:'8px 10px',cursor:'pointer',display:'flex',justifyContent:'space-between',alignItems:'center',
                      }}>
                      <span style={{fontFamily:"'Cinzel',serif",fontSize:11,color:isSel?'var(--gold)':'var(--text)'}}>{e.unit.name}</span>
                      {m&&<span style={{fontSize:9,color:'var(--text3)'}}>T{m.t} Sv{m.sv}{m.inv?` Inv${m.inv}+`:''}</span>}
                    </div>
                  );
                })}
              </div>

              {targetEntry&&(
                <>
                  <div style={{background:'var(--bg1)',border:'1px solid var(--border)',padding:'10px 12px',marginBottom:10}}>
                    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
                      <div style={{textAlign:'center'}}>
                        <div style={{fontSize:9,color:'var(--text3)',letterSpacing:1,textTransform:'uppercase',marginBottom:2}}>Wound On</div>
                        <div style={{fontSize:16,fontWeight:700,color:'var(--gold)',fontFamily:"'Cinzel',serif"}}>{woundTarget}</div>
                      </div>
                      <div style={{textAlign:'center'}}>
                        <div style={{fontSize:9,color:'var(--text3)',letterSpacing:1,textTransform:'uppercase',marginBottom:2}}>Save Required</div>
                        <div style={{fontSize:16,fontWeight:700,color:'var(--gold)',fontFamily:"'Cinzel',serif"}}>
                          {bestSave?`${bestSave.val}+`:'—'}
                        </div>
                      </div>
                    </div>
                    {bestSave&&(targetInv||targetSave)&&(
                      <div style={{marginTop:8,paddingTop:8,borderTop:'1px solid var(--border)',fontSize:10,color:'var(--text3)',lineHeight:1.6}}>
                        {targetSave&&<div>Normal Save {targetSave}+ vs AP {apVal} → {modifiedSave}</div>}
                        {targetInv&&<div>Invulnerable Save {targetInv}+ (never modified by AP)</div>}
                        <div style={{color:'var(--gold)',marginTop:2}}>
                          ◆ Use {bestSave.val}+ ({bestSave.type==='invulnerable'?'Invulnerable is better':'Normal save is better'})
                        </div>
                      </div>
                    )}
                  </div>
                  <button className="btn btn-gold" style={{width:'100%'}} onClick={()=>setStep(3)}>Resolve Attacks →</button>
                </>
              )}
            </div>
          )}

          {/* STEP 3: Resolve */}
          {step===3&&activeWeapon&&(
            <div>
              <div style={{fontSize:9,letterSpacing:2,color:'var(--brass)',fontFamily:"'Cinzel',serif",textTransform:'uppercase',marginBottom:8}}>Resolve Attacks</div>

              {/* Attack sequence toggle */}
              <button style={{fontSize:9,color:'var(--text3)',background:'none',border:'1px solid var(--border)',padding:'4px 8px',cursor:'pointer',marginBottom:8,letterSpacing:1}}
                onClick={()=>setShowAttackSeq(s=>!s)}>
                {showAttackSeq?'▲':'▼'} Attack Sequence Reference
              </button>
              {showAttackSeq&&(
                <div style={{marginBottom:10}}>
                  {ATTACK_SEQUENCE.map((s,i)=>(
                    <div key={i} style={{display:'flex',gap:8,padding:'5px 8px',background:'var(--bg1)',border:'1px solid var(--border)',marginBottom:2,alignItems:'flex-start'}}>
                      <div style={{fontSize:9,fontWeight:700,color:'var(--gold)',width:18,flexShrink:0,marginTop:1}}>{i+1}</div>
                      <div>
                        <div style={{fontFamily:"'Cinzel',serif",fontSize:10,color:'var(--text)',marginBottom:2}}>{s.label}</div>
                        <div style={{fontSize:9,color:'var(--text3)',lineHeight:1.5}}>{s.desc}</div>
                      </div>
                    </div>
                  ))}
                </div>
              )}

              {/* Special reminders */}
              {analysis?.isTorrent&&(
                <div style={{background:'rgba(200,168,75,.1)',border:'1px solid var(--goldborder)',padding:'7px 10px',marginBottom:8,fontSize:10,color:'var(--gold)',letterSpacing:.5}}>
                  ◆ TORRENT — Skip all Hit rolls. All attacks automatically hit.
                </div>
              )}

              {/* Input grid */}
              <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:6,marginBottom:10}}>
                {[
                  {label:'Attacks',sub:blastBonus>0?`+${blastBonus} Blast`:'',val:numAtk,set:setNumAtk,hide:false},
                  {label:'Hits',sub:analysis?.isTorrent?'=Attacks':'',val:hits,set:setHits,hide:analysis?.isTorrent},
                  {label:'Wounds',sub:'',val:woundsInput,set:setWoundsInput,hide:false},
                ].filter(f=>!f.hide).map(f=>(
                  <div key={f.label} style={{background:'var(--bg1)',border:'1px solid var(--border)',padding:'8px 6px',textAlign:'center'}}>
                    <div style={{fontSize:8,color:'var(--text3)',letterSpacing:1,textTransform:'uppercase',marginBottom:2}}>{f.label}</div>
                    {f.sub&&<div style={{fontSize:8,color:'var(--gold)',marginBottom:2}}>{f.sub}</div>}
                    <input type="number" min="0" value={f.val} onChange={e=>f.set(e.target.value)}
                      style={{textAlign:'center',fontSize:18,fontFamily:"'Cinzel',serif",color:'var(--gold)',background:'transparent',border:'none',padding:0,width:'100%'}}/>
                  </div>
                ))}
              </div>

              {/* Results */}
              {woundNum>0&&(
                <div style={{background:'var(--bg1)',border:'1px solid var(--goldborder)',padding:12,marginBottom:8}}>
                  <div style={{fontSize:9,letterSpacing:2,color:'var(--brass)',fontFamily:"'Cinzel',serif",marginBottom:8}}>RESULT</div>
                  {[
                    {l:'Required Save',v:bestSave?`${bestSave.val}+ (${bestSave.type==='invulnerable'?'Invulnerable':'Normal, AP '+apVal})`:saveRequired},
                    {l:'Damage per Wound',v:dmgVal},
                    {l:'Wounds to Allocate',v:String(woundNum)},
                  ].map(({l,v})=>(
                    <div key={l} style={{display:'flex',justifyContent:'space-between',padding:'4px 0',borderBottom:'1px solid var(--border)'}}>
                      <span style={{fontSize:10,color:'var(--text3)'}}>{l}</span>
                      <span style={{fontSize:11,color:'var(--text)',fontWeight:700}}>{v}</span>
                    </div>
                  ))}
                  {/* Keyword results */}
                  {analysis?.activeKeywords.filter(k=>['devastating wounds','lethal hits','sustained hits x'].includes(k.label.toLowerCase())).map((k,i)=>(
                    <div key={i} style={{marginTop:6,fontSize:9,color:'var(--gold)',borderTop:'1px solid var(--goldborder)',paddingTop:6}}>
                      ◆ {k.label}: {k.reminder}
                    </div>
                  ))}
                  {/* Apply wounds to target */}
                  {targetEntry&&woundNum>0&&applyWounds&&(()=>{
                    const dmg=parseInt(dmgVal)||1;
                    const totalDmg=woundNum*dmg;
                    const targetMaxW=parseInt(targetEntry.unit.models?.[0]?.w)||1;
                    const targetCurW=battleWounds[targetEntry.id]??targetMaxW;
                    const newW=Math.max(0,targetCurW-totalDmg);
                    return(
                      <div style={{marginTop:10,borderTop:'1px solid var(--redBright)',paddingTop:10}}>
                        <div style={{fontSize:9,color:'var(--redBright)',letterSpacing:2,fontFamily:"'Cinzel',serif",marginBottom:6}}>APPLY TO TARGET</div>
                        <div style={{fontSize:10,color:'var(--text2)',marginBottom:8}}>
                          <strong style={{color:'var(--gold)'}}>{targetEntry.unit.name}</strong>: {targetCurW}/{targetMaxW}W →{' '}
                          <strong style={{color:newW<=0?'var(--redBright)':'#ddcc44'}}>{newW}W</strong>
                          {newW<=0&&' (DESTROYED)'}
                          {' '}(−{Math.min(totalDmg,targetCurW)} damage from {woundNum} wound{woundNum!==1?'s':''} × {dmg} dmg)
                        </div>
                        <button className="btn btn-danger btn-sm" style={{width:'100%'}} onClick={()=>{
                          const prev=battleWounds[targetEntry.id]??targetMaxW;
                          applyWounds(w=>({...w,[targetEntry.id]:newW}));
                          if(newW<=0) setDestroyed(d=>({...d,[targetEntry.id]:true}));
                          if(onLog) onLog(targetEntry.unit.name,`SHOT by ${unit.name}`,`${woundNum} wound${woundNum!==1?'s':''} × ${dmg}dmg = −${Math.min(totalDmg,prev)} HP`,0,()=>{
                            applyWounds(w=>({...w,[targetEntry.id]:prev}));
                            if(newW<=0) setDestroyed(d=>({...d,[targetEntry.id]:false}));
                          });
                          if(newW<=0&&triggerReaction) triggerReaction('unit_destroyed',targetEntry.unit.name,activePlayer);
                          setTimeout(()=>onClose(),300);
                        }}>⚡ Apply {totalDmg} Damage — Resolve Shooting</button>
                      </div>
                    );
                  })()}
                </div>
              )}

              {/* Hazardous tracker */}
              {analysis?.isHazardous&&(
                <div style={{background:'var(--reddim)',border:'1px solid var(--red)',padding:10,marginBottom:8}}>
                  <div style={{fontSize:9,letterSpacing:2,color:'var(--redBright)',fontFamily:"'Cinzel',serif",marginBottom:6}}>⚠ HAZARDOUS — Roll Required</div>
                  <div style={{fontSize:10,color:'var(--text2)',marginBottom:8,lineHeight:1.5}}>
                    Roll D6. On a 1: bearer suffers 3 mortal wounds.
                  </div>
                  <button className="btn btn-danger btn-sm" onClick={rollHazardous}>Roll Hazardous D6</button>
                  {hazardRolls.length>0&&(
                    <div style={{marginTop:8,display:'flex',gap:4,flexWrap:'wrap'}}>
                      {hazardRolls.map((r,i)=>(
                        <div key={i} style={{
                          width:28,height:28,border:`2px solid ${r.fail?'var(--redBright)':'var(--greenBright)'}`,
                          display:'flex',alignItems:'center',justifyContent:'center',
                          fontFamily:"'Cinzel',serif",fontSize:14,fontWeight:700,
                          color:r.fail?'var(--redBright)':'var(--greenBright)',
                          background:r.fail?'rgba(204,34,34,.2)':'rgba(58,138,58,.1)',
                        }}>{r.roll}</div>
                      ))}
                    </div>
                  )}
                  {hazardRolls.some(r=>r.fail)&&(
                    <div style={{marginTop:6,fontSize:10,color:'var(--redBright)',fontWeight:700}}>
                      ⚠ FAIL — Bearer suffers 3 mortal wounds!
                    </div>
                  )}
                </div>
              )}
            </div>
          )}

        </div>

        {/* Footer nav */}
        <div style={{padding:'10px 12px',borderTop:'1px solid var(--border)',display:'flex',gap:6,flexShrink:0,background:'var(--bg1)'}}>
          {step>0&&<button className="btn btn-outline btn-sm" onClick={()=>setStep(s=>s-1)}>← Back</button>}
          <div style={{flex:1}}/>
          {step===2&&<button className="btn btn-gold btn-sm" onClick={()=>setStep(3)}>Resolve →</button>}
        </div>
      </div>
    </div>
  );
}

// ── ABILITY INTELLIGENCE PANEL ───────────────────────────────────────────────

function AbilityIntelPanel({ability,phase,onClose}){
  const parsed=parseAbility(ability);
  if(!parsed) return null;
  const PHASE_COLOURS={command:'var(--gold)',movement:'#4a9',shooting:'var(--blueBright)',charge:'#e87',fight:'#c6a',any:'var(--text3)'};
  const phaseCol=PHASE_COLOURS[parsed.phase]||PHASE_COLOURS.any;
  const TYPE_LABELS={
    exception:'Exception to normal rule',
    modifier:'Stat modifier',
    reroll:'Re-roll effect',
    'mortal-wounds':'Mortal wound source',
    'extra-attacks':'Extra attacks',
    aura:'Aura ability',
    passive:'Passive effect',
  };

  return(
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal anim-slide-up" style={{maxWidth:440}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:12}}>
          <div>
            <div style={{fontFamily:"'Cinzel',serif",fontSize:15,fontWeight:700,color:'var(--gold)',letterSpacing:.5,marginBottom:4}}>{parsed.name}</div>
            <div style={{display:'flex',gap:4,flexWrap:'wrap'}}>
              <span style={{fontSize:8,padding:'1px 6px',border:`1px solid ${phaseCol}`,color:phaseCol,letterSpacing:1,textTransform:'uppercase'}}>{parsed.phase.toUpperCase()} PHASE</span>
              <span style={{fontSize:8,padding:'1px 6px',border:'1px solid var(--border)',color:'var(--text3)',letterSpacing:1}}>{TYPE_LABELS[parsed.type]||parsed.type}</span>
              {parsed.isException&&<span style={{fontSize:8,padding:'1px 6px',border:'1px solid #e87',color:'#e87',letterSpacing:1}}>EXCEPTION</span>}
              {parsed.leaderOnly&&<span style={{fontSize:8,padding:'1px 6px',border:'1px solid var(--blueBright)',color:'var(--blueBright)',letterSpacing:1}}>LEADER ONLY</span>}
            </div>
          </div>
          <button onClick={onClose} style={{background:'none',border:'1px solid var(--border)',color:'var(--text3)',width:24,height:24,cursor:'pointer',fontSize:11,flexShrink:0}}>✕</button>
        </div>

        {[
          {label:'Trigger',value:parsed.trigger},
          {label:'Duration',value:parsed.duration},
          {label:'Phase',value:parsed.phase.charAt(0).toUpperCase()+parsed.phase.slice(1)+' Phase'},
        ].map(({label,value})=>(
          <div key={label} style={{display:'flex',gap:12,padding:'6px 0',borderBottom:'1px solid var(--border)'}}>
            <div style={{fontSize:9,color:'var(--text3)',letterSpacing:1,textTransform:'uppercase',width:60,flexShrink:0,paddingTop:1}}>{label}</div>
            <div style={{fontSize:11,color:'var(--text)'}}>{value}</div>
          </div>
        ))}

        <div style={{marginTop:12,padding:'10px 12px',background:'var(--bg2)',border:'1px solid var(--border)'}}>
          <div style={{fontSize:9,letterSpacing:2,color:'var(--brass)',fontFamily:"'Cinzel',serif",textTransform:'uppercase',marginBottom:6}}>Full Text</div>
          <div style={{fontSize:11,color:'var(--text2)',lineHeight:1.7}}>{parsed.rawText}</div>
        </div>

        {parsed.leaderOnly&&(
          <div style={{marginTop:8,padding:'8px 10px',background:'rgba(42,122,176,.1)',border:'1px solid var(--blueBright)',fontSize:10,color:'var(--blueBright)',lineHeight:1.5}}>
            ◆ This ability only functions while this model is leading an Attached unit.
          </div>
        )}
        {parsed.isException&&(
          <div style={{marginTop:8,padding:'8px 10px',background:'rgba(238,136,119,.08)',border:'1px solid #e87',fontSize:10,color:'#e87',lineHeight:1.5}}>
            ◆ Exception: This ability overrides a normal rule. The modified behaviour takes precedence.
          </div>
        )}
      </div>
    </div>
  );
}

// ── RULES REFERENCE PANEL (inline, in battle) ─────────────────────────────────

function RulesRefPanel({phase,army,coreStrats}){
  const PHASE_STEPS={
    0:['Both players gain 1 CP','Take Battle-shock tests for Below Half-strength units','Resolve Command Phase abilities and auras'],
    1:['Move units — Normal Move, Advance, Fall Back, or Remain Stationary','Set up Strategic Reserves','Note: Advanced units cannot shoot most weapons; Fall Back units cannot charge'],
    2:['Select eligible units to shoot','Select targets (must be visible and in range)','Make Hit rolls, Wound rolls, Saving Throws','Inflict Damage'],
    3:['Declare charges — must be within 12\u2033 and not Advanced/Fell Back','Roll 2D6 — must meet or beat distance to closest target model','Resolve Overwatch from target','Make Charge move into Engagement Range'],
    4:['Units with Fights First fight first (alternating, non-active starts)','Remaining units fight (alternating, non-active starts)','For each unit: Pile In (3\u2033), make attacks, Consolidate (3\u2033)'],
  };
  const steps=PHASE_STEPS[phase]||[];
  const PHASE_NAMES=['Command','Movement','Shooting','Charge','Fight'];

  return(
    <div>
      <div style={{fontSize:9,letterSpacing:2,color:'var(--brass)',fontFamily:"'Cinzel',serif",textTransform:'uppercase',marginBottom:8}}>
        {PHASE_NAMES[phase]} Phase — Core Sequence
      </div>
      {steps.map((s,i)=>(
        <div key={i} style={{display:'flex',gap:8,padding:'5px 0',borderBottom:'1px solid rgba(42,42,58,.5)',alignItems:'flex-start'}}>
          <div style={{fontSize:9,fontWeight:700,color:'var(--gold)',width:16,flexShrink:0,paddingTop:1}}>{i+1}</div>
          <div style={{fontSize:10,color:'var(--text2)',lineHeight:1.5}}>{s}</div>
        </div>
      ))}

      {/* Wound table quick ref */}
      {(phase===2||phase===4)&&(
        <div style={{marginTop:10}}>
          <div style={{fontSize:9,letterSpacing:2,color:'var(--brass)',fontFamily:"'Cinzel',serif",textTransform:'uppercase',marginBottom:6}}>Wound Roll Reference</div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:2}}>
            {WOUND_TABLE.map(({label,roll})=>(
              <div key={label} style={{display:'flex',justifyContent:'space-between',padding:'3px 8px',background:'var(--bg1)',border:'1px solid var(--border)'}}>
                <span style={{fontSize:9,color:'var(--text3)'}}>{label}</span>
                <span style={{fontSize:10,fontWeight:700,color:'var(--gold)',fontFamily:"'Cinzel',serif"}}>{roll}</span>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* Hit modifier cap reminder */}
      <div style={{marginTop:10,padding:'7px 10px',background:'var(--bg1)',border:'1px solid var(--border)',fontSize:9,color:'var(--text3)',lineHeight:1.6}}>
        <strong style={{color:'var(--gold)'}}>Modifier Limits:</strong> Hit rolls: max +1/-1 total. Saves: cannot be improved beyond 1+. AP cannot reduce save below 1+.
      </div>
    </div>
  );
}



// ── BATTLE SCREEN (replaces BunkerScreen) ────────────────────────────────────

// ── MISSION CARD ROW (extracted so hooks are valid) ──────────────────────────
// ── CHARGE MODAL (extracted from map callback so useState is valid) ──────────
function ChargeModal({entryId, ent, inactiveArmy, destroyed, setChargeSuccess, setEngaged, setChargedUnits, round, activePlayer, logAction, triggerReaction, commander, counselContext}){
  const [chargeTarget, setChargeTarget] = React.useState('');
  const [chargeDist, setChargeDist] = React.useState(7);
  const [counsel,setCounsel]=React.useState(null);
  const [counselBusy,setCounselBusy]=React.useState(false);
  const enemies = (inactiveArmy?.units||[]).filter(e=>!destroyed[e.id]);
  const targetName = enemies.find(e=>e.id===chargeTarget)?.unit?.name||'';
  const pMake = probCharge(chargeDist);

  async function askChargeCounsel(){
    if(counselBusy||!chargeTarget) return;
    setCounselBusy(true); setCounsel(null);
    try{
      const ctx=counselContext||{};
      const userMsg=[
        `SITUATION — Round ${ctx.round??round} of 5, Charge phase. Score: you ${ctx.myVP??'?'}VP / enemy ${ctx.enemyVP??'?'}VP · CP ${ctx.myCP??'?'}.`,
        ctx.missions?`Active missions: ${ctx.missions}.`:'',
        `PROPOSED CHARGE: ${stripHTML(ent.unit?.name)} declares a charge against ${stripHTML(targetName)} at roughly ${chargeDist}″ — needs ${chargeDist} on 2D6, ${(pMake*100).toFixed(0)}% to make it. A failed charge leaves the unit standing in the open.`,
        `Question: is this charge worth declaring, and why — per your philosophy and the mission?`,
      ].filter(Boolean).join('\n');
      const reply=await callGemini(buildCounselSystemPrompt(commander?.key,commander),
        [{role:'user',parts:[{text:userMsg}]}],200,0.7);
      setCounsel(reply||'…static on the vox.');
    }catch(e){ setCounsel(`Vox link failed: ${String(e.message||e).slice(0,100)}`); }
    finally{ setCounselBusy(false); }
  }

  return(
    <div className="modal-overlay">
      <div className="modal anim-slide-up" style={{maxWidth:380,maxHeight:'80vh',display:'flex',flexDirection:'column'}}>
        <div className="modal-title">⚡ Charge — {ent.unit?.name}</div>
        <div style={{flex:1,overflowY:'auto'}}>
          <div style={{marginBottom:12}}>
            <div style={{fontSize:9,letterSpacing:2,color:'var(--brass)',fontFamily:"'Cinzel',serif",marginBottom:6}}>SELECT TARGET UNIT</div>
            {enemies.length===0&&<div style={{fontSize:10,color:'var(--text3)'}}>No enemy units on the battlefield.</div>}
            {enemies.map(e=>(
              <div key={e.id} onClick={()=>setChargeTarget(e.id)}
                style={{padding:'8px 10px',marginBottom:3,cursor:'pointer',
                  background:chargeTarget===e.id?'var(--reddim)':'var(--bg1)',
                  border:`1px solid ${chargeTarget===e.id?'var(--redBright)':'var(--border)'}`,
                  borderLeft:`3px solid ${chargeTarget===e.id?'var(--redBright)':'transparent'}`,
                  fontFamily:"'Cinzel',serif",fontSize:11,
                  color:chargeTarget===e.id?'var(--redBright)':'var(--text)'}}>
                {e.unit?.name}
              </div>
            ))}
          </div>
          {chargeTarget&&(
            <div style={{background:'var(--bg1)',border:'1px solid var(--goldborder)',padding:'10px 12px'}}>
              <div style={{fontSize:10,color:'var(--text2)',marginBottom:10,lineHeight:1.7}}>
                Roll 2D6. If result ≥ distance to <strong style={{color:'var(--gold)'}}>{targetName}</strong>, the charge succeeds.<br/>
                On success, move unit into <strong style={{color:'var(--gold)'}}>Engagement Range</strong> (within 1″).
              </div>
              {/* Charge odds calculator */}
              <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10,background:'var(--bg2)',border:'1px solid var(--border)',padding:'6px 10px'}}>
                <span style={{fontSize:9,color:'var(--text3)',flexShrink:0}}>Distance:</span>
                <button className="counter-btn" style={{width:22,height:22}} onClick={()=>setChargeDist(d=>Math.max(2,d-1))}>−</button>
                <span style={{fontSize:12,fontWeight:700,color:'var(--gold)',minWidth:26,textAlign:'center'}}>{chargeDist}″</span>
                <button className="counter-btn" style={{width:22,height:22}} onClick={()=>setChargeDist(d=>Math.min(12,d+1))}>+</button>
                <span style={{fontSize:10,color:pMake>=0.7?'var(--greenBright)':pMake>=0.4?'#ddcc44':'var(--redBright)',fontWeight:700,marginLeft:'auto'}}>
                  {(pMake*100).toFixed(0)}% to make it
                </span>
                {commander&&(
                  <button onClick={askChargeCounsel} disabled={counselBusy}
                    style={{fontSize:8,padding:'3px 7px',background:'var(--bg1)',border:'1px solid var(--goldborder)',color:'var(--gold)',cursor:'pointer',letterSpacing:1,fontFamily:"'Cinzel',serif",flexShrink:0}}>
                    {counselBusy?'…':'⚜'}
                  </button>
                )}
              </div>
              {counsel&&(
                <div style={{marginBottom:10,padding:'6px 9px',background:'rgba(200,168,75,.06)',borderLeft:`3px solid ${commander?.accent||'var(--gold)'}`,fontSize:10,color:'var(--text2)',lineHeight:1.55,fontStyle:'italic'}}>
                  <div style={{fontSize:8,color:commander?.accent||'var(--gold)',letterSpacing:1,fontFamily:"'Cinzel',serif",fontStyle:'normal',marginBottom:2}}>{commander?.name}</div>
                  {counsel}
                </div>
              )}
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
                <button className="btn btn-gold" onClick={()=>{
                  setChargeSuccess(cs=>({...cs,[entryId]:true}));
                  setEngaged(g=>({...g,[entryId]:true}));
                  setChargedUnits(c=>({...c,[entryId]:{round,targetId:chargeTarget}}));
                  playSFX('charge');
                  logAction(ent.unit?.name,`CHARGE SUCCESS → ${targetName}`,'Now in Engagement Range',0,()=>{
                    setChargeSuccess(cs=>({...cs,[entryId]:'pending'}));
                    setEngaged(g=>({...g,[entryId]:false}));
                  });
                  triggerReaction('unit_charged',ent.unit?.name,activePlayer);
                }}>✓ Succeeded</button>
                <button className="btn btn-danger" onClick={()=>{
                  setChargeSuccess(cs=>({...cs,[entryId]:false}));
                  playSFX('wound');
                  logAction(ent.unit?.name,'CHARGE FAILED','Roll insufficient',0,()=>setChargeSuccess(cs=>({...cs,[entryId]:'pending'})));
                }}>✗ Failed</button>
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}


// ── MELEE ATTACK ROLLER ────────────────────────────────────────────────────
function MeleeAttackRoller({entry, army, enemyArmy, wounds:battleWounds, destroyed, applyWounds, setDestroyed, setEngaged, chargedUnits, onClose, onLog, triggerReaction}){
  const unit = entry.unit;
  const meleeWeapons = (unit.weapons||[]).filter(w=>(w.type||'').toLowerCase()==='melee');
  const [selWeapon, setSelWeapon] = React.useState(meleeWeapons[0]?.name||'');
  const [numAtk, setNumAtk] = React.useState('');
  const [hits, setHits] = React.useState('');
  const [wounds, setWounds] = React.useState('');
  const [targetId, setTargetId] = React.useState('');
  const [resolved, setResolved] = React.useState(false);

  // Only allow attacking the unit that was charged (or any in ER if not from a charge)
  const chargedInfo = entry ? (chargedUnits?.[entry.id]) : null;
  const chargedTargetId = chargedInfo?.targetId||null;
  const allEnemies = (enemyArmy?.units||[]).filter(e=>!destroyed[e.id]);
  const enemies = chargedTargetId
    ? allEnemies.filter(e=>e.id===chargedTargetId)
    : allEnemies;
  const weapon = meleeWeapons.find(w=>w.name===selWeapon)||meleeWeapons[0];
  const dmg = parseInt(weapon?.damage)||1;
  const woundNum = parseInt(wounds)||0;
  const totalDmg = woundNum * dmg;
  const targetEntry = enemies.find(e=>e.id===targetId);
  const targetMaxW = parseInt(targetEntry?.unit?.models?.[0]?.w)||1;
  const targetCurW = targetEntry ? (battleWounds[targetEntry.id]??targetMaxW) : 0;
  const newW = Math.max(0, targetCurW - totalDmg);

  return(
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal anim-slide-up" style={{maxWidth:420,maxHeight:'85vh',display:'flex',flexDirection:'column'}} onClick={e=>e.stopPropagation()}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
          <div className="modal-title" style={{marginBottom:0}}>⚔ Fight — {unit.name}</div>
          <button className="btn btn-ghost btn-xs" onClick={onClose}>✕</button>
        </div>
        <div style={{flex:1,overflowY:'auto'}}>

          {/* Weapon select */}
          {meleeWeapons.length>1&&(
            <div style={{marginBottom:10}}>
              <div style={{fontSize:9,letterSpacing:2,color:'var(--brass)',fontFamily:"'Cinzel',serif",marginBottom:5}}>SELECT WEAPON</div>
              {meleeWeapons.map(w=>(
                <div key={w.name} onClick={()=>setSelWeapon(w.name)}
                  style={{padding:'6px 10px',marginBottom:3,cursor:'pointer',
                    background:selWeapon===w.name?'var(--golddim)':'var(--bg1)',
                    border:`1px solid ${selWeapon===w.name?'var(--gold)':'var(--border)'}`,
                    borderLeft:`3px solid ${selWeapon===w.name?'var(--gold)':'transparent'}`}}>
                  <div style={{fontFamily:"'Cinzel',serif",fontSize:11,color:'var(--gold)'}}>{w.name}</div>
                  <div style={{fontSize:9,color:'var(--text3)'}}>A:{w.attacks} S:{w.strength} AP:{w.ap} D:{w.damage}</div>
                </div>
              ))}
            </div>
          )}
          {weapon&&(
            <div style={{background:'var(--bg1)',border:'1px solid var(--goldborder)',padding:'8px 12px',marginBottom:10}}>
              <div style={{fontFamily:"'Cinzel',serif",fontSize:12,color:'var(--gold)',marginBottom:4}}>{weapon.name}</div>
              <div style={{display:'flex',gap:12,fontSize:10,color:'var(--text2)'}}>
                <span>Attacks: <strong style={{color:'var(--gold)'}}>{weapon.attacks}</strong></span>
                <span>S: <strong>{weapon.strength}</strong></span>
                <span>AP: <strong>{weapon.ap}</strong></span>
                <span>D: <strong style={{color:'var(--gold)'}}>{weapon.damage}</strong></span>
              </div>
            </div>
          )}

          {/* Roll steps */}
          {[
            {label:'1. Attacks rolled',sub:`Dice equal to Attacks characteristic (${weapon?.attacks||'?'})`,val:numAtk,set:setNumAtk,placeholder:`# attacks rolled`},
            {label:'2. Hits scored',sub:'Roll each: hit on WS value (4+ default)',val:hits,set:setHits,placeholder:'# hits'},
            {label:'3. Wounds scored',sub:`Roll S vs T comparison — each success wounds`,val:wounds,set:setWounds,placeholder:'# wounds'},
          ].map(row=>(
            <div key={row.label} style={{marginBottom:8}}>
              <div style={{fontSize:9,letterSpacing:1,color:'var(--brass)',fontFamily:"'Cinzel',serif",marginBottom:2}}>{row.label}</div>
              <div style={{fontSize:9,color:'var(--text3)',marginBottom:4}}>{row.sub}</div>
              <input type="number" min="0" value={row.val} onChange={e=>row.set(e.target.value)}
                placeholder={row.placeholder}
                style={{width:'100%',fontSize:13,padding:'6px 8px'}}/>
            </div>
          ))}

          {/* Target selector */}
          <div style={{marginBottom:10}}>
            <div style={{fontSize:9,letterSpacing:2,color:'var(--brass)',fontFamily:"'Cinzel',serif",marginBottom:5}}>SELECT TARGET</div>
            {enemies.length===0?(
              <div style={{fontSize:10,color:'var(--text3)',fontStyle:'italic'}}>No enemy units available.</div>
            ):enemies.map(e=>(
              <div key={e.id} onClick={()=>setTargetId(e.id)}
                style={{padding:'6px 10px',marginBottom:3,cursor:'pointer',
                  background:targetId===e.id?'var(--reddim)':'var(--bg1)',
                  border:`1px solid ${targetId===e.id?'var(--red)':'var(--border)'}`,
                  borderLeft:`3px solid ${targetId===e.id?'var(--redBright)':'transparent'}`}}>
                <div style={{fontFamily:"'Cinzel',serif",fontSize:11,color:targetId===e.id?'var(--redBright)':'var(--text)'}}>{stripHTML(e.unit?.name)}</div>
                <div style={{fontSize:9,color:'var(--text3)'}}>
                  {(battleWounds[e.id]??(parseInt(e.unit?.models?.[0]?.w)||1))}/{parseInt(e.unit?.models?.[0]?.w)||1}W
                </div>
              </div>
            ))}
          </div>

          {/* Apply damage */}
          {targetEntry&&woundNum>0&&!resolved&&(
            <div style={{background:'var(--reddim)',border:'1px solid var(--red)',padding:'10px 14px',marginTop:8}}>
              <div style={{fontSize:9,color:'var(--redBright)',letterSpacing:2,fontFamily:"'Cinzel',serif",marginBottom:6}}>APPLY TO TARGET</div>
              <div style={{fontSize:10,color:'var(--text2)',marginBottom:8}}>
                <strong style={{color:'var(--gold)'}}>{targetEntry.unit.name}</strong>: {targetCurW}/{targetMaxW}W →{' '}
                <strong style={{color:newW<=0?'var(--redBright)':'#ddcc44'}}>{newW}W</strong>
                {newW<=0&&' — DESTROYED'}
                {' '}({woundNum} wound{woundNum!==1?'s':''} × {dmg}dmg = -{Math.min(totalDmg,targetCurW)})
              </div>
              <button className="btn btn-danger" style={{width:'100%'}} onClick={()=>{
                const prev = battleWounds[targetEntry.id]??targetMaxW;
                applyWounds(w=>({...w,[targetEntry.id]:newW}));
                if(newW<=0){
                  setDestroyed(d=>({...d,[targetEntry.id]:true}));
                  // Both units disengage when target is slain
                  if(setEngaged) setEngaged(g=>({...g,[targetEntry.id]:false,[entry.id]:false}));
                }
                onLog(unit.name,`MELEE → ${targetEntry.unit.name}`,`${woundNum}w × ${dmg}dmg = -${Math.min(totalDmg,prev)}HP`,0,()=>{
                  applyWounds(w=>({...w,[targetEntry.id]:prev}));
                  if(newW<=0) setDestroyed(d=>({...d,[targetEntry.id]:false}));
                });
                if(newW<=0&&triggerReaction) triggerReaction('unit_destroyed',targetEntry.unit.name);
                setResolved(true);
              }}>⚔ Apply {totalDmg} Damage</button>
            </div>
          )}

          {resolved&&(
            <div style={{background:'var(--bg1)',border:'1px solid var(--greenBright)',padding:12,marginTop:8,textAlign:'center'}}>
              <div style={{fontSize:11,color:'var(--greenBright)',fontFamily:"'Cinzel',serif",letterSpacing:1,marginBottom:8}}>ATTACKS RESOLVED</div>
              <button className="btn btn-gold" style={{width:'100%'}} onClick={onClose}>Close</button>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}


function MissionCardRow({card,activePlayer,passPlay,missionCards,setMissionCards,modVP,logAction,triggerReaction,round}){
  const [showVP,setShowVP]=React.useState(false);

  function parseMissionVP(text){
    if(!text) return [{label:'Score',vp:1}];
    const opts=[];
    const matches=[...text.matchAll(/(\d+)VP[^.;]*?(?:if ([^.;]+?))?(?:[;.,]|$)/gi)];
    if(matches.length===0){
      const n=text.match(/(\d+)\s*VP/i);
      return n?[{label:`Score ${n[1]}VP`,vp:parseInt(n[1])}]:[{label:'Score',vp:1}];
    }
    const seen=new Set();
    for(const m of matches){
      const vp=parseInt(m[1]);
      if(seen.has(vp)) continue;
      seen.add(vp);
      const cond=m[2]?m[2].trim().slice(0,50):'';
      opts.push({label:cond?`${vp}VP — ${cond}`:`${vp}VP`,vp});
    }
    return opts.length?opts:[{label:'Score',vp:1}];
  }

  const vpOpts=parseMissionVP(card.text);
  const isPrimary=card.type==='primary';
  const borderColor=isPrimary?'var(--gold)':card.type==='secret'?'var(--redBright)':'var(--greenBright)';

  return(
    <div style={{background:'var(--bg1)',border:'1px solid var(--border)',marginBottom:6,borderLeft:`3px solid ${borderColor}`}}>
      <div style={{padding:'8px 12px'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:8}}>
          <div style={{flex:1}}>
            <div style={{fontFamily:"'Cinzel',serif",fontSize:11,fontWeight:700,color:'var(--text)',marginBottom:2}}>{card.name}</div>
            <div style={{display:'flex',gap:4,marginBottom:4,flexWrap:'wrap'}}>
              <span style={{fontSize:8,padding:'1px 5px',background:'var(--bg2)',border:'1px solid var(--border)',color:'var(--text3)',letterSpacing:.5,textTransform:'uppercase'}}>{card.type}</span>
              {isPrimary&&<span style={{fontSize:8,padding:'1px 5px',background:'var(--golddim)',border:'1px solid var(--goldborder)',color:'var(--gold)',letterSpacing:.5}}>SHARED</span>}
            </div>
            {card.text&&<div style={{fontSize:9,color:'var(--text3)',lineHeight:1.5}}>{card.text}</div>}
          </div>
        </div>
        {!showVP?(
          <div style={{display:'flex',gap:4,marginTop:8}}>
            <button className="btn btn-xs btn-gold" style={{flex:2}} onClick={()=>setShowVP(true)}>✓ Score VP</button>
            {!isPrimary&&<button className="btn btn-xs btn-danger" style={{flex:1}} onClick={()=>{
              setMissionCards(cs=>cs.map(c=>c.id===card.id?{...c,status:'failed'}:c));
              logAction(card.name,'MISSION FAILED','',0,()=>setMissionCards(cs=>cs.map(c=>c.id===card.id?{...c,status:'active'}:c)));
            }}>✕ Fail</button>}
          </div>
        ):(
          <div style={{marginTop:8}}>
            <div style={{fontSize:9,letterSpacing:1,color:'var(--brass)',fontFamily:"'Cinzel',serif",marginBottom:5}}>SELECT VP GAINED:</div>
            <div style={{display:'flex',flexDirection:'column',gap:3}}>
              {vpOpts.map((opt,i)=>(
                <button key={i} className="btn btn-sm btn-gold" onClick={()=>{
                  const p=card.player||activePlayer;
                  const vpType=isPrimary?'':(card.type==='secret'?'':'sec');
                  playSFX('score'); modVP(p,vpType,opt.vp);
                  setMissionCards(cs=>cs.map(c=>{
                    if(c.id!==card.id) return c;
                    if(isPrimary) return {...c,status:'scored',lastScoredRound:round};
                    return {...c,status:'scored'};
                  }));
                  triggerReaction('mission_scored',`${card.name} +${opt.vp}VP`);
                  logAction(card.name,`SCORED ${opt.vp}VP`,opt.label,opt.vp,()=>{
                    modVP(p,vpType,-opt.vp);
                    setMissionCards(cs=>cs.map(c=>c.id===card.id?{...c,status:'active',lastScoredRound:undefined}:c));
                  });
                  triggerReaction('own_vp',`${card.name} +${opt.vp}VP`);
                }}>{opt.label}</button>
              ))}
              <button className="btn btn-xs btn-outline" onClick={()=>setShowVP(false)}>Cancel</button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// ── EXPANDABLE ROW (ability / stratagem / enhancement) ─────────────────────
function ExpandableRow({title,subtitle,badge,badgeColor,children}){
  const [open,setOpen]=React.useState(false);
  return(
    <div style={{background:'var(--bg1)',border:'1px solid var(--border)',marginBottom:4,cursor:'pointer'}}
      onClick={()=>setOpen(o=>!o)}>
      <div style={{padding:'8px 12px',display:'flex',justifyContent:'space-between',alignItems:'center',gap:8}}>
        <div style={{flex:1}}>
          <div style={{fontFamily:"'Cinzel',serif",fontSize:11,color:badgeColor||'var(--gold)',letterSpacing:.5}}>{title}</div>
          {subtitle&&<div style={{fontSize:9,color:'var(--text3)',marginTop:1}}>{subtitle}</div>}
        </div>
        {badge&&<span style={{fontSize:8,padding:'1px 5px',background:'var(--golddim)',border:'1px solid var(--goldborder)',color:badgeColor||'var(--gold)',flexShrink:0}}>{badge}</span>}
        <span style={{fontSize:10,color:'var(--text3)',flexShrink:0}}>{open?'▲':'▼'}</span>
      </div>
      {open&&(
        <div style={{padding:'0 12px 10px',borderTop:'1px solid var(--border)'}} onClick={e=>e.stopPropagation()}>
          {children}
        </div>
      )}
    </div>
  );
}


function BattleScreen({battle,coreStrats,onPause,onEnd}){
  const {mode,pts,passPlay,p1Army,defender,firstPlayer,p1Name:_p1Name,p2Name:_p2Name} = battle;
  // ── ONLINE BATTLE ──
  // remote = {code, role:'host'|'guest', player:1|2}. The guest's army arrives
  // through the room once they join, so p2Army can start out null for a host.
  const remote=battle.remote||null;
  const [remoteGuest,setRemoteGuest]=useState(null); // {army,name} discovered by polling
  const p2Army=battle.p2Army||remoteGuest?.army||null;
  // Use provided names; fall back to role-based labels
  const p1Label=_p1Name||'Player 1';
  const p2Label=remoteGuest?.name||_p2Name||'Player 2';
  // Role labels — defender/attacker + first turn
  const defenderPlayer=battle.defender||1;
  const firstTurnPlayer=battle.firstPlayer||1;
  function playerRoleLabel(p){
    const name=p===1?p1Label:p2Label;
    const roles=[];
    if(p===defenderPlayer) roles.push('Defender');
    if(p===firstTurnPlayer&&round===1) roles.push('First Turn');
    return roles.length?`${name} (${roles.join(', ')})`:name;
  }

  // Restore saved state if resuming a paused battle
  const sv=battle.savedState||{};
  const [round,setRound]=useState(sv.round||1);
  const [activePlayer,setActivePlayer]=useState(sv.activePlayer||firstPlayer);
  const [phase,setPhase]=useState(sv.phase||0);

  // Ambient battle music — a generative drone whose colour matches Player 1's
  // army/mood, running for the whole battle; intensity nudges up as rounds pass.
  React.useEffect(()=>{
    AudioEngine.startAmbient(ambientPaletteFor(p1Army?.factionId,p1Army?.factionName));
    return ()=>AudioEngine.stopAmbient();
  },[p1Army?.factionId]);
  React.useEffect(()=>{ AudioEngine.setIntensity((round-1)/4); },[round]);

  // Per-player state
  const [cp,setCP]=useState(sv.cp||{p1:0,p2:0});
  const [vp,setVP]=useState(sv.vp||{p1:0,p2:0,p1sec:0,p2sec:0});
  const [wounds,setWounds]=useState(sv.wounds||{});
  const [destroyed,setDestroyed]=useState(sv.destroyed||{});
  const [engaged,setEngaged]=useState(sv.engaged||{});
  // missionCards: restored from savedState if resuming, or from mission setup if new battle
  const initMissionCards=sv.missionCards||(battle.initMissionCards||[]);

  const [tab,setTab]=useState('battle');
  const [missionCards,setMissionCards]=useState(initMissionCards); // {id,name,desc,status,type,vp}

  // Loaded once per mission pack, cached at module scope — see loadActiveRules.
  const [rulesData,setRulesData]=useState(null);
  React.useEffect(()=>{
    let alive=true;
    loadActiveRules(mode).then(d=>{ if(alive) setRulesData(d); });
    return ()=>{ alive=false; };
  },[mode?.id]);

  const [shootingUnit,setShootingUnit]=useState(null);
  const [showEndTurn,setShowEndTurn]=useState(false);
  const [showPause,setShowPause]=useState(false);
  const [showPhaseConfirm,setShowPhaseConfirm]=useState(null); // {count, nextPhase}
  const [showCommander,setShowCommander]=useState(false);
  const [abilityIntel,setAbilityIntel]=useState(null); // {ability} for AbilityIntelPanel
  // Active effects: [{id,name,source,desc,expires(code),unitId|null,player,modifiers,targetUnitId,startRound,startPhase,startPlayer}]
  // unitId=null → army-wide effect for `player`. Expiry handled by the effect
  // engine below using the canonical duration codes from normalizeExpiry().
  const [activeEffects,setActiveEffects]=useState(sv.activeEffects||[]);
  // Once-per-battle army rules already used: {'p1:Waaagh!':true}
  const [armyAbilityUsed,setArmyAbilityUsed]=useState(sv.armyAbilityUsed||{});

  function addEffect(name,source,desc,expires,unitId,extra){
    const id=Date.now().toString(36)+Math.random().toString(36).slice(2,5);
    const e=extra||{};
    setActiveEffects(fx=>[...fx,{
      id,name,source,desc,
      expires:normalizeExpiry(expires),
      unitId:unitId||null,
      player:e.player??activePlayer,
      modifiers:e.modifiers||[],
      targetUnitId:e.targetUnitId||null,
      startRound:round,startPhase:phase,startPlayer:activePlayer,
    }]);
  }
  function removeEffect(id){setActiveEffects(fx=>fx.filter(f=>f.id!==id));}

  // Seed each army's DETACHMENT RULE as a battle-long army-wide effect (e.g.
  // War Horde "Get Stuck In": melee gains [SUSTAINED HITS 1]) so it shows in
  // Active Effects and flows into the combat rollers. Runs once per battle —
  // resumed battles already carry their effects in savedState.
  React.useEffect(()=>{
    const seed=[];
    [[1,p1Army],[2,p2Army]].forEach(([pl,a])=>{
      const det=a?.detachment;
      if(!det||typeof det==='string') return;
      (det.abilities||[]).forEach((ab,i)=>{
        const txt=stripHTML(ab.description||'');
        seed.push({
          id:`det${pl}-${i}`,
          name:`${det.name}: ${ab.name}`,
          source:'Detachment rule',
          desc:txt.slice(0,120),
          expires:'battle',
          unitId:null, player:pl,
          modifiers:parseModifiersFromText(txt),
          targetUnitId:null,
          startRound:1,startPhase:0,startPlayer:firstPlayer,
        });
      });
    });
    if(seed.length) setActiveEffects(fx=>{
      const have=new Set(fx.map(f=>f.id));
      return [...fx,...seed.filter(s=>!have.has(s.id))];
    });
  },[p2Army?1:0]);

  // ── ONLINE SYNC ENGINE ────────────────────────────────────────────────────
  // Turn-based, so simple last-writer-wins with a monotonically increasing
  // version is enough. Everything except secret-flagged mission cards syncs;
  // each device keeps its own secrets and merges them back in on receive.
  const canAct=!remote||activePlayer===remote.player;
  const syncVer=React.useRef(0);        // highest version seen/pushed
  const applyingRemote=React.useRef(false);
  const pushTimer=React.useRef(null);

  function buildSyncState(){
    return {round,activePlayer,phase,cp,vp,wounds,destroyed,engaged,
      missionCards:missionCards.filter(c=>!c.secret),
      activeEffects,armyAbilityUsed};
  }
  function applyRemoteState(st){
    if(!st||typeof st!=='object'||st.round==null) return;
    applyingRemote.current=true;
    setRound(st.round);
    setActivePlayer(st.activePlayer||1);
    setPhase(st.phase||0);
    setCP(st.cp||{p1:0,p2:0});
    setVP(st.vp||{p1:0,p2:0,p1sec:0,p2sec:0});
    setWounds(st.wounds||{});
    setDestroyed(st.destroyed||{});
    setEngaged(st.engaged||{});
    setMissionCards(prev=>{
      const mySecrets=prev.filter(c=>c.secret);
      return [...(st.missionCards||[]),...mySecrets];
    });
    setActiveEffects(st.activeEffects||[]);
    setArmyAbilityUsed(st.armyAbilityUsed||{});
    setTimeout(()=>{applyingRemote.current=false;},50);
  }

  // Poll the room: pick up the opponent joining, and any newer state.
  React.useEffect(()=>{
    if(!remote) return;
    let stopped=false;
    const tick=async()=>{
      try{
        const room=await mpGetRoom(remote.code);
        if(stopped||!room) return;
        if(remote.role==='host'&&!p2Army&&room.meta?.guestArmy){
          setRemoteGuest({army:room.meta.guestArmy,name:room.meta.guestName||'Challenger'});
        }
        if(room.version>syncVer.current){
          syncVer.current=room.version;
          applyRemoteState(room.state);
        }
      }catch(e){/* offline blip — keep trying */}
    };
    tick();
    const iv=setInterval(tick,4000);
    return ()=>{stopped=true;clearInterval(iv);};
  },[remote?.code,p2Army]);

  // Push local changes (debounced). Both sides may push — the turn structure
  // keeps writes naturally serialized, and version ordering settles races.
  React.useEffect(()=>{
    if(!remote||applyingRemote.current) return;
    // The host seeds the room's first state; a guest stays silent until it
    // has pulled that seed, otherwise its fresh zero-state would win the race
    // and wipe the host's CP/VP.
    if(remote.role!=='host'&&syncVer.current===0) return;
    clearTimeout(pushTimer.current);
    pushTimer.current=setTimeout(async()=>{
      try{
        const version=Math.max(syncVer.current+1,Date.now());
        syncVer.current=version;
        await mpPatchRoom(remote.code,{state:buildSyncState(),version});
      }catch(e){/* retry rides on the next change or poll */}
    },1200);
    return ()=>clearTimeout(pushTimer.current);
  },[round,activePlayer,phase,cp,vp,wounds,destroyed,engaged,missionCards,activeEffects,armyAbilityUsed]);
  // Army-rule panel UI state
  const [armyRuleOpen,setArmyRuleOpen]=useState(true);
  const [armyRuleTargetId,setArmyRuleTargetId]=useState('');
  const [armyRuleUnitId,setArmyRuleUnitId]=useState('');
  const [armyRuleOptionIdx,setArmyRuleOptionIdx]=useState(0);
  const [cmdReaction,setCmdReaction]=useState(null); // {text, name, img, accent} shown briefly
  const [activated,setActivated]=useState({}); // {entryId: true} for this phase
  const [battleShocked,setBattleShocked]=useState({}); // {entryId: {until: round, failed: true}}
  const [shockTests,setShockTests]=useState({}); // {entryId: 'pending'|'passed'|'failed'} for current Command Phase
  const [cpGainedRound,setCpGainedRound]=useState({}); // {p1: lastRoundGained, p2: lastRoundGained}
  const [oppSectionOpen,setOppSectionOpen]=useState({}); // {player: bool} manual override for collapsed sections
  const [unitAction,setUnitAction]=useState({}); // {entryId: 'move'|'advance'|'shoot'|'fight'|'skip'...}
  const [chargedUnits,setChargedUnits]=useState({}); // {entryId: {round, targetId}}
  const [chargeSuccess,setChargeSuccess]=useState({}); // {entryId: true/false}
  const [actionLog,setActionLog]=useState([]); // [{id,round,phase,player,unitName,action,detail,vpDelta,undoFn}]
  const [stratForUnit,setStratForUnit]=useState(null); // entry — show strat picker for this unit
  const [unitDetailModal,setUnitDetailModal]=useState(null); // entry — show full unit detail from battlefield
  // Photo shown in the battlefield unit-detail modal — same priority as the
  // Armoury's UnitDetailModal (your own captured photo, else the repo stock photo).
  const [battleModalPhoto,setBattleModalPhoto]=useState(null);
  const [battleModalPickerOpen,setBattleModalPickerOpen]=useState(false);
  const [battleModalCapture,setBattleModalCapture]=useState(null);
  const [battleModalBgBusy,setBattleModalBgBusy]=useState(false);
  const [battleModalBgErr,setBattleModalBgErr]=useState(null);
  const battleModalFileRef=React.useRef(null);
  React.useEffect(()=>{
    if(!unitDetailModal){ setBattleModalPhoto(null); return; }
    let alive=true;
    getCustomPhoto(unitDetailModal._armyFactionId,unitDetailModal.unit.id).then(p=>{ if(alive) setBattleModalPhoto(p); });
    return ()=>{alive=false;};
  },[unitDetailModal]);
  async function battleOnPickFile(e){
    const file=e.target.files?.[0];
    e.target.value='';
    if(!file) return;
    setBattleModalBgErr(null);
    try{ setBattleModalCapture(await fileToDataURL(file)); }
    catch(err){ setBattleModalBgErr('Could not read that photo.'); }
  }
  async function battleApplyBgRemoval(){
    if(!battleModalCapture||battleModalBgBusy) return;
    setBattleModalBgBusy(true); setBattleModalBgErr(null);
    try{ setBattleModalCapture(await geminiRemoveBackground(battleModalCapture)); }
    catch(err){ setBattleModalBgErr(String(err.message||err)); }
    finally{ setBattleModalBgBusy(false); }
  }
  async function battleSaveCapture(){
    if(!battleModalCapture||!unitDetailModal) return;
    await saveCustomPhoto(unitDetailModal._armyFactionId,unitDetailModal.unit.id,battleModalCapture);
    setBattleModalPhoto(battleModalCapture); setBattleModalCapture(null); setBattleModalPickerOpen(false);
  }
  async function battleRemoveCustomPhotoNow(){
    if(!unitDetailModal) return;
    await deleteCustomPhoto(unitDetailModal._armyFactionId,unitDetailModal.unit.id);
    setBattleModalPhoto(null);
  }
  const [fightUnit,setFightUnit]=useState(null); // entry — show melee attack roller
  // Fight phase priority tracking (per rules doc)
  // Priority 1: Fights First (charged this turn OR has FightsFirst ability)
  // Priority 2: Normal in-ER units
  // Priority 3: Fights Last (rare)
  const [fightPhaseStep,setFightPhaseStep]=useState(1); // 1=FightsFirst, 2=Normal, 3=FightsLast
  const [fightActivated,setFightActivated]=useState({});
  const [activeArmyAbilities,setActiveArmyAbilities]=useState({}); // {abilityName: {player, expiresRound, modifiers}} // {entryId: true} — already fought this phase
  const [fallbackUnits,setFallbackUnits]=useState({}); // {entryId: round fallen back}

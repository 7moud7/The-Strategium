const SPECIAL_WEAPON_RULES = ['torrent','blast','sustained hits 1','sustained hits 2','sustained hits 3',
  'lethal hits','twin-linked','devastating wounds','melta 2','melta 3','melta 4','melta 6',
  'rapid fire 1','rapid fire 2','rapid fire 3','indirect fire','ignores cover','precision',
  'one shot','hazardous','psychic','lance','assault','heavy','pistol'];

// ── GAME SETUP SCREEN ────────────────────────────────────────────────────────

// ── BATTLEFIELD IMAGE ──────────────────────────────────────────────────────
// Attempts to load a battlefield layout image from GitHub. Shows a placeholder
// if the image isn't uploaded yet. Images go in:
// WH40K/Rules/Missions/Pariah Nexus/Battlefields/<Name>.jpg (or .png)
const BATTLEFIELD_IMG_BASE = "https://raw.githubusercontent.com/7moud7/The-Strategium/main/WH40K/Rules/Missions/Pariah%20Nexus/Maps/";
function BattlefieldImage({name}){
  const [src,setSrc]=React.useState('');
  const [failed,setFailed]=React.useState(false);

  const DEPLOY_IMG_MAP={
    'Crucible of Battle':'PN_CrucibleOfBattle.png','Crucible_of_Battle':'PN_CrucibleOfBattle.png',
    'Dawn of War':'PN_DawnOfWar.png','Dawn_of_War':'PN_DawnOfWar.png',
    'Hammer and Anvil':'PN_HammerAndAnvil.png','Hammer_and_Anvil':'PN_HammerAndAnvil.png',
    'Search and Destroy':'PN_SearchAndDestroy.png','Search_and_Destroy':'PN_SearchAndDestroy.png',
    'Sweeping Engagement':'PN_SweepingEngagement.png','Sweeping_Engagement':'PN_SweepingEngagement.png',
    'Tipping Point':'PN_TippingPoint.png','Tipping_Point':'PN_TippingPoint.png',
    'random':'PN_DawnOfWar.png',
  };

  React.useEffect(()=>{
    if(!name){ setSrc(''); setFailed(false); return; }
    const mapped=DEPLOY_IMG_MAP[name.trim()]||DEPLOY_IMG_MAP[name.trim().replace(/ /g,'_')];
    setSrc(mapped ? BATTLEFIELD_IMG_BASE+mapped : '');
    setFailed(!mapped);
  },[name]);

  if(!name) return null;
  if(failed||!src) return(
    <div style={{height:70,background:'var(--bg2)',border:'1px dashed var(--border)',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:3,marginTop:6}}>
      <div style={{fontSize:9,color:'var(--text3)'}}>No map image for: {name}</div>
      <div style={{fontSize:8,color:'var(--text3)',opacity:.5}}>Upload PN_CamelCase.png to GitHub /Maps/</div>
    </div>
  );
  return(
    <div style={{marginTop:8}}>
      <img src={src} alt={name}
        style={{width:'100%',display:'block',border:'1px solid var(--goldborder)',maxHeight:240,objectFit:'contain',background:'var(--bg0)'}}
        onError={()=>setFailed(true)}
      />
    </div>
  );
}

function GameSetupScreen({armies,coreStrats,onStart,onCancel,onFixArmy}){
  const [step,setStep]=useState(1);
  const [showAbandonConfirm,setShowAbandonConfirm]=useState(false);
  function requestCancel(){
    // Only interrupt with a confirmation once real decisions have been made —
    // stepping back from an empty first step needs no warning.
    if(step>1) setShowAbandonConfirm(true); else onCancel();
  }
  const [mode,setMode]=useState(null);
  const [pts,setPts]=useState(2000);
  const [passPlay,setPassPlay]=useState(false);
  const [onlineHost,setOnlineHost]=useState(false); // host an online room
  const [hostBusy,setHostBusy]=useState(false);
  const [hostErr,setHostErr]=useState(null);
  const [p1Army,setP1Army]=useState(null);
  const [p2Army,setP2Army]=useState(null);
  const [p1Name,setP1Name]=useState('');
  const [p2Name,setP2Name]=useState('');
  const [defender,setDefender]=useState(1);
  const [firstPlayer,setFirstPlayer]=useState(1);

  // ── Mission & Battlefield state ─────────────────────────────────────────
  const [pnData,setPnData]=useState(null); // loaded pariah-nexus.json
  const [pnLoading,setPnLoading]=useState(false);
  const [primaryMission,setPrimaryMission]=useState(null);    // {key, name, text}
  const [missionRules,setMissionRules]=useState([]);          // [{key,name,text}]
  const [deployment,setDeployment]=useState(null);            // {key,name,desc}
  const [secondaryMode,setSecondaryMode]=useState('tactical');// 'fixed'|'tactical'
  const [p1SecMode,setP1SecMode]=useState('tactical');
  const [p2SecMode,setP2SecMode]=useState('tactical');
  const [p1Secondaries,setP1Secondaries]=useState([]);        // [{key,name,text}]
  const [p2Secondaries,setP2Secondaries]=useState([]);
  const [showManualSec1,setShowManualSec1]=useState(false);
  const [showManualSec2,setShowManualSec2]=useState(false);
  const [battlefield,setBattlefield]=useState(null);          // terrain layout info
  const [secretMission,setSecretMission]=useState(null);      // optional

  const selectedMode = GAME_MODES.flatMap(g=>g.modes).find(m=>m.id===mode);
  // Any matched mission pack with a data file gets the full card-drawing flow
  // (Pariah Nexus, Leviathan, Chapter Approved 2025-26).
  const missionFile = selectedMode?.id && MODE_RULES_FILES[selectedMode.id];
  const isPariahNexus = !!missionFile;
  const validArmy = (a) => !selectedMode || a.pointsLimit<=pts;
  const filteredArmies = armies.filter(validArmy);

  // Load the selected mission pack's data (cards, layouts, scoring)
  React.useEffect(()=>{
    if(!missionFile) return;
    setPnData(null);
    setPnLoading(true);
    fetch(MISSIONS_BASE+missionFile)
      .then(r=>r.ok?r.json():null)
      .then(d=>{setPnData(d);setPnLoading(false);})
      .catch(()=>setPnLoading(false));
  },[missionFile]);

  // ── Draw helpers ────────────────────────────────────────────────────────
  function drawRandom(pool,count,exclude=[]){
    const keys=Object.keys(pool).filter(k=>!exclude.includes(k));
    const shuffled=[...keys].sort(()=>Math.random()-.5);
    return shuffled.slice(0,count).map(k=>({key:k,name:k.replace(/_/g,' '),text:pool[k]}));
  }

  function autoDraw(){
    if(!pnData) return;
    // Primary mission
    const pm=drawRandom(pnData.primaryMissions,1);
    setPrimaryMission(pm[0]||null);
    // 1 Mission Rule card (Leviathan/Pariah have these; CA2025 does not)
    const mr=pnData.missionRuleCards?drawRandom(pnData.missionRuleCards,1):[];
    setMissionRules(mr);
    // Deployment — use terrain layouts key names as pseudo-deployment zones
    const deplOptions=['Dawn of War','Search and Destroy','Hammer and Anvil','Tipping Point','Sweeping Engagement','Crucible of Battle'];
    setDeployment({key:'random',name:deplOptions[Math.floor(Math.random()*deplOptions.length)],desc:'Randomly determined deployment zone.'});
    // Battlefield — use terrain layout info from JSON
    if(pnData.terrainLayouts){
      setBattlefield({
        size:'44×60″ (Strike Force)',
        primaryFeature:pnData.terrainLayouts.primaryFeature,
        heightKey:pnData.terrainLayouts.heightKey,
        recommendedPieces:pnData.terrainLayouts.recommendedSizes,
      });
    }
  }

  function drawSecondaries(forPlayer){
    if(!pnData?.secondaryMissions?.cards) return;
    const already=(forPlayer===1?p1Secondaries:p2Secondaries).map(c=>c.key);
    const drawn=drawRandom(pnData.secondaryMissions.cards,2,already);
    if(forPlayer===1) setP1Secondaries(drawn);
    else setP2Secondaries(drawn);
  }

  function handleStart(){
    const initMissionCards=[];
    if(primaryMission) initMissionCards.push({
      id:'pm_'+primaryMission.key,name:primaryMission.name,
      type:'primary',status:'active',fromPack:selectedMode?.name,
      text:primaryMission.text,
    });
    [...p1Secondaries,...p2Secondaries].forEach(c=>{
      initMissionCards.push({
        id:'sec_'+c.key+'_'+Date.now(),name:c.name,
        type:'secondary',status:'active',fromPack:selectedMode?.name,
        text:c.text,
      });
    });
    if(secretMission) initMissionCards.push({
      id:'secret_'+Date.now(),name:secretMission.name,
      type:'secret',status:'active',fromPack:selectedMode?.name,
      text:secretMission.text,
      secret:true, // never synced to the opponent in online battles
    });
    const battleData={
      mode:selectedMode,
      pts,passPlay,
      p1Name:p1Name.trim()||'Player 1',
      p2Name:p2Name.trim()||'Player 2',
      p1Army: p1Army ? armies.find(a=>a.id===p1Army) : null,
      p2Army: p2Army ? armies.find(a=>a.id===p2Army) : null,
      defender,firstPlayer,coreStrats,
      // Mission state passed straight into battle
      initMissionCards,
      primaryMission,missionRules,deployment,battlefield,secondaryMode,p1SecMode,p2SecMode,
    };
    if(onlineHost&&!passPlay){
      // Create the online room first; the opponent joins by code from their device.
      setHostBusy(true); setHostErr(null);
      const code=mpNewCode();
      mpCreateRoom(code,{
        mode:selectedMode?{id:selectedMode.id,name:selectedMode.name}:null,
        pts,
        p1Name:battleData.p1Name,
        defender,firstPlayer,
        hostArmy:battleData.p1Army,
        // secret cards stay on the host device
        initMissionCards:initMissionCards.filter(c=>!c.secret),
      }).then(()=>{
        onStart({...battleData,p2Army:null,p2Name:'Awaiting challenger…',remote:{code,role:'host',player:1}});
      }).catch(e=>{
        setHostErr('Could not create the online room — check your internet. '+String(e.message||'').slice(0,60));
      }).finally(()=>setHostBusy(false));
      return;
    }
    onStart(battleData);
  }

  // Steps: 1=GameType 2=Points 3=Armies 4=RollOff 5=Mission 6=Battlefield 7=Ready
  const TOTAL_STEPS = isPariahNexus ? 7 : 5;
  const stepLabels = isPariahNexus
    ? ['','Game Type','Points','Armies','Roll-Off','Mission','Battlefield','Ready']
    : ['','Game Type','Points','Armies','Roll-Off','Ready'];

  // For non-PN modes, map step 5→summary; for PN, 5=mission 6=battlefield 7=summary
  const summaryStep = isPariahNexus ? 7 : 5;

  function canAdvance(){
    if(step===1) return mode && !GAME_MODES.flatMap(g=>g.modes).find(m=>m.id===mode)?.disabled;
    if(step===3) return !!p1Army;
    if(step===5 && isPariahNexus) return !!primaryMission;
    return true;
  }

  return(
    <div style={{display:'flex',flexDirection:'column',height:'100%'}}>
      {/* Header */}
      <div className="topbar">
        <button className="btn btn-outline btn-sm" onClick={requestCancel}>← Back</button>
        <span className="topbar-title">Battle Setup</span>
        <span style={{fontSize:9,color:'var(--text3)',letterSpacing:2}}>STEP {step}/{TOTAL_STEPS}</span>
      </div>

      {/* Step indicator */}
      <div style={{display:'flex',background:'var(--bg1)',borderBottom:'1px solid var(--border)',padding:'8px 16px',gap:4}}>
        {Array.from({length:TOTAL_STEPS},(_,i)=>i+1).map(s=>(
          <div key={s} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:3}}>
            <div style={{
              width:22,height:22,border:`1px solid ${s<=step?'var(--gold)':'var(--border)'}`,
              background:s<step?'var(--golddim)':s===step?'var(--bg3)':'transparent',
              display:'flex',alignItems:'center',justifyContent:'center',
              fontSize:10,color:s<=step?'var(--gold)':'var(--text3)',fontFamily:'Cinzel,serif',fontWeight:700,
            }}>{s<step?'✓':s}</div>
          </div>
        ))}
      </div>

      <div style={{flex:1,overflowY:'auto',padding:16}}>

        {/* STEP 1 — Game Type */}
        {step===1&&(
          <div>
            <div className="section-label" style={{marginTop:0}}>Select Game Type</div>
            {GAME_MODES.map(group=>(
              <div key={group.category} style={{marginBottom:12}}>
                <div style={{fontSize:9,letterSpacing:3,color:'var(--brass)',fontFamily:'Cinzel,serif',textTransform:'uppercase',marginBottom:6,paddingBottom:3,borderBottom:'1px solid var(--goldborder)'}}>{group.category}</div>
                {group.modes.map(m=>(
                  <div key={m.id}
                    onClick={()=>{if(!m.disabled){setMode(m.id);playSFX('activate');}}}
                    className="anim-press"
                    style={{
                      background:mode===m.id?'var(--golddim)':m.disabled?'transparent':'var(--bg1)',
                      border:`1px solid ${mode===m.id?'var(--gold)':m.disabled?'rgba(42,42,58,.4)':'var(--border)'}`,
                      padding:'10px 14px',marginBottom:4,
                      cursor:m.disabled?'default':'pointer',
                      display:'flex',alignItems:'center',gap:10,
                      borderLeft:mode===m.id?'3px solid var(--gold)':m.disabled?'3px solid rgba(42,42,58,.3)':'3px solid transparent',
                      transition:'all .15s',
                      opacity:m.disabled?0.45:1,
                    }}>
                    <div style={{flex:1}}>
                      <div style={{fontFamily:"'Cinzel',serif",fontSize:12,color:mode===m.id?'var(--gold)':m.disabled?'var(--text3)':'var(--text)',letterSpacing:.5}}>{m.name}</div>
                      <div style={{fontSize:9,color:'var(--text3)',marginTop:2,letterSpacing:1}}>
                        {m.disabled?'COMING SOON':`${m.crusade?'CRUSADE · ':''}${m.boarding?'BOARDING ACTION · ':''}${(m.pts||[]).join(' / ')} pts`}
                      </div>
                    </div>
                    {mode===m.id&&<div style={{color:'var(--gold)',fontSize:14}}>◆</div>}
                    {m.disabled&&<span style={{fontSize:8,padding:'1px 5px',border:'1px solid rgba(42,42,58,.5)',color:'var(--text3)',letterSpacing:1,flexShrink:0}}>SOON</span>}
                  </div>
                ))}
              </div>
            ))}
          </div>
        )}

        {/* STEP 2 — Points */}
        {step===2&&(
          <div>
            <div className="section-label" style={{marginTop:0}}>Points Limit</div>
            <div style={{fontSize:11,color:'var(--text3)',marginBottom:12,letterSpacing:.5}}>
              Game Type: <span style={{color:'var(--gold)'}}>{selectedMode?.name}</span>
            </div>
            {(selectedMode?.sizes||selectedMode?.pts?.map(p=>null)||[null]).map((sizeId,idx)=>{
              const p=sizeId?BATTLE_SIZES.find(b=>b.id===sizeId)?.pts:(selectedMode?.pts?.[idx]);
              if(!p) return null;
              const bsize=sizeId?BATTLE_SIZES.find(b=>b.id===sizeId):null;
              return(
                <div key={p}
                  onClick={()=>setPts(p)}
                  style={{
                    background:pts===p?'var(--golddim)':'var(--bg1)',
                    border:`1px solid ${pts===p?'var(--gold)':'var(--border)'}`,
                    padding:'12px 16px',marginBottom:6,cursor:'pointer',
                    display:'flex',justifyContent:'space-between',alignItems:'center',
                    borderLeft:pts===p?'3px solid var(--gold)':'3px solid transparent',
                  }}>
                  <div>
                    {bsize&&<div style={{fontFamily:"'Cinzel',serif",fontSize:10,letterSpacing:2,color:pts===p?'var(--gold)':'var(--text3)',textTransform:'uppercase',marginBottom:2}}>{bsize.label}</div>}
                    <span style={{fontFamily:"'Cinzel',serif",fontSize:selectedMode?.crusade?13:16,color:pts===p?'var(--gold)':'var(--text)',letterSpacing:2,fontWeight:700}}>
                      {selectedMode?.crusade?`${p} Supply Limit`:`${p} pts`}
                    </span>
                    {bsize&&<div style={{fontSize:9,color:'var(--text3)',marginTop:2}}>{bsize.duration}</div>}
                  </div>
                  <span style={{fontSize:10,color:'var(--text3)',letterSpacing:1}}>
                    {filteredArmies.filter(a=>a.pointsLimit<=p).length} armies
                  </span>
                </div>
              );
            })}
          </div>
        )}

        {/* STEP 3 — Armies + Pass & Play */}
        {step===3&&(
          <div>
            <div className="section-label" style={{marginTop:0}}>Game Mode</div>
            <div style={{fontSize:11,color:'var(--text3)',marginBottom:16,letterSpacing:.5}}>
              Is this a Pass and Play game on a single device?
            </div>
            {[{val:false,title:'Single Commander',sub:'Track your army only. Opponent managed separately.'},{val:true,title:'Pass & Play',sub:'Both armies tracked on this device. Pass the device between turns.'}].map(opt=>(
              <div key={String(opt.val)}
                onClick={()=>{setPassPlay(opt.val);if(opt.val)setOnlineHost(false);}}
                style={{
                  background:passPlay===opt.val?'var(--golddim)':'var(--bg1)',
                  border:`1px solid ${passPlay===opt.val?'var(--gold)':'var(--border)'}`,
                  padding:'14px 16px',marginBottom:8,cursor:'pointer',
                  borderLeft:passPlay===opt.val?'3px solid var(--gold)':'3px solid transparent',
                }}>
                <div style={{fontFamily:'Cinzel,serif',fontSize:13,color:passPlay===opt.val?'var(--gold)':'var(--text)',letterSpacing:.5,marginBottom:4}}>{opt.title}</div>
                <div style={{fontSize:11,color:'var(--text3)',letterSpacing:.3}}>{opt.sub}</div>
              </div>
            ))}

            {/* Online mode — host a room another device can join by code */}
            {!passPlay&&(
              <div onClick={()=>setOnlineHost(v=>!v)}
                style={{background:onlineHost?'rgba(74,122,184,.12)':'var(--bg1)',
                  border:`1px solid ${onlineHost?'var(--blueBright)':'var(--border)'}`,
                  borderLeft:onlineHost?'3px solid var(--blueBright)':'3px solid transparent',
                  padding:'12px 16px',marginBottom:12,cursor:'pointer'}}>
                <div style={{fontFamily:'Cinzel,serif',fontSize:12,color:onlineHost?'var(--blueBright)':'var(--text)',letterSpacing:.5,marginBottom:3}}>
                  🌐 Online Battle {onlineHost?'— ON':''}
                </div>
                <div style={{fontSize:10,color:'var(--text3)',lineHeight:1.5}}>
                  Host a room and get a code. Your opponent joins from their own device (War → Join Online Battle), brings their own army, and you take turns — the tracker syncs automatically. Secret Missions stay hidden on each player's device.
                </div>
              </div>
            )}

            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:12}}>
              <div>
                <div style={{fontSize:9,letterSpacing:2,color:'var(--brass)',fontFamily:"'Cinzel',serif",textTransform:'uppercase',marginBottom:5}}>{passPlay?'Player 1 Name':'Your Name'}</div>
                <input value={p1Name} onChange={e=>setP1Name(e.target.value)} placeholder={passPlay?'Player 1 name':'Your name'} style={{fontSize:12}}/>
              </div>
              {passPlay&&(
                <div>
                  <div style={{fontSize:9,letterSpacing:2,color:'var(--brass)',fontFamily:"'Cinzel',serif",textTransform:'uppercase',marginBottom:5}}>Player 2 Name</div>
                  <input value={p2Name} onChange={e=>setP2Name(e.target.value)} placeholder="Player 2 name" style={{fontSize:12}}/>
                </div>
              )}
            </div>
            <div className="section-label">Select {passPlay?'Player 1 Army':'Your Army'}</div>
            {filteredArmies.map(a=>{
              const takenByP2=passPlay&&p2Army===a.id;
              return(
              <div key={a.id}
                onClick={()=>{if(!takenByP2)setP1Army(a.id);}}
                style={{
                  background:p1Army===a.id?'var(--golddim)':'var(--bg1)',
                  border:`1px solid ${p1Army===a.id?'var(--gold)':'var(--border)'}`,
                  padding:'10px 14px',marginBottom:4,cursor:takenByP2?'not-allowed':'pointer',display:'flex',gap:10,alignItems:'center',
                  borderLeft:p1Army===a.id?'3px solid var(--gold)':'3px solid transparent',
                  opacity:takenByP2?0.4:1,
                }}>
                <div className="army-faction-mark" style={{width:28,height:28,fontSize:9}}>{FACTION_ICONS[a.factionId]||'?'}</div>
                <div style={{flex:1}}>
                  <div style={{fontFamily:'Cinzel,serif',fontSize:11,color:p1Army===a.id?'var(--gold)':'var(--text)',letterSpacing:.5}}>{a.name}</div>
                  <div style={{fontSize:9,color:'var(--text3)',marginTop:2}}>{takenByP2?'Already fielded by Player 2':(a.detachment?.name||'No Detachment')+' · '+(a.units?.length||0)+' units'}</div>
                </div>
              </div>
              );
            })}
            {filteredArmies.length===0&&<div style={{color:'var(--text3)',fontSize:11,padding:16,textAlign:'center',border:'1px solid var(--border)'}}>No armies match this game mode and points limit</div>}

            {passPlay&&(
              <>
                <div className="section-label">Select Player 2 Army</div>
                {filteredArmies.map(a=>(
                  <div key={a.id}
                    onClick={()=>{if(a.id!==p1Army)setP2Army(a.id);}}
                    style={{
                      background:p2Army===a.id?'var(--golddim)':'var(--bg1)',
                      border:`1px solid ${p2Army===a.id?'var(--gold)':'var(--border)'}`,
                      padding:'10px 14px',marginBottom:4,cursor:'pointer',display:'flex',gap:10,alignItems:'center',
                      borderLeft:p2Army===a.id?'3px solid var(--gold)':'3px solid transparent',
                    }}>
                    <div className="army-faction-mark" style={{width:28,height:28,fontSize:9}}>{FACTION_ICONS[a.factionId]||'?'}</div>
                    <div style={{flex:1}}>
                      <div style={{fontFamily:'Cinzel,serif',fontSize:11,color:p2Army===a.id?'var(--gold)':'var(--text)',letterSpacing:.5}}>{a.name}</div>
                      <div style={{fontSize:9,color:'var(--text3)',marginTop:2}}>{a.detachment?.name||'No Detachment'} · {a.units?.length||0} units</div>
                    </div>
                  </div>
                ))}
              </>
            )}
          </div>
        )}

        {/* STEP 4 — Roll-Off / Attacker+Defender */}
        {step===4&&(

              if(isPariahNexus&&!primaryMission) missionIssues.push({msg:'No Primary Mission selected',step:5});
              if(isPariahNexus&&!deployment) missionIssues.push({msg:'No Deployment Zone selected',step:6});
              // Every player must lock in exactly 2 Secondary Missions (drawn or hand-picked)
              // before the battle can begin — a battle with an empty hand can't be scored fairly.
              if(isPariahNexus){
                if(p1Secondaries.length<2) missionIssues.push({msg:`${passPlay?'Player 1':'You'}: only ${p1Secondaries.length}/2 Secondary Missions selected`,step:5});
                if(passPlay&&p2Secondaries.length<2) missionIssues.push({msg:`Player 2: only ${p2Secondaries.length}/2 Secondary Missions selected`,step:5});
              }
              const canStart = !p1Issues.length && (!passPlay||!p2Issues.length) && !missionIssues.length;
              return(<>
                {(allIssues.length>0||missionIssues.length>0)&&(
                  <div style={{background:'var(--reddim)',border:'1px solid var(--red)',padding:'10px 14px',marginBottom:12,marginTop:12}}>
                    <div style={{fontSize:9,letterSpacing:2,color:'var(--redBright)',fontFamily:"'Cinzel',serif",textTransform:'uppercase',marginBottom:6}}>Cannot Begin Yet — Tap An Issue To Fix It</div>
                    {allIssues.map((iss,i)=>(
                      <div key={'a'+i} onClick={iss.armyId&&onFixArmy?()=>onFixArmy(iss.armyId):undefined}
                        style={{fontSize:10,color:'var(--text2)',display:'flex',gap:6,marginBottom:2,alignItems:'center',cursor:iss.armyId&&onFixArmy?'pointer':'default'}}>
                        <span style={{color:'var(--redBright)'}}>✗</span><span style={{flex:1}}>{iss.label}</span>
                        {iss.armyId&&onFixArmy&&<span style={{fontSize:9,color:'var(--gold)',flexShrink:0}}>Fix →</span>}
                      </div>
                    ))}
                    {missionIssues.map((iss,i)=>(
                      <div key={'m'+i} onClick={iss.step?()=>setStep(iss.step):undefined}
                        style={{fontSize:10,color:'var(--text2)',display:'flex',gap:6,marginBottom:2,alignItems:'center',cursor:iss.step?'pointer':'default'}}>
                        <span style={{color:'var(--redBright)'}}>✗</span><span style={{flex:1}}>{iss.msg}</span>
                        {iss.step&&<span style={{fontSize:9,color:'var(--gold)',flexShrink:0}}>Go to Step {iss.step} →</span>}
                      </div>
                    ))}
                  </div>
                )}
                <button className="btn btn-gold" style={{width:'100%',padding:16,fontSize:12,letterSpacing:4,opacity:canStart?1:0.5,marginTop:16}}
                  onClick={canStart&&!hostBusy?handleStart:undefined} disabled={!canStart||!p1Army||hostBusy}>
                  {hostBusy?'CREATING ROOM…':'BEGIN ENGAGEMENT'}
                </button>
                {hostErr&&<div style={{fontSize:10,color:'var(--redBright)',textAlign:'center',marginTop:6}}>{hostErr}</div>}
                {!canStart&&<div style={{fontSize:10,color:'var(--text3)',textAlign:'center',marginTop:6}}>Tap an issue above to jump straight to fixing it</div>}
              </>);
            })()}
          </div>
        )}

      </div>

      {/* Navigation */}
      <div style={{background:'var(--bg1)',borderTop:'1px solid var(--border)',padding:'12px 16px',display:'flex',gap:8,flexShrink:0}}>
        {step>1&&<button className="btn btn-outline anim-press" style={{flex:1}} onClick={()=>{playSFX('activate');setStep(s=>s-1);}}>← Previous</button>}
        {step<summaryStep&&(
          <button className="btn btn-gold anim-press" style={{flex:2}}
            onClick={()=>{if(canAdvance()){playSFX('phase');setStep(s=>s+1);}}}
            disabled={!canAdvance()}>
            Next →
          </button>
        )}
      </div>

      {/* Abandon-setup confirmation */}
      {showAbandonConfirm&&(
        <div className="modal-overlay" onClick={()=>setShowAbandonConfirm(false)}>
          <div className="modal anim-slide-up" style={{maxWidth:360}} onClick={e=>e.stopPropagation()}>
            <div className="modal-title">Abandon the Muster?</div>
            <div style={{fontSize:11,color:'var(--text2)',lineHeight:1.7,marginBottom:14}}>
              The war council has not yet been sealed. Turning back now scatters every order given this session to the void — armies, mission, and battle-plan alike.
            </div>
            <div style={{display:'flex',gap:8}}>
              <button className="btn btn-outline" style={{flex:1}} onClick={()=>setShowAbandonConfirm(false)}>Stay the Course</button>
              <button className="btn btn-danger" style={{flex:1}} onClick={onCancel}>Abandon</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// Parse an ability text into structured rules data
// ── SHARED MODIFIER PARSER ──────────────────────────────────────────────────
// Extracts machine-usable stat modifiers from ability rule text. Used by the
// leader-bonus engine, the ability-activation flow and the army-rule engine so
// they all understand modifiers the same way.
// Modifier shape: {stat, delta?, val?, label, scope?:'melee'|'ranged'|'all', targeted?:bool}
function parseModifiersFromText(text){
  const t=String(text||'');
  const mods=[];
  const melee=/melee (weapon|attack)/i.test(t)&&!/ranged (weapon|attack)/i.test(t)?'melee'
    :(/ranged (weapon|attack)/i.test(t)&&!/melee (weapon|attack)/i.test(t)?'ranged':'all');
  // Hit rolls
  if(/(\+\s*1|add 1)[^.]{0,50}hit roll|hit roll[^.]{0,25}\+\s*1/i.test(t)) mods.push({stat:'hit',delta:+1,label:'+1 to Hit',scope:melee});
  if(/(-\s*1|subtract 1)[^.]{0,50}hit roll/i.test(t)) mods.push({stat:'hit',delta:-1,label:'-1 to Hit',scope:melee});
  // Wound rolls
  if(/(\+\s*1|add 1)[^.]{0,50}wound roll/i.test(t)) mods.push({stat:'wound',delta:+1,label:'+1 to Wound',scope:melee});
  if(/(-\s*1|subtract 1)[^.]{0,50}wound roll/i.test(t)) mods.push({stat:'wound',delta:-1,label:'-1 to Wound',scope:melee});
  // Attacks
  if(/add 1 to the attacks|\+\s*1[^.]{0,40}attacks characteristic|1 extra attack|an additional attack/i.test(t)) mods.push({stat:'attacks',delta:+1,label:'+1 Attack',scope:melee});
  // Strength
  if(/add 1[^.]{0,40}strength characteristic|\+\s*1[^.]{0,40}strength characteristic/i.test(t)) mods.push({stat:'strength',delta:+1,label:'+1 Strength',scope:melee});
  // Damage
  if(/add 1[^.]{0,40}damage characteristic|\+\s*1[^.]{0,40}damage characteristic/i.test(t)) mods.push({stat:'damage',delta:+1,label:'+1 Damage',scope:melee});
  // AP improvement
  if(/improve[^.]{0,50}armour penetration[^.]{0,25}by 1|armour penetration[^.]{0,50}improved by 1/i.test(t)) mods.push({stat:'ap',delta:-1,label:'AP improved by 1',scope:melee});
  // Invulnerable save
  const inv=t.match(/(\d)\+\s*invulnerable save|invulnerable save of (\d)\+/i);
  if(inv){const v=parseInt(inv[1]||inv[2]); mods.push({stat:'inv',val:v,label:`${v}+ Invulnerable Save`});}
  // Feel No Pain
  const fnp=t.match(/feel no pain[^0-9]{0,12}(\d)\+|(\d)\+[^.]{0,25}feel no pain/i);
  if(fnp){const v=parseInt(fnp[1]||fnp[2]); mods.push({stat:'fnp',val:v,label:`${v}+ Feel No Pain`});}
  // Re-rolls (hint chips — rolls are entered manually)
  if(/re-?roll[^.]{0,40}hit roll/i.test(t)) mods.push({stat:'reroll_hit',label:/(of|a)\s*1/i.test(t.match(/re-?roll[^.]{0,40}hit roll[^.]{0,15}/i)?.[0]||'')?'Re-roll Hit rolls of 1':'Re-roll Hit rolls'});
  if(/re-?roll[^.]{0,40}wound roll/i.test(t)) mods.push({stat:'reroll_wound',label:/(of|a)\s*1/i.test(t.match(/re-?roll[^.]{0,40}wound roll[^.]{0,15}/i)?.[0]||'')?'Re-roll Wound rolls of 1':'Re-roll Wound rolls'});
  // Granted weapon keywords (hints)
  if(/gains? (the )?\[?lethal hits\]?|have (the )?\[?lethal hits\]?/i.test(t)) mods.push({stat:'kw',label:'Gains [LETHAL HITS]'});
  if(/gains? (the )?\[?sustained hits|have (the )?\[?sustained hits/i.test(t)) mods.push({stat:'kw',label:'Gains [SUSTAINED HITS]'});
  if(/gains? (the )?\[?devastating wounds\]?/i.test(t)) mods.push({stat:'kw',label:'Gains [DEVASTATING WOUNDS]'});
  // Movement exceptions
  if(/advance and (still )?(declare a )?charge|eligible to (declare a )?charge in a turn in which it advanced/i.test(t)) mods.push({stat:'advance_and_charge',label:'Can Advance & Charge'});
  return mods;
}

// Canonical effect duration codes + legacy-string normaliser.
// Codes: end_of_phase | end_of_turn | start_of_next_turn | end_of_round | battle | while_active
function normalizeExpiry(expires){
  if(!expires) return 'while_active';
  const e=String(expires).toLowerCase();
  if(['end_of_phase','end_of_turn','start_of_next_turn','end_of_round','battle','while_active'].includes(e)) return e;
  if(e.includes('phase')) return 'end_of_phase';
  if(e.includes('next')) return 'start_of_next_turn';
  if(e.includes('turn')) return 'end_of_turn';
  if(e.includes('round')) return 'end_of_round';
  if(e.includes('battle')&&!e.includes('once')) return 'battle';
  return 'while_active';
}
function expiryLabel(code){
  return {
    end_of_phase:'until end of this phase',
    end_of_turn:'until end of this turn',
    start_of_next_turn:"until owner's next turn",
    end_of_round:'until end of this battle round',
    battle:'rest of the battle',
    while_active:'until removed',
  }[normalizeExpiry(code)]||'until removed';
}

    summary:'Imperial Agents have no single army rule — agent units are requisitioned into Imperium armies and bring their own datasheet abilities.'},
};

function parseAbility(ability){
  if(!ability?.name&&!ability?.description) return null;
  const name=(ability.name||'').toLowerCase();
  const desc=(ability.description||ability.rule||ability.effect||'').toLowerCase();
  const raw=cleanAbilityDesc(ability.description||ability.rule||ability.effect||'',ability.name);

  // Determine phase
  let phase='any';
  if(desc.includes('command phase')) phase='command';
  else if(desc.includes('movement phase')) phase='movement';
  else if(desc.includes('shooting phase')) phase='shooting';
  else if(desc.includes('charge phase')) phase='charge';
  else if(desc.includes('fight phase')) phase='fight';

  // Determine type
  let type='passive';
  let isException=false;
  if(desc.includes('instead of')||desc.includes('override')||desc.includes('even if')||desc.includes('as if they had not')||desc.includes('despite')) isException=true;
  if(desc.includes('mortal wound')) type='mortal-wounds';
  else if(desc.includes('re-roll')||desc.includes('reroll')) type='reroll';
  else if(desc.includes('+1 to hit')||desc.includes('+1 to wound')||desc.includes('+1 to save')) type='modifier';
  else if(desc.includes('additional attack')||desc.includes('extra attack')) type='extra-attacks';
  else if(desc.includes('aura')||desc.includes('within ')) type='aura';
  else if(isException) type='exception';

  // Extract duration — human label + canonical machine code used by the
  // battle-screen effect engine to expire effects at the right moment.
  let duration='while active';
  let durationCode='while_active';
  if(desc.includes('until the end of the phase')||desc.includes('until end of phase')||desc.includes('this phase')){duration='Until end of phase';durationCode='end_of_phase';}
  else if(desc.includes('until the end of the turn')||desc.includes('until end of turn')||desc.includes('this turn')){duration='Until end of turn';durationCode='end_of_turn';}
  else if(desc.includes('until the start of your next')||desc.includes('until end of your next')||desc.includes('until your next')){duration='Until start of your next turn';durationCode='start_of_next_turn';}
  else if(desc.includes('until the end of the battle round')||desc.includes('this battle round')){duration='Until end of battle round';durationCode='end_of_round';}
  else if(desc.includes('for the rest of the battle')){duration='Remainder of battle';durationCode='battle';}
  else if(desc.includes('once per battle')){duration='Once per battle';durationCode='end_of_phase';}
  else if(desc.includes('once per turn')){duration='Once per turn';durationCode='end_of_turn';}

  // Extract trigger
  let trigger='Active';
  if(desc.includes('when this unit')) trigger='When this unit acts';
  if(desc.includes('each time this model')) trigger='Each time this model attacks';
  if(desc.includes('while this model leads')) trigger='While leading an attached unit';
  if(desc.includes('at the start of your')) trigger='Start of your turn';
  if(desc.includes('in the fight phase')) trigger='Fight Phase';
  if(desc.includes('charged this turn')) trigger='Unit charged this turn';

  // Detect leader-only abilities
  const leaderOnly=desc.includes('while this model leads')||desc.includes('while leading')||desc.includes('leading this unit');

  return {
    name:ability.name||'Unknown Ability',
    rawText:raw,
    phase,
    type:isException?'exception':type,
    duration,
    durationCode,
    modifiers:parseModifiersFromText(ability.description||ability.rule||ability.effect||''),
    trigger,
    leaderOnly,
    isException,
  };
}

// ── WEAPON PROFILE ANALYSER ──────────────────────────────────────────────────

function analyseWeapon(weapon){
  if(!weapon) return null;
  const kws=(weapon.abilities||weapon.keywords||'').toLowerCase().split(/[,;]/).map(s=>s.trim()).filter(Boolean);
  const activeKeywords=[];

  // Match keywords to WK entries
  for(const kw of kws){
    if(kw.startsWith('rapid fire')) activeKeywords.push({...WK.RAPID_FIRE, rawKw:kw});
    else if(kw==='torrent') activeKeywords.push({...WK.TORRENT, rawKw:kw});
    else if(kw==='blast') activeKeywords.push({...WK.BLAST, rawKw:kw});
    else if(kw==='lethal hits') activeKeywords.push({...WK.LETHAL_HITS, rawKw:kw});
    else if(kw==='twin-linked') activeKeywords.push({...WK.TWIN_LINKED, rawKw:kw});
    else if(kw.startsWith('sustained hits')) activeKeywords.push({...WK.SUSTAINED_HITS, rawKw:kw});
    else if(kw==='devastating wounds') activeKeywords.push({...WK.DEVASTATING_WOUNDS, rawKw:kw});
    else if(kw==='hazardous') activeKeywords.push({...WK.HAZARDOUS, rawKw:kw});
    else if(kw==='precision') activeKeywords.push({...WK.PRECISION, rawKw:kw});
    else if(kw==='indirect fire') activeKeywords.push({...WK.INDIRECT_FIRE, rawKw:kw});
    else if(kw==='ignores cover') activeKeywords.push({...WK.IGNORES_COVER, rawKw:kw});
    else if(kw.startsWith('melta')) activeKeywords.push({...WK.MELTA, rawKw:kw});
    else if(kw==='lance') activeKeywords.push({...WK.LANCE, rawKw:kw});
    else if(kw.startsWith('anti-')) activeKeywords.push({...WK.ANTI, rawKw:kw, label:`Anti-${kw.replace('anti-','').replace(/^\w/,c=>c.toUpperCase())}`});
    else if(kw==='heavy') activeKeywords.push({...WK.HEAVY, rawKw:kw});
    else if(kw==='assault') activeKeywords.push({...WK.ASSAULT, rawKw:kw});
    else if(kw==='pistol') activeKeywords.push({...WK.PISTOL, rawKw:kw});
    else if(kw==='extra attacks') activeKeywords.push({...WK.EXTRA_ATTACKS, rawKw:kw});
  }

  // Wound table entry
  const str=parseInt(weapon.strength)||0;
  const getWoundTarget=(toughness)=>{
    if(!toughness) return '4+';
    const t=parseInt(toughness);
    if(str>=t*2) return '2+';
    if(str>t) return '3+';
    if(str===t) return '4+';
    if(str<t&&str>t/2) return '5+';
    return '6+';
  };

  // Determine if hazardous reminder needed
  const isHazardous=activeKeywords.some(k=>k.label==='Hazardous');
  const isTorrent=activeKeywords.some(k=>k.label==='Torrent');
  const hasBlast=activeKeywords.some(k=>k.label==='Blast');

  return {weapon, activeKeywords, getWoundTarget, isHazardous, isTorrent, hasBlast};
}

// ── WEAPON CARRIER RESOLVER ─────────────────────────────────────────────────
// Works out how many models in an army entry actually carry each weapon:
// datasheet default loadout first, then the wargear swaps saved in the
// Armoury (entry.wargear). Returns {counts:{weaponName:n}, hasSelections}.
// Data text is messy, so unknown weapons stay selectable — this guides
// legality rather than hard-blocking play.
function getWeaponCarriers(entry){
  const u=entry?.unit;
  if(!u) return {counts:{},hasSelections:false};
  const n=modelCount(u,entry.sizeIdx||0);
  const weapons=u.weapons||[];
  const norm=s=>String(s||'').toLowerCase().replace(/["'’]/g,'').replace(/[^a-z0-9 \-]/g,' ').replace(/\s+/g,' ').trim();
  const loadout=norm(clean(u.loadout||''));
  const counts={};
  weapons.forEach(w=>{
    const wn=norm(w.name);
    if(!loadout){ counts[w.name]=n; return; }               // no loadout text — assume all carry it
    counts[w.name]=loadout.includes(wn)?n:0;                 // in default loadout → all models, else option-only
  });
  const groups=parseWargearOptions(u.options||[]);
  const sel=entry.wargear;
  const findWeapon=txt=>{
    const t=norm(txt);
    if(!t) return null;
    return weapons.find(w=>{const wn=norm(w.name);return t.includes(wn)||wn.includes(t);})?.name||null;
  };
  if(sel){
    groups.forEach((g,gi)=>{
      if(g.fixed) return;
      const gSel=sel[gi];
      if(gSel==null) return;
      const applySwap=(choiceIdx,times)=>{
        if(choiceIdx==null||times<=0) return;
        const choiceTxt=g.choices[choiceIdx]||'';
        if(/\(default\)$/i.test(choiceTxt)) return;
        const gained=findWeapon(choiceTxt);
        const lost=g.replaced?findWeapon(g.replaced):null;
        if(lost) counts[lost]=Math.max(0,(counts[lost]||0)-times);
        if(gained) counts[gained]=(counts[gained]||0)+times;
      };
      if(g.scope==='single'){
        applySwap(gSel,1);
      } else if(typeof gSel==='object'){
        const perChoice={};
        Object.values(gSel).forEach(ci=>{ if(ci!==0) perChoice[ci]=(perChoice[ci]||0)+1; });
        Object.entries(perChoice).forEach(([ci,times])=>applySwap(parseInt(ci),times));
      }
    });
  }
  return {counts,hasSelections:!!sel};
}

// Strip HTML tags for display (unit names sometimes contain <span> markup)
function stripHTML(str){
  if(!str) return '';
  return String(str).replace(/<[^>]*>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').trim();
}

// Distinguishing label for a roster entry — an army can easily have 2-3
// copies of the same datasheet (three Boyz units, etc.), which are
// otherwise indistinguishable in the Armoury and on the battlefield. A saved
// nickname always wins; otherwise auto-number by this entry's position
// among same-name entries in the SAME army (stable order, so it doesn't
// reshuffle as other units are added/removed).
function entryDisplayName(entry,siblingEntries){
  const name=stripHTML(entry?.unit?.name||'');
  if(entry?.nickname) return entry.nickname;
  const sameName=(siblingEntries||[]).filter(e=>stripHTML(e.unit?.name)===name);
  if(sameName.length<=1) return name;
  const idx=sameName.findIndex(e=>e.id===entry.id)+1;
  return `${name} #${idx}`;
}

// ── LEADER ABILITY ENGINE ───────────────────────────────────────────────────
// Given an army entry, returns leader bonuses that apply to it.
// A "leader bonus" is an ability on the attached leader that modifies stats.
function getLeaderBonuses(entry, allEntries){
  const bonuses = [];
  if(!entry) return bonuses;

  // Find the leader attached to this unit (if entry is a bodyguard)
  let leaderEntry = null;
  if(entry.attachedLeader){
    leaderEntry = allEntries.find(e=>e.id===entry.attachedLeader);
  }
  // Also check if THIS unit is a leader that's attached to a bodyguard
  // (the leader itself also benefits from its own "while leading" abilities)
  if(!leaderEntry && entry.attachedTo){
    // This unit IS a leader attached to a bodyguard
    leaderEntry = entry;
  }

  const source = leaderEntry || (entry.attachedLeader ? null : entry);
  if(!source) return bonuses;

  const abilities = source.unit?.abilities||[];
  for(const ab of abilities){
    const name = (ab.name||'').toLowerCase();
    const desc = (ab.description||ab.desc||'').toLowerCase();

    // Skip "Leader" ability — it's a rule not an active bonus
    if(name==='leader') continue;

    // Only "while leading" / "while this model leads" abilities
    const isLeaderAbility = desc.includes('while this model leads')||desc.includes('while leading')||
      desc.includes('leading this unit')||desc.includes('while it leads')||
      desc.includes('units they lead');
    if(!isLeaderAbility && leaderEntry!==entry) continue;

    // Parse stat modifiers from description text (shared parser)
    const modifiers = parseModifiersFromText(ab.description||ab.desc||'');

    if(modifiers.length>0 || isLeaderAbility){
      bonuses.push({
        abilityName: ab.name,
        source: source.unit?.name,
        description: ab.description||ab.desc||'',
        modifiers,
        isLeaderAbility,
      });
    }
  }
  return bonuses;
}

// Apply a flat list of modifiers to a weapon's effective stats for display.
// Respects modifier scope ('melee'/'ranged'/'all') against the weapon's type.
function applyModifiersToWeapon(weapon, mods){
  if(!weapon||!mods?.length) return weapon;
  const wType=(weapon.type||'').toLowerCase()==='melee'?'melee':'ranged';
  let w={...weapon};
  for(const mod of mods){
    if(mod.scope&&mod.scope!=='all'&&mod.scope!==wType) continue;
    if(mod.stat==='attacks') w={...w,attacks:String((parseInt(w.attacks)||0)+mod.delta)};
    if(mod.stat==='strength') w={...w,strength:String((parseInt(w.strength)||0)+mod.delta)};
    if(mod.stat==='damage') w={...w,damage:String((parseInt(w.damage)||0)+mod.delta)};
    if(mod.stat==='ap') w={...w,ap:String((parseInt(w.ap)||0)+mod.delta)};
  }
  return w;
}
// Back-compat wrapper for leader bonuses
function applyLeaderBonusesToWeapon(weapon, bonuses){
  return applyModifiersToWeapon(weapon, (bonuses||[]).flatMap(b=>b.modifiers||[]));
}


// ── UNIFIED COMBAT ROLLER ─────────────────────────────────────────────────────
// Used for both shooting and melee. mode='shoot'|'melee'
// Supports leader ability modifiers, manual stat overrides, and step-by-step roll entry.

  'TORRENT': 'Automatically hits — no hit roll required. Go straight to wound rolls.',

  'DEVASTATING WOUNDS': 'A Critical Wound (unmodified 6 to wound) causes a number of Mortal Wounds equal to Damage instead of normal damage.',
  'LETHAL HITS': 'A Critical Hit (unmodified 6 to hit) automatically wounds — skip the wound roll.',
  'SUSTAINED HITS': 'A Critical Hit scores extra hits equal to the value shown (e.g. Sustained Hits 1 = 1 extra hit on a 6).',
  'LANCE': 'Add 1 to the Armour Penetration characteristic while the bearer is in the Charge Phase.',

function WeaponKeywordTag({kw}){
  const [open,setOpen]=React.useState(false);
  const key=kw.trim().toUpperCase().replace(/\s+X$/,'').replace(/\s+\d+$/,'');
  // Check partial matches for multi-word keywords
  const explanation=WEAPON_KW_EXPLANATIONS[key]||Object.entries(WEAPON_KW_EXPLANATIONS).find(([k])=>key.startsWith(k))?.[1];
  return(
    <span>
      <span onClick={()=>explanation&&setOpen(o=>!o)}
        style={{fontSize:8,padding:'1px 5px',background:'var(--bg2)',border:`1px solid ${explanation?'var(--goldborder)':'var(--border)'}`,
          color:explanation?'var(--brass)':'var(--text3)',letterSpacing:.5,textTransform:'uppercase',
          cursor:explanation?'pointer':'default',transition:'all .1s',display:'inline-block',marginRight:3,marginBottom:3}}>
        {kw}{explanation?<span style={{fontSize:7,marginLeft:2,color:'var(--gold)'}}>?</span>:null}
      </span>
      {open&&(
        <div style={{background:'var(--bg0)',border:'1px solid var(--goldborder)',padding:'8px 10px',marginTop:4,marginBottom:4,fontSize:10,color:'var(--text2)',lineHeight:1.6,position:'relative'}}>
          <strong style={{color:'var(--gold)',fontFamily:"'Cinzel',serif",display:'block',marginBottom:4}}>{kw.toUpperCase()}</strong>
          {explanation}
          <button onClick={()=>setOpen(false)} style={{position:'absolute',top:4,right:6,background:'none',border:'none',color:'var(--text3)',cursor:'pointer',fontSize:12}}>✕</button>

}


function CombatRoller({mode, entry, army, enemyArmy, wounds:battleWounds, destroyed,
  applyWounds, setDestroyed, setEngaged, chargedUnits, onClose, onLog, triggerReaction,
  activeEffects, attackerPlayer, commander, counselContext}){

  const unit = entry.unit;
  const allEntries = army?.units||[];

  // Which models actually carry each weapon (default loadout + Armoury wargear picks)
  const carrierInfo = React.useMemo(()=>getWeaponCarriers(entry),[entry.id,entry.wargear,entry.sizeIdx]);

  // Leader bonuses
  const leaderBonuses = React.useMemo(()=>getLeaderBonuses(entry, allEntries),[entry.id]);

  // Active battle effects that apply to this unit: unit-scoped effects on this
  // entry, plus army-wide effects (unitId=null) owned by the attacking player.
  const unitEffects = React.useMemo(()=>(activeEffects||[]).filter(f=>
    f.unitId===entry.id || (!f.unitId && (f.player==null || f.player===attackerPlayer))
  ),[activeEffects,entry.id,attackerPlayer]);
  // Flattened effect modifiers, tagged with their source + Oath-style target restriction
  const fxMods = React.useMemo(()=>unitEffects.flatMap(f=>
    (f.modifiers||[]).map(m=>({...m,_src:f.name,_targetUnitId:f.targetUnitId||null}))
  ),[unitEffects]);
  const modeScopeOK = m=>!m.scope||m.scope==='all'||(m.scope==='melee'&&mode==='melee')||(m.scope==='ranged'&&mode!=='melee');

  const hitMod   = leaderBonuses.reduce((s,b)=>s+(b.modifiers.filter(m=>m.stat==='hit'&&modeScopeOK(m)).reduce((x,m)=>x+m.delta,0)),0);
  const woundMod = leaderBonuses.reduce((s,b)=>s+(b.modifiers.filter(m=>m.stat==='wound'&&modeScopeOK(m)).reduce((x,m)=>x+m.delta,0)),0);

  // Weapons — shoot can fire ALL ranged; melee picks one at a time
  const allWeapons = unit.weapons||[];
  const weapons = mode==='melee'
    ? allWeapons.filter(w=>(w.type||'').toLowerCase()==='melee')
    : allWeapons.filter(w=>['ranged','ranged weapon'].includes((w.type||'').toLowerCase()));

  // For shooting: track which weapons have been fired
  const [firedWeapons, setFiredWeapons] = React.useState(new Set());
  const [selWeaponName, setSelWeaponName] = React.useState(weapons[0]?.name||'');
  const weapon = weapons.find(w=>w.name===selWeaponName)||weapons[0];
  // Weapon stats after leader bonuses AND active battle effects (e.g. Waaagh! +1A melee)
  const effectiveWeapon = weapon ? applyModifiersToWeapon(weapon, [
    ...leaderBonuses.flatMap(b=>b.modifiers||[]),
    ...fxMods.filter(m=>!m.targeted), // targeted mods (Oath etc.) never change weapon stats
  ]) : null;

  // Keyword-driven auto-modifiers — e.g. Rapid Fire / Melta / Heavy / Lance
  // ask a single yes/no question about the current battlefield situation and
  // fold the answer straight into the roll, instead of leaving it as a tag
  // the player has to remember to account for by hand.
  const [kwAnswers, setKwAnswers] = React.useState({}); // {"weapon::keyword": true/false}
  function kwAnswerKey(kw){ return `${selWeaponName}::${kw}`; }

  // Manual modifiers
  const [manualHitMod,  setManualHitMod]  = React.useState(0);
  const [manualDmgMod,  setManualDmgMod]  = React.useState(0);
  const [manualAtkMod,  setManualAtkMod]  = React.useState(0);
  const [manualStrMod,  setManualStrMod]  = React.useState(0);
  const [manualApMod,   setManualApMod]   = React.useState(0);
  const [showMods,      setShowMods]      = React.useState(false);
  // Compact visual pips by default — exact numbers stay hidden until the
  // player explicitly asks the Commander, so threat is read at a glance
  // instead of parsed digit-by-digit on every single attack.
  const [showFullStats, setShowFullStats] = React.useState(false);

  // Roll inputs — per wound-roll entry with model assignment
  const [numAtk,     setNumAtk]     = React.useState('');
  const [hits,       setHits]       = React.useState('');
  // Wound rolls and the opponent's saves are tracked as their own explicit
  // steps (counts), rather than folding "did it get through" straight into
  // the per-model assignment click — matching the actual sequence of a real
  // attack: hit, wound, THEN the opponent saves, THEN damage is assigned.
  const [woundSuccesses, setWoundSuccesses] = React.useState('');
  const [failedSaves,    setFailedSaves]    = React.useState('');
  const [woundRolls, setWoundRolls] = React.useState([]); // [{modelIdx, damage}]
  const [resolved,   setResolved]   = React.useState(false);

  // Target
  const [targetId, setTargetId] = React.useState('');
  const [targetToughness, setTargetToughness] = React.useState('');
  const [targetSave, setTargetSave] = React.useState('');
  const [targetInv, setTargetInv] = React.useState('');

  // Enemies
  const chargedInfo     = chargedUnits?.[entry.id];
  const chargedTargetId = mode==='melee' ? (chargedInfo?.targetId||null) : null;
  const allEnemies = (enemyArmy?.units||[]).filter(e=>!destroyed[e.id]);
  const enemies    = chargedTargetId ? allEnemies.filter(e=>e.id===chargedTargetId) : allEnemies;
  const targetEntry = enemies.find(e=>e.id===targetId);

  // Target defensive special rules, read from the datasheet (abilities + keywords)
  const targetDefense = React.useMemo(()=>{
    if(!targetEntry) return null;
    const tu=targetEntry.unit;
    const abs=tu.abilities||[];
    const abTxt=abs.map(a=>((a.name||'')+' '+stripHTML(a.description||''))).join(' · ').toLowerCase();
    const hasNamed=n=>abs.some(a=>(a.name||'').toLowerCase().trim().startsWith(n));
    const invM=abTxt.match(/(\d)\+\s*invulnerable/);
    const fnpM=abTxt.match(/feel no pain (\d)\+/);
    const demiseM=abTxt.match(/deadly demise\s*(d?\d(?:\+\d)?)/i);
    return {
      inv: parseInt(tu.models?.[0]?.inv)||(invM?parseInt(invM[1]):null),
      fnp: fnpM?parseInt(fnpM[1]):null,
      stealth: hasNamed('stealth'),
      loneOp: hasNamed('lone operative'),
      demise: hasNamed('deadly demise')?(demiseM?demiseM[1]:'?'):null,
    };
  },[targetId]);

  // Auto-fill target stats (armour from the profile; invuln from profile OR ability text)
  React.useEffect(()=>{
    if(!targetEntry){setTargetToughness('');setTargetSave('');setTargetInv('');return;}
    const m=targetEntry.unit.models?.[0];
    if(m){
      setTargetToughness(m.t||'');
      setTargetSave((m.sv||'').replace('+',''));
      setTargetInv(String(parseInt(m.inv)||targetDefense?.inv||'').replace('+',''));
    }
  },[targetId]);

  // Attacker Damaged profile (e.g. "1-4 wounds remaining: -1 to Hit")
  const attackerDamaged = React.useMemo(()=>{
    const dw=unit.damaged_w;
    if(!dw) return null;
    const m=String(dw).match(/(\d+)\s*-\s*(\d+)/);
    if(!m) return null;
    const perW=parseInt(unit.models?.[0]?.w)||1;
    const curW=battleWounds[entry.id]??perW;
    if(curW<parseInt(m[1])||curW>parseInt(m[2])) return null;
    const descTxt=stripHTML(unit.damaged_description||'');
    return { text:descTxt, minusHit:/subtract 1 from (the |each |that )?hit roll/i.test(descTxt) };
  },[entry.id,battleWounds]);

  // Effect modifiers that pass mode scope + (for Oath-style targeted effects) match the chosen target
  const targetedOK = m=>!m.targeted||!m._targetUnitId||m._targetUnitId===targetId;
  const fxHitMod   = fxMods.filter(m=>m.stat==='hit'&&modeScopeOK(m)&&targetedOK(m)).reduce((s,m)=>s+(m.delta||0),0);
  const fxWoundMod = fxMods.filter(m=>m.stat==='wound'&&modeScopeOK(m)&&targetedOK(m)).reduce((s,m)=>s+(m.delta||0),0);
  // Re-roll + granted-keyword hints from active effects (rolls are entered manually)
  const fxHints    = fxMods.filter(m=>['reroll_hit','reroll_wound','kw','advance_and_charge'].includes(m.stat)&&modeScopeOK(m)&&targetedOK(m));

  // Automatic defensive/attacker-state modifiers from the core rules:
  //  Stealth on the target → -1 to Hit for ranged attacks
  //  Attacker on its Damaged profile with "-1 to Hit" wording → -1 to Hit
  const stealthPenalty = (mode!=='melee'&&targetDefense?.stealth)?-1:0;
  const damagedPenalty = attackerDamaged?.minusHit?-1:0;

  // Weapon keywords for the currently-selected weapon, with any that carry
  // a yes/no conditional bonus (Rapid Fire, Melta, Heavy, Lance) resolved
  // into a live modifier the instant the player answers the question.
  const weaponKws = (weapon?.abilities||weapon?.keywords||'').split(/[,;]/).map(s=>s.trim()).filter(Boolean);
  const kwPrompts = weaponKws.map(kw=>{
    const rule=KEYWORD_MOD_PROMPTS.find(r=>r.test(kw));
    return rule?{kw,...rule}:null;
  }).filter(Boolean);
  const kwBonus = kwPrompts.reduce((acc,p)=>{
    if(kwAnswers[kwAnswerKey(p.kw)]!==true) return acc;
    const eff=p.effect(p.match(p.kw));
    return {atk:acc.atk+(eff.atk||0), dmg:acc.dmg+(eff.dmg||0), hit:acc.hit+(eff.hit||0), wound:acc.wound+(eff.wound||0)};
  },{atk:0,dmg:0,hit:0,wound:0});

  // Computed stats.
  // Core rules: net modifiers to a Hit or Wound roll are capped at +1/-1.
  const capMod = v=>Math.max(-1,Math.min(1,v));
  const rawHitMod     = hitMod + manualHitMod + fxHitMod + stealthPenalty + damagedPenalty + kwBonus.hit;
  const totalHitMod   = capMod(rawHitMod);
  const hitModCapped  = rawHitMod!==totalHitMod;
  const rawWoundMod   = woundMod + fxWoundMod + kwBonus.wound;
  const totalWoundMod = capMod(rawWoundMod);
  const baseAtk  = parseInt(effectiveWeapon?.attacks)||0;
  const totalAtk = baseAtk + manualAtkMod + kwBonus.atk;
  const strVal   = (parseInt(effectiveWeapon?.strength)||0) + manualStrMod;
  const baseAp   = parseInt(effectiveWeapon?.ap)||0;
  const totalAp  = baseAp + manualApMod;
  const baseDmg  = parseInt(effectiveWeapon?.damage)||1;
  const totalDmg = baseDmg + manualDmgMod + kwBonus.dmg;

  const wsVal     = mode==='melee' ? (parseInt(unit.models?.[0]?.ws)||4) : (parseInt(unit.models?.[0]?.bs)||4);
  const hitTarget = Math.max(2, wsVal - totalHitMod);

  const tInt = parseInt(targetToughness)||0;
  const rawWoundTarget = tInt ? (strVal>=tInt*2?2:strVal>tInt?3:strVal===tInt?4:strVal*2<=tInt?6:5) : null;
  const effectiveWoundTarget = rawWoundTarget ? Math.min(6, Math.max(2, rawWoundTarget - totalWoundMod)) : null;

  // AP worsens the save: a 3+ save vs AP -2 becomes a 5+. Weapon AP is stored
  // as 0 / -1 / -2 …, so subtracting the (negative) AP raises the save target.
  const saveBase = parseInt(targetSave)||0;
  const invSave  = parseInt(targetInv)||0;
  const modSave  = saveBase ? Math.min(7, saveBase + Math.abs(totalAp)) : null;
  const bestSave = invSave && modSave ? Math.min(invSave, modSave) : (invSave||modSave||null);

  // ── Expected-value maths for the current weapon vs the chosen target ──
  const rollMath = React.useMemo(()=>{
    if(!targetEntry||!effectiveWeapon||!effectiveWoundTarget) return null;
    const kws=(effectiveWeapon.abilities||effectiveWeapon.keywords||'').toLowerCase();
    const carriers=carrierInfo.counts[weapon?.name];
    return attackMath({
      attacks: totalAtk||avgDice(effectiveWeapon.attacks),
      models: carriers>0?carriers:1,
      hitTarget: hitTarget,
      autoHit: /torrent/.test(kws),
      sustainedX: (kws.match(/sustained hits (d?\d)/)||[])[1],
      lethal: /lethal hits/.test(kws),
      devastating: /devastating wounds/.test(kws),
      twinLinked: /twin-linked/.test(kws),
      rerollHit1: fxHints.some(h=>/re-roll hit rolls of 1/i.test(h.label||'')),
      rerollHitAll: fxHints.some(h=>/^re-roll hit rolls( vs.*)?$/i.test(h.label||'')),
      woundTarget: effectiveWoundTarget,
      saveTarget: bestSave,
      fnp: targetDefense?.fnp,
      damage: effectiveWeapon.damage,
      targetWounds: parseInt(targetEntry.unit?.models?.[0]?.w)||1,
      targetModels: (()=>{const c=targetEntry.unit?.unit_composition||[];let t=0;c.forEach(x=>{const m=String(x.description||x.desc||x).match(/^(\d+)/);if(m)t+=parseInt(m[1]);});return t||1;})(),
    });
  },[targetId,selWeaponName,totalAtk,hitTarget,effectiveWoundTarget,bestSave,targetDefense]);

  // ── Commander tactical counsel ──
  const [counsel,setCounsel]=React.useState(null);      // reply text
  const [counselBusy,setCounselBusy]=React.useState(false);
  async function askCounsel(){
    if(counselBusy||!targetEntry||!rollMath) return;
    setCounselBusy(true); setCounsel(null);
    try{
      // Quick expected damage across the other possible targets for comparison
      const alternatives=enemies.filter(e=>e.id!==targetId).slice(0,6).map(e=>{
        const m0=e.unit?.models?.[0]||{};
        const tI=parseInt(m0.t)||4;
        const wT=strVal>=tI*2?2:strVal>tI?3:strVal===tI?4:strVal*2<=tI?6:5;
        const sv=Math.min(7,(parseInt(m0.sv)||7)+Math.abs(totalAp));
        const inv2=parseInt(m0.inv)||null;
        const alt=attackMath({attacks:totalAtk,models:carrierInfo.counts[weapon?.name]||1,hitTarget,
          woundTarget:Math.min(6,Math.max(2,wT)),saveTarget:inv2&&inv2<sv?inv2:(sv>=7?null:sv),
          damage:effectiveWeapon.damage,targetWounds:parseInt(m0.w)||1});
        return `${stripHTML(e.unit.name)}: ~${alt.damage} dmg expected`;
      });
      const ctx=counselContext||{};
      const userMsg=[
        `SITUATION — Round ${ctx.round??'?'} of 5, ${ctx.phaseName||(mode==='melee'?'Fight':'Shooting')} phase.`,
        `Score: you ${ctx.myVP??'?'}VP / enemy ${ctx.enemyVP??'?'}VP · CP: ${ctx.myCP??'?'}.`,
        ctx.missions?`Active missions: ${ctx.missions}.`:'',
        `PROPOSED ATTACK: ${stripHTML(unit.name)} → ${stripHTML(targetEntry.unit.name)} with ${effectiveWeapon.name}.`,
        `MATHS: ${rollMath.attacks} attacks → exp. ${rollMath.hits} hits → ${rollMath.wounds} wounds → ${rollMath.unsaved} unsaved → ~${rollMath.damage} damage (~${rollMath.modelsSlain} models slain). Hit on ${hitTarget}+, wound on ${effectiveWoundTarget}+, save ${bestSave?bestSave+'+':'none'}${targetDefense?.fnp?`, FNP ${targetDefense.fnp}+`:''}.`,
        alternatives.length?`OTHER TARGETS THIS UNIT COULD ATTACK: ${alternatives.join(' · ')}.`:'',
        `Question: is this the right target, and why — per your philosophy and the mission?`,
      ].filter(Boolean).join('\n');
      const sys=buildCounselSystemPrompt(commander?.key,commander);
      const reply=await callGemini(sys,[{role:'user',parts:[{text:userMsg}]}],220,0.7);
      setCounsel(reply||'…the vox link crackles with silence.');
    }catch(e){
      setCounsel(`Vox link failed: ${String(e.message||e).slice(0,120)}`);
    }finally{
      setCounselBusy(false);
    }
  }

  // Build per-model wound distribution
  // Get target unit models (actual count from composition)
  function getTargetModelCount(entry){
    const u = entry.unit;
    const comp = u.unit_composition||[];
    if(comp.length){
      let tot=0;
      comp.forEach(c=>{const d=c.description||c.desc||String(c);const m=d.match(/^(\d+)/);if(m)tot+=parseInt(m[1]);});
      if(tot>0) return tot;
    }
    return parseInt(u.models?.length)||1;
  }
  const targetModelCount = targetEntry ? getTargetModelCount(targetEntry) : 1;
  const targetModelW     = parseInt(targetEntry?.unit?.models?.[0]?.w)||1;

  // Current wounds per model in target (using battleWounds for unit total, distributed as needed)
  // We track wound assignment locally during the roll
  const [modelWounds, setModelWounds] = React.useState(null); // null = not yet initialised

  // Initialise model wounds when target is selected
  React.useEffect(()=>{
    if(!targetEntry){ setModelWounds(null); return; }
    const unitTotalW = battleWounds[targetEntry.id]??( targetModelCount*targetModelW );
    // Distribute existing damage: fill models from index 0
    const mw = Array(targetModelCount).fill(targetModelW);
    let dmgRemaining = targetModelCount*targetModelW - unitTotalW;
    for(let i=0;i<targetModelCount&&dmgRemaining>0;i++){
      const take = Math.min(mw[i], dmgRemaining);
      mw[i] -= take;
      dmgRemaining -= take;
    }
    setModelWounds(mw);
    setWoundRolls([]);
    setWoundSuccesses(''); setFailedSaves('');
  },[targetId]);

  // Add a wound result (successful wound roll = damage totalDmg to a model)
  function addWound(modelIdx){
    if(modelWounds===null) return;
    // Can't assign more damage than the opponent actually failed saves for
    if(woundRolls.length>=(parseInt(failedSaves)||0)) return;
    const newMW = [...modelWounds];
    let dmgLeft = totalDmg;
    let idx = modelIdx;
    // Damage is applied to the chosen model; excess is NOT carried over to next model (per rules)
    if(newMW[idx]>0){
      const take = Math.min(newMW[idx], dmgLeft);
      newMW[idx] -= take;
    }
    setModelWounds(newMW);
    setWoundRolls(r=>[...r,{modelIdx, damage:totalDmg, killed:newMW[modelIdx]<=0}]);
  }

  function removeLastWound(){
    if(!woundRolls.length) return;
    const last = woundRolls[woundRolls.length-1];
    const newMW = [...(modelWounds||[])];
    // Restore damage
    newMW[last.modelIdx] = Math.min(targetModelW, newMW[last.modelIdx]+last.damage);
    setModelWounds(newMW);
    setWoundRolls(r=>r.slice(0,-1));
  }

  const totalWoundResults = woundRolls.length;
  const killedModels = woundRolls.filter(w=>w.killed).length;
  const modelsAliveAfter = targetModelCount - (modelWounds||[]).filter(mw=>mw<=0).length;
  const unitDestroyedAfter = modelsAliveAfter<=0;

  const isShoot = mode==='shoot';
  const accentColor = isShoot ? 'var(--gold)' : '#c96';
  const allWeaponsFired = isShoot && weapons.length > 0 && weapons.every(w=>firedWeapons.has(w.name));

  // Dismissing via the backdrop or ✕ before anything was actually resolved
  // (e.g. an accidental tap right after opening) must not count as a
  // completed action — tell the parent so it can restore the unit to
  // "not yet acted" rather than leaving it permanently stuck.
  function handleDismiss(){
    onClose(!(resolved||allWeaponsFired));
  }

  function resolveAndClose(){
    if(!targetEntry || !modelWounds) return;
    // Compute new unit total wounds
    const newTotal = (modelWounds||[]).reduce((s,w)=>s+w, 0);
    const prev = battleWounds[targetEntry.id]??(targetModelCount*targetModelW);
    applyWounds(w=>({...w,[targetEntry.id]:newTotal}));
    if(unitDestroyedAfter){
      setDestroyed(d=>({...d,[targetEntry.id]:true}));
      if(setEngaged) setEngaged(g=>({...g,[targetEntry.id]:false,[entry.id]:false}));
    }
    onLog(unit.name,`${isShoot?'SHOT':'MELEE'} → ${stripHTML(targetEntry.unit.name)}`,
      `${totalWoundResults} wound${totalWoundResults!==1?'s':''}${killedModels?`, ${killedModels} model(s) slain`:''}${unitDestroyedAfter&&targetDefense?.demise?` · DEADLY DEMISE ${targetDefense.demise}: roll a D6 — on a 6, each unit within 6″ suffers mortal wounds`:''}`,
      0, ()=>{
        applyWounds(w=>({...w,[targetEntry.id]:prev}));
        if(unitDestroyedAfter) setDestroyed(d=>({...d,[targetEntry.id]:false}));
      });
    if(unitDestroyedAfter&&triggerReaction) triggerReaction('unit_destroyed',stripHTML(targetEntry.unit.name));
  }

  function handleApply(){
    playSFX(weaponSfxKey(effectiveWeapon));
    resolveAndClose();
    setResolved(true);
    if(triggerReaction) triggerReaction(isShoot?'shooting_resolved':'melee_resolved', stripHTML(unit.name));
    if(isShoot){
      // Mark this weapon as fired
      setFiredWeapons(s=>new Set([...s, weapon.name]));
      setWoundRolls([]);
      setNumAtk(''); setHits(''); setWoundSuccesses(''); setFailedSaves('');
      // If all weapons fired, close; else stay open for next weapon
      const remaining = weapons.filter(w=>!firedWeapons.has(w.name)&&w.name!==weapon.name);
      if(remaining.length===0){ setTimeout(()=>onClose(),350); }
      else{ setSelWeaponName(remaining[0].name); setResolved(false); }
    }
  }

  return(
    <div className="modal-overlay" onClick={handleDismiss}>
      <div className="modal anim-slide-up" style={{maxWidth:460,maxHeight:'92vh',display:'flex',flexDirection:'column',borderTop:`3px solid ${accentColor}`}}
        onClick={e=>e.stopPropagation()}>

        {/* Header */}
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'10px 14px 8px',borderBottom:'1px solid var(--border)',flexShrink:0}}>
          <div>
            <div style={{fontFamily:"'Cinzel',serif",fontSize:12,color:accentColor,letterSpacing:1}}>
              {isShoot?'🎯 Shooting':'⚔ Fight'} — {stripHTML(unit.name)}
            </div>
            {isShoot&&weapons.length>1&&(
              <div style={{fontSize:9,color:'var(--text3)',marginTop:2}}>
                {firedWeapons.size}/{weapons.length} weapons fired
              </div>
            )}
            {leaderBonuses.length>0&&(
              <div style={{fontSize:9,color:'#c96',marginTop:2}}>
                ⊕ {leaderBonuses.map(b=>b.source).filter((v,i,a)=>a.indexOf(v)===i).join(', ')} bonuses active
              </div>
            )}
            {unitEffects.length>0&&(
              <div style={{fontSize:9,color:'var(--gold)',marginTop:2}}>
                ✦ {unitEffects.map(f=>f.name).filter((v,i,a)=>a.indexOf(v)===i).join(', ')} in effect
              </div>
            )}
          </div>
          <button className="btn btn-ghost btn-xs" onClick={handleDismiss}>✕</button>
        </div>

        <div style={{flex:1,overflowY:'auto',padding:'10px 14px'}}>

          {/* Active battle-effect callout (abilities, army rules, stratagems) */}
          {unitEffects.filter(f=>(f.modifiers||[]).length>0).map((f,i)=>(
            <div key={'fx'+i} style={{background:'rgba(200,168,75,.08)',border:'1px solid var(--goldborder)',borderLeft:'3px solid var(--gold)',padding:'6px 10px',marginBottom:8}}>
              <div style={{fontFamily:"'Cinzel',serif",fontSize:9,color:'var(--gold)',marginBottom:2}}>
                {f.name}{f.unitId?'':' (army-wide)'} · {expiryLabel(f.expires)}
              </div>
              <div style={{display:'flex',gap:4,flexWrap:'wrap'}}>
                {(f.modifiers||[]).filter(modeScopeOK).map((m,j)=>(
                  <span key={j} style={{fontSize:8,padding:'1px 5px',background:'rgba(200,168,75,.15)',border:'1px solid var(--goldborder)',color:'var(--gold)'}}>
                    {m.label}{m.targeted&&f.targetUnitId?' (vs marked target only)':''}
                  </span>
                ))}
              </div>
            </div>
          ))}

          {/* Leader ability callout */}
          {leaderBonuses.filter(b=>b.modifiers.length>0).map((b,i)=>(
            <div key={i} style={{background:'rgba(200,150,60,.08)',border:'1px solid rgba(200,150,60,.35)',borderLeft:'3px solid #c96',padding:'6px 10px',marginBottom:8}}>
              <div style={{fontFamily:"'Cinzel',serif",fontSize:9,color:'#c96',marginBottom:2}}>{b.abilityName}</div>
              <div style={{display:'flex',gap:4,flexWrap:'wrap'}}>
                {b.modifiers.map((m,j)=>(
                  <span key={j} style={{fontSize:8,padding:'1px 5px',background:'rgba(200,150,60,.15)',border:'1px solid rgba(200,150,60,.4)',color:'#dda060'}}>
                    {m.label}
                  </span>
                ))}
              </div>
            </div>
          ))}

          {/* Weapon selector (shoot: all weapons shown; melee: only melee) */}
          {weapons.length>1&&(
            <div style={{marginBottom:10}}>
              <div style={{fontSize:9,letterSpacing:2,color:'var(--brass)',fontFamily:"'Cinzel',serif",marginBottom:5,textTransform:'uppercase'}}>
                {isShoot?'Weapons (fire each in sequence)':'Select Weapon'}
              </div>
              {weapons.map(w=>{
                const fired = firedWeapons.has(w.name);
                const sel = selWeaponName===w.name;
                const carriers = carrierInfo.counts[w.name];
                const notInLoadout = carriers===0;
                return(
                  <div key={w.name} onClick={()=>!fired&&setSelWeaponName(w.name)}
                    style={{padding:'7px 10px',marginBottom:3,cursor:fired?'default':'pointer',
                      background:fired?'var(--bg0)':sel?'var(--golddim)':'var(--bg1)',
                      border:`1px solid ${fired?'var(--border)':sel?accentColor:'var(--border)'}`,
                      borderLeft:`3px solid ${fired?'var(--greenBright)':sel?accentColor:'transparent'}`,
                      opacity:fired?0.55:notInLoadout?0.5:1,transition:'all .15s'}}>
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                      <div style={{fontFamily:"'Cinzel',serif",fontSize:11,color:fired?'var(--greenBright)':sel?accentColor:'var(--text)'}}>
                        {w.name}{fired?' ✓ Fired':''}
                        {carriers>0&&<span style={{fontSize:8,color:'var(--brass)',marginLeft:6,border:'1px solid var(--goldborder)',padding:'0 4px'}}>×{carriers}</span>}
                        {notInLoadout&&<span style={{fontSize:8,color:'var(--text3)',marginLeft:6,border:'1px solid var(--border)',padding:'0 4px'}}>not in loadout</span>}
                      </div>
                      <div style={{fontSize:9,color:'var(--text3)'}}>A:{w.attacks} S:{w.strength} AP:{w.ap} D:{w.damage}</div>
                    </div>
                  </div>
                );
              })}
            </div>
          )}

          {/* Weapon stat block */}
          {effectiveWeapon&&(
            <div style={{background:'var(--bg1)',border:`1px solid ${accentColor}40`,padding:'10px 12px',marginBottom:8}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
                <div style={{fontFamily:"'Cinzel',serif",fontSize:12,color:accentColor}}>{effectiveWeapon.name}</div>
                <div style={{display:'flex',gap:4}}>
                  <button className="btn btn-xs btn-ghost" onClick={()=>setShowFullStats(v=>!v)} style={{fontSize:9}}>
                    {showFullStats?'▲ Hide Numbers':'🎖 Ask the Commander'}
                  </button>
                  <button className="btn btn-xs btn-ghost" onClick={()=>setShowMods(v=>!v)} style={{fontSize:9}}>
                    {showMods?'▲ Hide':'± Modifiers'}
                  </button>
                </div>
              </div>
              {/* Compact visual read by default; exact numbers only once the
                  player asks the Commander for the full breakdown. */}
              {!showFullStats?(
                <WeaponPipSummary
                  attacksAvg={avgDice(effectiveWeapon.attacks)+manualAtkMod}
                  hitTarget={hitTarget}
                  strength={strVal}
                  ap={totalAp}
                  damageAvg={avgDice(effectiveWeapon.damage)+manualDmgMod}
                  color={accentColor}/>
              ):(
                <div style={{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:3,textAlign:'center',marginBottom:6}}>
                  {[
                    {label:'ATK', val:totalAtk!==baseAtk?`${totalAtk}*`:String(effectiveWeapon.attacks), mod:totalAtk!==baseAtk},
                    {label:mode==='melee'?'WS':'BS', val:`${hitTarget}+`, mod:totalHitMod!==0},
                    {label:'STR', val:manualStrMod!==0?`${strVal}*`:String(strVal), mod:manualStrMod!==0},
                    {label:'AP',  val:totalAp, mod:manualApMod!==0},
                    {label:'DMG', val:totalDmg!==baseDmg?`${totalDmg}*`:String(effectiveWeapon.damage), mod:totalDmg!==baseDmg},
                  ].map(s=>(
                    <div key={s.label} style={{background:'var(--bg2)',padding:'4px 2px',border:`1px solid ${s.mod?accentColor:'var(--border)'}`,position:'relative'}}>
                      <div style={{fontSize:7,color:'var(--text3)',letterSpacing:.5,marginBottom:1}}>{s.label}</div>
                      <div style={{fontSize:13,fontWeight:700,color:s.mod?accentColor:'var(--text)',fontFamily:"'Cinzel',serif"}}>{s.val}</div>
                      {s.mod&&<div style={{fontSize:6,color:accentColor,position:'absolute',top:1,right:2}}>✦</div>}
                    </div>
                  ))}
                </div>
              )}
              {/* Weapon keywords — tap for explanation */}
              {weaponKws.length>0&&(
                <div style={{display:'flex',flexWrap:'wrap',marginTop:4}}>
                  {weaponKws.map((kw,i)=>(
                    <WeaponKeywordTag key={i} kw={kw}/>
                  ))}
                </div>
              )}
              {/* Conditional keyword prompts — answer once, modifier applies automatically */}
              {kwPrompts.length>0&&(
                <div style={{marginTop:6,display:'flex',flexDirection:'column',gap:4}}>
                  {kwPrompts.map((p,i)=>{
                    const ansKey=kwAnswerKey(p.kw);
                    const ans=kwAnswers[ansKey];
                    return(
                      <div key={i} style={{display:'flex',alignItems:'center',gap:6,background:'var(--bg2)',border:`1px solid ${ans!=null?accentColor:'var(--border)'}`,padding:'4px 7px'}}>
                        <div style={{flex:1,minWidth:0}}>
                          <div style={{fontSize:8,color:'var(--brass)',letterSpacing:.5,textTransform:'uppercase'}}>{p.kw}</div>
                          <div style={{fontSize:9,color:'var(--text2)'}}>{p.question}</div>
                        </div>
                        <button onClick={()=>setKwAnswers(a=>({...a,[ansKey]:true}))}
                          style={{fontSize:9,padding:'3px 8px',cursor:'pointer',background:ans===true?accentColor:'var(--bg1)',border:`1px solid ${accentColor}`,color:ans===true?'var(--bg0)':accentColor,fontWeight:ans===true?700:400}}>Yes</button>
                        <button onClick={()=>setKwAnswers(a=>({...a,[ansKey]:false}))}
                          style={{fontSize:9,padding:'3px 8px',cursor:'pointer',background:ans===false?'var(--border)':'var(--bg1)',border:'1px solid var(--border)',color:ans===false?'var(--text)':'var(--text3)',fontWeight:ans===false?700:400}}>No</button>
                      </div>
                    );
                  })}
                </div>
              )}
              {/* Modifier panel */}
              {showMods&&(
                <div style={{marginTop:8,display:'grid',gridTemplateColumns:'1fr 1fr',gap:5}}>
                  {[
                    {label:'Atk Mod',  val:manualAtkMod,  set:setManualAtkMod,  note:'bonus attacks'},
                    {label:'Hit Mod',  val:manualHitMod,  set:setManualHitMod,  note:'+1/-1 to hit'},
                    {label:'Str Mod',  val:manualStrMod,  set:setManualStrMod,  note:'changes wound roll'},
                    {label:'AP Mod',   val:manualApMod,   set:setManualApMod,   note:'cover / strat'},
                    {label:'Dmg Mod',  val:manualDmgMod,  set:setManualDmgMod,  note:'+1 dmg ability'},
                  ].map(m=>(
                    <div key={m.label} style={{background:'var(--bg2)',padding:'5px 7px',border:'1px solid var(--border)'}}>
                      <div style={{fontSize:8,color:'var(--text3)',marginBottom:3}}>{m.label} <span style={{opacity:.5}}>{m.note}</span></div>
                      <div style={{display:'flex',alignItems:'center',gap:3}}>
                        <button className="counter-btn" onClick={()=>m.set(v=>v-1)} style={{width:22,height:22}}>−</button>
                        <span style={{flex:1,textAlign:'center',fontSize:13,fontWeight:700,color:m.val!==0?accentColor:'var(--text)'}}>{m.val>0?'+':''}{m.val}</span>
                        <button className="counter-btn" onClick={()=>m.set(v=>v+1)} style={{width:22,height:22}}>+</button>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          {/* Target selector */}
          <div style={{marginBottom:8}}>
            <div style={{fontSize:9,letterSpacing:2,color:'var(--brass)',fontFamily:"'Cinzel',serif",marginBottom:5,textTransform:'uppercase'}}>
              {chargedTargetId?'Charged Target (locked)':'Select Target'}
            </div>
            {enemies.length===0&&<div style={{fontSize:10,color:'var(--text3)',fontStyle:'italic'}}>No valid targets.</div>}
            {enemies.map(e=>(
              <div key={e.id} onClick={()=>setTargetId(e.id)}
                style={{padding:'7px 10px',marginBottom:3,cursor:'pointer',
                  background:targetId===e.id?'var(--reddim)':'var(--bg1)',
                  border:`1px solid ${targetId===e.id?'var(--redBright)':'var(--border)'}`,
                  borderLeft:`3px solid ${targetId===e.id?'var(--redBright)':'transparent'}`,
                  transition:'all .15s'}}>
                <div style={{fontFamily:"'Cinzel',serif",fontSize:11,color:targetId===e.id?'var(--redBright)':'var(--text)'}}>{stripHTML(e.unit?.name)}</div>
                <div style={{fontSize:9,color:'var(--text3)',marginTop:1}}>
                  {(()=>{const pw=parseInt(e.unit?.models?.[0]?.w)||1;const c=e.unit?.unit_composition||[];let n=0;c.forEach(x=>{const m=String(x.description||x.desc||x).match(/^(\d+)/);if(m)n+=parseInt(m[1]);});const tot=pw*(n||1);return `${battleWounds[e.id]??tot}/${tot}W`;})()}
                  {e.unit?.models?.[0]?.t&&<span style={{marginLeft:8}}>T{e.unit.models[0].t}</span>}
                  {e.unit?.models?.[0]?.sv&&<span style={{marginLeft:8}}>{e.unit.models[0].sv}</span>}
                </div>
              </div>
            ))}
          </div>

          {/* Roll sequence header */}
          {targetEntry&&effectiveWeapon&&(
            <div style={{border:'1px solid var(--border)',marginBottom:8}}>
              <div style={{padding:'6px 10px',background:'var(--bg2)',borderBottom:'1px solid var(--border)'}}>
                <div style={{fontSize:9,letterSpacing:2,color:'var(--brass)',fontFamily:"'Cinzel',serif",textTransform:'uppercase',marginBottom:2}}>Roll Sequence</div>
                <div style={{fontSize:9,color:'var(--text3)'}}>
                  Hit: {hitTarget}+{totalHitMod?` (${totalHitMod>0?'+':''}${totalHitMod} mod)`:''} ·
                  Wound: {effectiveWoundTarget||'?'}+{totalWoundMod?` (${totalWoundMod>0?'+':''}${totalWoundMod})`:''} ·

  // ── UNIT BROWSER ──
  function UnitBrowserScreen(){
    const [localGroupOpen,setLocalGroupOpen]=useState({});
    const [showBrowserLegend,setShowBrowserLegend]=useState(false);
    const [addedFlash,setAddedFlash]=useState(null); // unit name last added
    const [search,setSearch]=useState('');
    const [roleF,setRoleF]=useState('All');

    const filtered=useMemo(()=>{
      if(!fdata) return[];
      let units=fdata.units||[];
      if(active?.factionId==='SM'&&active?.chapter&&active.chapter!=='Generic Space Marines'){
        const cid=SM_CHAPTERS.find(c=>c.name===active.chapter)?.id;
        if(cid&&cid!=='generic'){
          units=units.filter(u=>{
            const kws=u.keywords||[];
            const hasAny=SM_CHAPTERS.slice(1).some(c=>kws.some(k=>k.toLowerCase()===c.id.toLowerCase()));
            return !hasAny||kws.some(k=>k.toLowerCase()===cid.toLowerCase());
          });
        }
      }
      if(roleF!=='All') units=units.filter(u=>u.role===roleF);
      if(search) units=units.filter(u=>u.name.toLowerCase().includes(search.toLowerCase()));
      return units;
    },[fdata,roleF,search,active]);

    const roleFilters=useMemo(()=>{
      if(!fdata) return['All'];
      const rs=[...new Set((fdata.units||[]).map(u=>u.role).filter(Boolean))].sort((a,b)=>{
        const order=['Characters','Battleline','Infantry','Dedicated Transports','Other'];
        const ai=order.indexOf(a),bi=order.indexOf(b);
        return(ai===-1?99:ai)-(bi===-1?99:bi);
      });
      return['All',...rs];
    },[fdata]);

    const grouped=useMemo(()=>{
      const catMap={'Character':'Characters','Characters':'Characters','Battleline':'Battleline','Dedicated Transport':'Dedicated Transports','Dedicated Transports':'Dedicated Transports','Allied':'Allied Units','Allied Units':'Allied Units'};
      const g={};
      for(const u of filtered){
        const cat=catMap[u.role]||u.role||'Other';
        if(!g[cat]) g[cat]=[];
        g[cat].push(u);
      }
      return g;
    },[filtered]);

    function toggleGroup(r){setLocalGroupOpen(g=>({...g,[r]:!g[r]}))}
    function quickAdd(unit,e){
      e.stopPropagation();
      handleAdd(unit,0);
      setAddedFlash(unit.name);
      setTimeout(()=>setAddedFlash(null),2000);
    }
    if(floading) return(<>
      <div className="topbar"><button className="btn btn-outline btn-sm" onClick={goBack}>← Army</button><span className="topbar-title">Loading…</span></div>
      <div className="content"><div className="loading"><div className="spinner"/></div></div>
    </>);
    return(<>
      <div className="topbar">
        <button className="btn btn-outline btn-sm" onClick={goBack}>← Army</button>
        <span className="topbar-title">Add Units</span>
        <div style={{display:'flex',gap:4,alignItems:'center'}}>
          <button className="btn btn-ghost btn-sm" onClick={()=>setShowBrowserLegend(true)} style={{fontSize:11,padding:'4px 8px'}}>?</button>
          <span style={{fontSize:11,color:'var(--text3)'}}>{filtered.length}</span>
        </div>
      </div>
      {showBrowserLegend&&<RulesLegend onClose={()=>setShowBrowserLegend(false)}/>}
      {addedFlash&&(
        <div style={{background:'var(--golddim)',borderBottom:'1px solid var(--goldborder)',
          padding:'7px 14px',fontSize:10,color:'var(--gold)',letterSpacing:1,
          display:'flex',alignItems:'center',gap:6,flexShrink:0}}>
          <span style={{fontSize:12}}>✓</span> {addedFlash} added to roster
        </div>
      )}
      <div className="content">
        {/* Search */}
        <div className="search-wrap">
          <span className="search-icon"></span>
          <input placeholder="Search units…" value={search} onChange={e=>setSearch(e.target.value)}/>
        </div>
        {/* Role filters */}
        <div className="filter-row">
          {roles.map(r=>(
            <button key={r} className={`chip ${roleF===r?'active':''}`} onClick={()=>setRoleF(r)}>{r}</button>
          ))}
        </div>

        {/* Grouped units */}
        {search||roleF!=='All'?(
          // Flat list when searching/filtering
          filtered.map(unit=>(
            <div key={unit.id} className="browser-unit-card">
              <div className="browser-unit-info" onClick={()=>setSelUnit(unit)} style={{flex:1,cursor:'pointer'}}>
                <div className="browser-unit-name">{unit.name}</div>
                <div className="browser-unit-meta">
                  <span className={`role-badge role-${(unit.role||"Other").replace(/\s+/g,"-")}`}>{unit.role}</span>
                  {isEpicHero(unit)&&<span className="tag tag-gold">Epic Hero</span>}
                  {isLeader(unit)&&<span className="tag tag-blue">Leader</span>}
                </div>
              </div>
              <div style={{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:3,flexShrink:0}}>
                {unit.costs?.length>0&&<div style={{fontSize:11,color:'var(--gold)',fontWeight:700,letterSpacing:.5}}>{unit.costs[0].cost}pts</div>}
                <button className="add-btn" onClick={e=>quickAdd(unit,e)} title="Quick add">+</button>
              </div>
            </div>
          ))
        ):(
          // Grouped by role
          Object.entries(grouped).sort((a,b)=>{
            const ai=ROLE_ORDER.indexOf(a[0]),bi=ROLE_ORDER.indexOf(b[0]);
            return(ai===-1?99:ai)-(bi===-1?99:bi);
          }).map(([role,units])=>{
            const open=localGroupOpen[role]!==false; // default open
            return(
              <div key={role} className="role-group" data-role={role}>
                <div className="role-group-header" onClick={()=>toggleGroup(role)}>
                  <span className="role-group-title">{role}</span>
                  <div style={{display:'flex',gap:8,alignItems:'center'}}>
                    <span className="role-group-count">{units.length} unit{units.length!==1?'s':''}</span>
                    <span style={{fontSize:11}}>{open?'▲':'▼'}</span>
                  </div>
                </div>
                {open&&units.map(unit=>(
                  <div key={unit.id} className="browser-unit-card">
                    <div className="browser-unit-info" onClick={()=>setSelUnit(unit)} style={{flex:1,cursor:'pointer'}}>
                      <div className="browser-unit-name">{unit.name}</div>
                      <div className="browser-unit-meta">
                        <span className={`role-badge role-${(unit.role||"Other").replace(/\s+/g,"-")}`}>{unit.role}</span>
                        {isEpicHero(unit)&&<span className="tag tag-gold">Epic Hero</span>}
                        {isLeader(unit)&&<span className="tag tag-blue">Leader</span>}
                      </div>
                    </div>
                    <div style={{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:3,flexShrink:0}}>
                      {unit.costs?.length>0&&<div style={{fontSize:11,color:'var(--gold)',fontWeight:700}}>{unit.costs[0].cost}pts</div>}
                      <button className="add-btn" onClick={e=>quickAdd(unit,e)} title="Quick add">+</button>
                    </div>
                  </div>
                ))}
              </div>
            );
          })
        )}
      </div>

      {selUnit&&<UnitDetailModal unit={selUnit} factionId={active?.factionId} fdata={fdata} onClose={()=>setSelUnit(null)}
        onAdd={handleAdd} existingUnits={active?.units||[]}/>}

      {/* Leader → pick bodyguard */}
      {leaderPrompt&&(
        <LeaderAttachModal
          leader={leaderPrompt.unit}
          bodyguardUnits={leaderPrompt.eligible}
          mode="leader"
          onAttach={bid=>{
            if(!bid){doAdd(leaderPrompt.unit,leaderPrompt.si,null);return;}
            // Add leader entry then link
            const entry={id:Date.now().toString(),unit:leaderPrompt.unit,sizeIdx:leaderPrompt.si,
              attachedLeader:null,attachedTo:bid};
            const newUnits=[...active.units,entry].map(e=>
              e.id===bid?{...e,attachedLeader:entry.id}:e
            );
            upArmy(active.id,{units:newUnits});
            setLeaderPrompt(null);
          }}
          onSkip={()=>doAdd(leaderPrompt.unit,leaderPrompt.si,null)}
        />
      )}

      {/* Bodyguard added → pick unattached leader */}
      {bodyguardPrompt&&(
        <LeaderAttachModal
          leader={null}
          bodyguardUnits={bodyguardPrompt.leaders}
          mode="bodyguard"
          onAttach={lid=>attachLeaderToNewBodyguard(lid,bodyguardPrompt.entry.id)}
          onSkip={()=>setBodyguardPrompt(null)}
        />
      )}
    </>);
  }

  // ── COLLECTION SCREEN ──
// ── META LIST CARD (extracted to avoid hook-in-map violation) ─────────────
function MetaListCard({list, li, collection, selectedMeta, addToWishlistWithCount}){
  const [expanded, setExpanded] = React.useState(false);
  const missingUnits = (list.units||[]).filter(u=>{
    const owned=Object.values(collection).find(c=>c.name?.toLowerCase()===u.name?.toLowerCase());
    return !owned||(owned.count<(u.count||1));
  });
  return(
    <div className="meta-card anim-slide-up" style={{marginBottom:10,border:'1px solid var(--goldborder)',background:'var(--bg1)',borderLeft:'3px solid var(--gold)'}}>
      <div onClick={()=>setExpanded(e=>!e)} style={{cursor:'pointer',padding:'10px 12px'}}>
        <div className="meta-card-title">{list.name}</div>
        <div style={{display:'flex',gap:6,alignItems:'center',marginBottom:4}}>
          <span style={{fontSize:9,color:'var(--brass)'}}>{list.detachment}</span>
          <span style={{fontSize:7,padding:'1px 4px',background:'var(--bg2)',border:'1px solid var(--border)',color:'var(--text3)',letterSpacing:.3}}>listhammer.info</span>
        </div>
        <div style={{fontSize:9,color:'var(--text3)',lineHeight:1.5}}>{list.playstyle}</div>
        <div style={{display:'flex',gap:6,marginTop:6}}>
          <span style={{fontSize:8,padding:'1px 5px',background:'var(--bg2)',border:'1px solid var(--border)',color:missingUnits.length===0?'var(--greenBright)':'var(--text3)'}}>
            {missingUnits.length===0?'✓ Have all models':`${missingUnits.length} unit(s) missing`}
          </span>
          <span style={{fontSize:8,color:'var(--text3)'}}>{expanded?'▲ Collapse':'▼ Expand'}</span>
        </div>
      </div>
      {expanded&&(
        <div style={{padding:'0 12px 10px',borderTop:'1px solid var(--border)'}}>
          {(list.units||[]).map((u,ui)=>{
            const owned=Object.values(collection).find(c=>c.name?.toLowerCase()===u.name?.toLowerCase());
            const ownedCount=owned?.count||0;
            const needed=u.count||1;
            const ok=ownedCount>=needed;
            return(
              <div key={ui} className="meta-check-row">
                <span className={ok?'meta-check-owned':'meta-check-miss'}>{ok?'✓':'✗'}</span>
                <span style={{flex:1,fontSize:10,color:ok?'var(--text)':'var(--text3)'}}>{u.name} ×{needed}</span>
                <span style={{fontSize:9,color:ok?'var(--greenBright)':'var(--redBright)'}}>{ownedCount}/{needed}</span>
              </div>
            );
          })}
          <div style={{display:'flex',gap:4,flexWrap:'wrap',marginTop:10}}>
            <button className="btn btn-xs btn-outline" onClick={()=>{
              const txt=list.name+' — '+list.detachment+'\n'+list.playstyle+'\n\n'+(list.units||[]).map(u=>u.name+' x'+(u.count||1)).join('\n');
              navigator.clipboard?.writeText(txt).then(()=>alert('List copied!')).catch(()=>alert(txt));
            }}>📋 Copy List</button>
            {missingUnits.length>0&&(
              <button className="btn btn-xs btn-gold" onClick={()=>{
                missingUnits.forEach(u=>{
                  const ownedCount=Object.values(collection).find(c=>c.name?.toLowerCase()===u.name?.toLowerCase())?.count||0;
                  addToWishlistWithCount(
                    u.name.toLowerCase().replace(/\s+/g,'_'),
                    u.name,
                    selectedMeta?.faction?.id,
                    selectedMeta?.faction?.name,
                    (u.count||1)-ownedCount,
                  );
                });
                alert(`${missingUnits.length} unit(s) added to wishlist!`);
              }}>⭐ Add Missing to Wishlist</button>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

    const [buildList,setBuildList]   = useState([]);
    const [collFactionData,setCollFactionData] = useState(null);
    const [collFactionLoading,setCollFactionLoading] = useState(false);
    // Which armies are collapsed in the Owned tab — keeps a big collection
    // from turning into a wall of units. Expanded by default.
    const [collapsedFactions,setCollapsedFactions] = useState({});

    // ── Box-set helpers ──────────────────────────────────────────────────────
    // Models per box, in priority order:
    //  1. manual per-unit override saved in the collection (always wins)
    //  2. curated GW retail box data (box-sizes.json)
    //  3. fallback: minimum unit size parsed from the datasheet composition
    function getBoxSize(unit, colEntry){
      if(colEntry?.boxSizeOverride>0) return colEntry.boxSizeOverride;
      const curated = boxSizes?.[String(unit?.name||colEntry?.name||'').toLowerCase().trim()];
      if(curated>0) return curated;
      return getCompositionBoxSize(unit);
    }
    // Parse unit_composition to get the minimum unit size
    function getCompositionBoxSize(unit){
      const comp = unit?.unit_composition || unit?.unit_comp || [];
      if(!comp.length) return 1;
      // Parse "N ModelName" or "N-M ModelName" entries, skip "OR" lines
      let total = 0;
      for(const c of comp){
        const desc = (typeof c === 'string') ? c : (c.description || c.desc || '');
        if(!desc || desc.trim().toUpperCase() === 'OR') continue;
        // "1 Boss Nob" → 1, "9-19 Boyz" → 9 (min), "1 Runtherd and 10 Gretchin" → 11
        const andMatch = desc.match(/(\d+)\s+\S+\s+and\s+(\d+)/i);
        if(andMatch){ total += parseInt(andMatch[1]) + parseInt(andMatch[2]); continue; }
        const rangeMatch = desc.match(/^(\d+)-\d+\s+/);
        if(rangeMatch){ total += parseInt(rangeMatch[1]); continue; }
        const numMatch = desc.match(/^(\d+)\s+/);
        if(numMatch){ total += parseInt(numMatch[1]); }
      }
      return Math.max(1, total);
    }

    // Build named model slots from composition. perBox (optional) forces the
    // number of models per box — from curated data or a manual override — and
    // trims/pads the composition-derived names to match.
    function getModelSlots(unit, boxes, perBox){
      const comp = unit?.unit_composition || unit?.unit_comp || [];
      if(!comp.length) return Array((perBox||1)*boxes).fill(unit?.name || 'Model');
      const singleBoxSlots = [];
      for(const c of comp){
        const desc = (typeof c === 'string') ? c : (c.description || c.desc || '');
        if(!desc || desc.trim().toUpperCase() === 'OR') continue;
        // "1 Runtherd and 10 Gretchin" → Runtherd + 10×Gretchin
        const andMatch = desc.match(/(\d+)\s+(.+?)\s+and\s+(\d+)\s+(.+)/i);
        if(andMatch){
          for(let i=0;i<parseInt(andMatch[1]);i++) singleBoxSlots.push(andMatch[2].trim());
          for(let i=0;i<parseInt(andMatch[3]);i++) singleBoxSlots.push(andMatch[4].trim());
          continue;
        }
        const rangeMatch = desc.match(/^(\d+)-\d+\s+(.+)/);
        if(rangeMatch){
          for(let i=0;i<parseInt(rangeMatch[1]);i++) singleBoxSlots.push(rangeMatch[2].trim());
          continue;
        }
        const numMatch = desc.match(/^(\d+)\s+(.+)/);
        if(numMatch){
          for(let i=0;i<parseInt(numMatch[1]);i++) singleBoxSlots.push(numMatch[2].trim());
        }
      }
      // Force the per-box count when curated/override data says otherwise:
      // pad with the most common model name, or trim from the end (the
      // named/leader slots parsed first are kept).
      if(perBox>0&&singleBoxSlots.length!==perBox){
        if(singleBoxSlots.length>perBox){
          singleBoxSlots.length=perBox;
        }else{
          const filler=singleBoxSlots[singleBoxSlots.length-1]||unit?.name||'Model';
          while(singleBoxSlots.length<perBox) singleBoxSlots.push(filler);
        }
      }
      // Repeat slots for each box
      const allSlots = [];
      for(let b=0;b<boxes;b++){
        singleBoxSlots.forEach((name,i)=>{
          const isUnique = singleBoxSlots.filter(n=>n===name).length === 1;
          const boxNum = boxes > 1 ? ` (Box ${b+1})` : '';
          allSlots.push(isUnique ? name+boxNum : name);
        });
      }
      return allSlots.length ? allSlots : Array((perBox||1)*boxes).fill(unit?.name||'Model');
    }

    // Add one box to collection
    function addBox(unitId, unit, factionId, factionName){
      setCollection(c=>{
        const cur = c[unitId];
        const boxSize = getBoxSize(unit, cur);
        if(!cur){
          const slots = getModelSlots(unit, 1, boxSize);
          return {...c, [unitId]:{
            name: unit.name, factionId, factionName,
            boxes: 1, boxSize,
            modelNames: slots,
            modelStatus: {},  // {idx: 'painted'|'started'|'unpainted'}
            paintPriority: null,
          }};
        }
        const newBoxes = cur.boxes + 1;
        const slots = getModelSlots(unit, newBoxes, boxSize);
        return {...c, [unitId]:{...cur, boxes:newBoxes, boxSize, modelNames:slots}};
      });
    }

    // Remove one box
    function removeBox(unitId, unit){
      setCollection(c=>{
        const cur = c[unitId];
        if(!cur) return c;
        if(cur.boxes <= 1){ const {[unitId]:_, ...rest}=c; return rest; }
        const newBoxes = cur.boxes - 1;
        const boxSize = getBoxSize(unit, cur);
        const slots = getModelSlots(unit||{name:cur.name,unit_composition:[]}, newBoxes, boxSize);
        // Remove status entries for models beyond new count
        const newStatus = {};
        Object.entries(cur.modelStatus||{}).forEach(([idx,s])=>{
          if(parseInt(idx) < slots.length) newStatus[idx] = s;
        });
        return {...c, [unitId]:{...cur, boxes:newBoxes, boxSize, modelNames:slots, modelStatus:newStatus}};
      });
    }

    // Manually correct how many models come in this unit's box — rebuilds the
    // model slots for the boxes already owned, keeping paint statuses that
    // still fit.
    function setBoxSizeOverride(unitId, unit, perBox){
      setCollection(c=>{
        const cur = c[unitId];
        if(!cur) return c;
        const n = Math.max(1, Math.min(30, perBox|0));
        const srcUnit = unit || {name:cur.name, unit_composition:[]};
        const slots = getModelSlots(srcUnit, cur.boxes, n);
        const newStatus = {};
        Object.entries(cur.modelStatus||{}).forEach(([idx,s])=>{
          if(parseInt(idx) < slots.length) newStatus[idx] = s;
        });
        return {...c, [unitId]:{...cur, boxSizeOverride:n, boxSize:n, modelNames:slots, modelStatus:newStatus}};
      });
    }

    function setModelStatus(unitId, modelIdx, status){

                                            <button key={st}
                                              onClick={()=>setModelStatus(unit.id, mi, st)}
                                              style={{
                                                flex:1,fontSize:8,padding:'3px 2px',cursor:'pointer',fontWeight:700,
                                                letterSpacing:.3,textTransform:'uppercase',
                                                border:`1px solid ${status===st?PAINT_COLOR[st]:'var(--border)'}`,
                                                background:status===st?PAINT_COLOR[st]+'26':'var(--bg1)',
                                                color:status===st?PAINT_COLOR[st]:'var(--text3)',
                                              }}>
                                              {label}
                                            </button>
                                          ))}
                                        </div>
                                      </div>
                                    );
                                  })}
                                </div>
                              </div>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  );})}
                </>
              ) : addFaction==='select' ? (
                /* Faction picker */
                <div>
                  <div style={{display:'flex',gap:8,marginBottom:10,alignItems:'center'}}>
                    <button className="btn btn-outline btn-sm" onClick={()=>setAddFaction(null)}>← Back</button>
                    <div style={{fontFamily:"'Cinzel',serif",fontSize:11,color:'var(--gold)'}}>Select Faction</div>
                  </div>
                  {factionList.map(f=>(
                    <div key={f.id} onClick={()=>{setAddFaction(f.id);}}
                      style={{padding:'9px 12px',marginBottom:4,cursor:'pointer',background:'var(--bg1)',
                        border:'1px solid var(--border)',borderLeft:'3px solid transparent',transition:'all .13s'}}>
                      <div style={{fontFamily:"'Cinzel',serif",fontSize:11,color:'var(--text)'}}>{f.name}</div>
                    </div>
                  ))}
                </div>
              ) : (
                /* Unit browser for selected faction */
                <div>
                  <div style={{display:'flex',gap:6,marginBottom:8,alignItems:'center'}}>
                    <button className="btn btn-xs btn-outline" onClick={()=>setAddFaction('select')}>← Factions</button>
                    <div style={{flex:1,fontFamily:"'Cinzel',serif",fontSize:10,color:'var(--gold)'}}>
                      {index?.[addFaction]?.name||addFaction}
                    </div>
                  </div>
                  <input placeholder="Search units…" value={searchQ} onChange={e=>setSearchQ(e.target.value)}
                    style={{width:'100%',marginBottom:8,fontSize:12}}/>
                  {(collFactionLoading||floading)&&(
                    <div style={{padding:16,textAlign:'center'}}><div className="spinner"/></div>
                  )}
                  {!collFactionLoading&&!floading&&browseUnits.map(u=>{
                    const cur = collection[u.id];
                    const boxSize = getBoxSize(u, cur);
                    return(
                      <div key={u.id} style={{display:'flex',alignItems:'center',gap:8,padding:'8px 10px',
                        marginBottom:3,background:'var(--bg1)',
                        border:`1px solid ${cur?'var(--goldborder)':'var(--border)'}`}}>
                        <div style={{flex:1}}>
                          <div style={{fontFamily:"'Cinzel',serif",fontSize:11,color:cur?'var(--gold)':'var(--text)'}}>{u.name}</div>
                          <div style={{fontSize:9,color:'var(--text3)',marginTop:1}}>
                            {boxSize} model{boxSize!==1?'s':''}/box
                            {cur&&<span style={{color:'var(--greenBright)',marginLeft:8}}>✓ {cur.boxes} box{cur.boxes!==1?'es':''} ({cur.modelNames?.length||0} models)</span>}
                          </div>
                        </div>
                        <div style={{display:'flex',alignItems:'center',gap:3,flexShrink:0}}>
                          <button className="counter-btn" style={{width:26,height:26}}
                            onClick={()=>removeBox(u.id, u)}>−</button>
                          <span style={{fontSize:13,fontWeight:700,color:'var(--gold)',minWidth:20,textAlign:'center'}}>
                            {cur?.boxes||0}
                          </span>
                          <button className="counter-btn" style={{width:26,height:26}}
                            onClick={()=>addBox(u.id, u, addFaction, index?.[addFaction]?.name||addFaction)}>+</button>
                        </div>
                      </div>
                    );
                  })}
                  {!collFactionLoading&&!floading&&browseUnits.length===0&&(
                    <div style={{color:'var(--text3)',fontSize:11,padding:16,textAlign:'center'}}>No units found</div>
                  )}
                </div>
              )}
            </div>
          )}

          {/* ── PAINT TAB ──────────────────────────────────────────────────── */}
          {colTab==='paint'&&(
            <div style={{padding:10}}>
              <div style={{background:'var(--bg1)',border:'1px solid var(--goldborder)',padding:'12px 14px',marginBottom:10}}>
                <div style={{display:'flex',justifyContent:'space-between',marginBottom:6}}>
                  <div style={{fontFamily:"'Cinzel',serif",fontSize:11,color:'var(--gold)'}}>Progress</div>
                  <div style={{fontSize:12,fontWeight:700,color:'var(--greenBright)'}}>{paintPct}%</div>
                </div>
                <div style={{height:8,background:'var(--bg2)',border:'1px solid var(--border)',overflow:'hidden'}}>
                  <div style={{height:'100%',width:`${paintPct}%`,background:'linear-gradient(90deg,var(--greenBright),var(--gold))',transition:'width .4s'}}/>
                </div>
                <div style={{display:'flex',gap:12,marginTop:8,fontSize:9,color:'var(--text3)'}}>
                  <span style={{color:PAINT_COLOR.painted}}>■ {totalPainted} painted</span>
                  <span style={{color:PAINT_COLOR.started}}>■ {colEntries.reduce((s,[,u])=>s+Object.values(u.modelStatus||{}).filter(st=>st==='started').length,0)} W.I.P</span>
                  <span>■ {totalModels-totalPainted} remaining</span>
                </div>
              </div>

              {/* Paint queue */}
              <div style={{fontSize:9,letterSpacing:2,color:'var(--brass)',fontFamily:"'Cinzel',serif",textTransform:'uppercase',marginBottom:6}}>Paint Queue</div>
              {paintQueue.length===0&&(
                <div style={{color:'var(--text3)',fontSize:10,padding:10,border:'1px dashed var(--border)',textAlign:'center',marginBottom:10}}>
                  Set paint priorities in Owned tab to build your queue
                </div>
              )}
              {paintQueue.map((uid,qi)=>{
                const u=collection[uid]; if(!u) return null;
                const slots=u.modelNames||[];
                const statuses=u.modelStatus||{};
                const nP=Object.values(statuses).filter(s=>s==='painted').length;
                const pct=slots.length>0?Math.round((nP/slots.length)*100):0;
                return(
                  <div key={uid} style={{display:'flex',alignItems:'center',gap:8,padding:'8px 10px',marginBottom:3,background:'var(--bg1)',border:'1px solid var(--border)'}}>
                    <div style={{width:20,height:20,background:'var(--golddim)',border:'1px solid var(--goldborder)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:9,color:'var(--gold)',flexShrink:0}}>{qi+1}</div>
                    <div style={{flex:1}}>
                      <div style={{fontFamily:"'Cinzel',serif",fontSize:11}}>{u.name}</div>
                      <div style={{fontSize:9,color:'var(--text3)'}}>{nP}/{slots.length} painted</div>
                    </div>
                    <div style={{fontSize:11,fontWeight:700,color:pct===100?'var(--greenBright)':'var(--gold)'}}>{pct}%</div>
                  </div>
                );
              })}

              {/* All unpainted */}
              <div style={{fontSize:9,letterSpacing:2,color:'var(--brass)',fontFamily:"'Cinzel',serif",textTransform:'uppercase',marginBottom:6,marginTop:10}}>All In Progress / Bare</div>
              {colEntries.filter(([,u])=>{
                const n=u.modelNames?.length||0;
                const p=Object.values(u.modelStatus||{}).filter(s=>s==='painted').length;
                return n>0&&p<n;
              }).map(([uid,u])=>{
                const slots=u.modelNames||[];
                const p=Object.values(u.modelStatus||{}).filter(s=>s==='painted').length;
                const pct=slots.length>0?Math.round((p/slots.length)*100):0;
                return(
                  <div key={uid} style={{padding:'7px 10px',marginBottom:3,background:'var(--bg1)',border:'1px solid var(--border)'}}>
                    <div style={{display:'flex',justifyContent:'space-between',marginBottom:3}}>
                      <div style={{fontFamily:"'Cinzel',serif",fontSize:10}}>{u.name}</div>
                      <div style={{fontSize:9,color:'var(--text3)'}}>{p}/{slots.length}</div>
                    </div>
                    <div style={{height:4,background:'var(--bg2)',overflow:'hidden'}}>
                      <div style={{height:'100%',width:`${pct}%`,background:'var(--greenBright)'}}/>
                    </div>
                  </div>
                );
              })}
              {colEntries.every(([,u])=>{const n=u.modelNames?.length||0;const p=Object.values(u.modelStatus||{}).filter(s=>s==='painted').length;return n===0||p>=n;})&&(
                <div style={{color:'var(--greenBright)',fontSize:11,padding:12,textAlign:'center'}}>🎨 Everything is painted!</div>
              )}
            </div>
          )}

          {/* ── WISHLIST TAB ───────────────────────────────────────────────── */}
          {colTab==='wishlist'&&(
            <div style={{padding:10}}>
              {wishlist.length===0&&(
                <div className="empty">
                  <div style={{fontFamily:"'Cinzel',serif"}}>Wishlist Empty</div>
                  <div style={{fontSize:10}}>Add units from the Meta tab or the unit browser</div>
                </div>
              )}
              {Object.entries(wishByFaction).map(([fid,{name:fname,items}])=>(
                <div key={fid} style={{marginBottom:12}}>
                  <div style={{fontSize:9,letterSpacing:2,color:'var(--brass)',fontFamily:"'Cinzel',serif",textTransform:'uppercase',marginBottom:5,paddingBottom:3,borderBottom:'1px solid var(--goldborder)'}}>{fname}</div>
                  {items.map(w=>{
                    const owned=collection[w.id]?.boxes||0;
                    const needed=w.needed||1;
                    const ok=owned>=needed;
                    return(
                      <div key={w.id} style={{display:'flex',alignItems:'center',gap:8,padding:'8px 10px',marginBottom:3,background:'var(--bg1)',border:`1px solid ${ok?'var(--greenBright)40':'var(--border)'}`,borderLeft:`3px solid ${ok?'var(--greenBright)':'var(--goldborder)'}`}}>
                        <div style={{flex:1}}>
                          <div style={{fontFamily:"'Cinzel',serif",fontSize:11}}>{w.name}</div>
                          <div style={{fontSize:8,color:ok?'var(--greenBright)':'var(--text3)',marginTop:2}}>
                            {ok?`✓ Have ${owned} box${owned!==1?'es':''}`:`Need ${needed} box${needed!==1?'es':''}, own ${owned}`}
                          </div>
                        </div>
                        <button className="btn btn-xs btn-danger" onClick={()=>setWishlist(wl=>wl.filter(x=>x.id!==w.id))}>✕</button>
                      </div>
                    );
                  })}
                </div>
              ))}
            </div>
          )}

          {/* ── META TAB ───────────────────────────────────────────────────── */}
          {colTab==='meta'&&(
            <div style={{padding:10}}>
              <div style={{background:'var(--bg1)',border:'1px solid var(--goldborder)',borderLeft:'3px solid var(--gold)',padding:'8px 12px',marginBottom:10}}>
                <div style={{fontFamily:"'Cinzel',serif",fontSize:10,color:'var(--gold)',marginBottom:3}}>Meta Lists · listhammer.info</div>
                <div style={{fontSize:9,color:'var(--text3)',lineHeight:1.6}}>AI-synthesised from <strong style={{color:'var(--brass)'}}>listhammer.info</strong>. Select faction to load 3 top builds. Cached until refreshed.</div>
              </div>
              {!selectedMeta?(
                <>
                  {factionList.map(f=>{
                    const cached=metaLists?.[f.id];
                    return(
                      <div key={f.id} style={{display:'flex',alignItems:'center',gap:8,padding:'9px 12px',marginBottom:3,background:'var(--bg1)',border:'1px solid var(--border)',cursor:'pointer'}}
                        onClick={()=>{if(cached)setSelectedMeta({faction:f,data:cached});else fetchMetaLists(f);}}>
                        <div style={{flex:1}}>
                          <div style={{fontFamily:"'Cinzel',serif",fontSize:11,color:'var(--text)'}}>{f.name}</div>
                          {cached&&<div style={{fontSize:8,color:'var(--text3)',marginTop:1}}>Updated {cached.updated}</div>}
                        </div>
                        {metaLoading?<span style={{fontSize:9,color:'var(--text3)'}}>…</span>:(
                          <button className="btn btn-xs btn-outline" onClick={e=>{e.stopPropagation();fetchMetaLists(f);}}>
                            {cached?'Refresh':'Fetch'}
                          </button>
                        )}
                      </div>
                    );
                  })}
                  {metaError&&<div style={{color:'var(--redBright)',fontSize:10,padding:8,border:'1px solid var(--red)',marginTop:8}}>{metaError}</div>}
                </>
              ):(
                <div>
                  <div style={{display:'flex',gap:8,marginBottom:10,alignItems:'center'}}>
                    <button className="btn btn-xs btn-outline" onClick={()=>setSelectedMeta(null)}>← Back</button>
                    <div style={{flex:1,fontFamily:"'Cinzel',serif",fontSize:11,color:'var(--gold)'}}>{selectedMeta.faction?.name} Meta</div>
                  </div>
                  {(selectedMeta.data?.lists||[]).map((list,li)=>(
                    <MetaListCard key={li} list={list} li={li}
                      collection={collection} selectedMeta={selectedMeta}
                      addToWishlistWithCount={addToWishlistWithCount}/>
                  ))}
                </div>
              )}
            </div>
          )}

          {/* ── BUILD ARMY TAB ─────────────────────────────────────────────── */}
          {colTab==='build'&&(
            <div style={{padding:10}}>
              <div style={{fontSize:10,color:'var(--text3)',marginBottom:10,lineHeight:1.5}}>
                Select units from your collection and transfer to the Armoury as a new army.
              </div>
              {!buildFaction?(
                <>
                  <div style={{fontSize:9,letterSpacing:2,color:'var(--brass)',fontFamily:"'Cinzel',serif",textTransform:'uppercase',marginBottom:6}}>Select Faction</div>
                  {Object.keys(byFaction).length===0&&<div style={{color:'var(--text3)',fontSize:11,padding:12,textAlign:'center'}}>Add models to collection first</div>}
                  {Object.entries(byFaction).map(([fid,{name:fname,units}])=>(
                    <div key={fid} onClick={()=>setBuildFaction(fid)}
                      style={{padding:'10px 12px',marginBottom:4,cursor:'pointer',background:'var(--bg1)',border:'1px solid var(--border)',borderLeft:'3px solid transparent',transition:'all .13s'}}>
                      <div style={{fontFamily:"'Cinzel',serif",fontSize:11,color:'var(--text)'}}>{fname}</div>
                      <div style={{fontSize:9,color:'var(--text3)',marginTop:2}}>{units.length} unit types · {units.reduce((s,u)=>s+(u.modelNames?.length||0),0)} models</div>
                    </div>
                  ))}
                </>
              ):(()=>{
                const fUnits=byFaction[buildFaction]?.units||[];
                return(
                  <div>
                    <div style={{display:'flex',gap:8,marginBottom:10,alignItems:'center'}}>
                      <button className="btn btn-xs btn-outline" onClick={()=>{setBuildFaction(null);setBuildList([]);}}>← Back</button>
                      <div style={{flex:1,fontFamily:"'Cinzel',serif",fontSize:11,color:'var(--gold)'}}>{byFaction[buildFaction]?.name}</div>
                    </div>
                    {buildList.length>0&&(
                      <div style={{background:'var(--bg1)',border:'1px solid var(--goldborder)',padding:'10px 12px',marginBottom:10}}>
                        <div style={{fontFamily:"'Cinzel',serif",fontSize:10,color:'var(--gold)',marginBottom:6}}>Current Build</div>
                        {buildList.map(b=>(
                          <div key={b.unitId} style={{display:'flex',justifyContent:'space-between',padding:'3px 0',borderBottom:'1px solid var(--border)'}}>
                            <span style={{fontSize:10}}>{b.name} ×{b.count}</span>
                            <button className="btn btn-xs btn-ghost" onClick={()=>setBuildList(bl=>bl.filter(x=>x.unitId!==b.unitId))}>✕</button>
                          </div>
                        ))}
                        <button className="btn btn-gold" style={{width:'100%',marginTop:8}} onClick={buildAndTransfer}>Transfer to Armoury</button>
                      </div>
                    )}
                    {fUnits.map(u=>{
                      const inBuild=buildList.find(b=>b.unitId===u.id);
                      const maxBoxes=u.boxes;
                      return(
                        <div key={u.id} style={{display:'flex',alignItems:'center',gap:8,padding:'8px 10px',marginBottom:3,background:'var(--bg1)',border:`1px solid ${inBuild?'var(--goldborder)':'var(--border)'}`}}>
                          <div style={{flex:1}}>
                            <div style={{fontFamily:"'Cinzel',serif",fontSize:11,color:inBuild?'var(--gold)':'var(--text)'}}>{u.name}</div>
                            <div style={{fontSize:9,color:'var(--text3)',marginTop:1}}>Owned: {maxBoxes} box{maxBoxes!==1?'es':''} · {u.modelNames?.length||0} models{inBuild?` · In build: ${inBuild.count}`:''}</div>
                          </div>
                          <div style={{display:'flex',alignItems:'center',gap:3}}>
                            <button className="counter-btn" style={{width:24,height:24}} onClick={()=>setBuildList(bl=>{const cur=bl.find(b=>b.unitId===u.id);if(!cur)return bl;const next=cur.count-1;if(next<=0)return bl.filter(b=>b.unitId!==u.id);return bl.map(b=>b.unitId===u.id?{...b,count:next}:b);})}>−</button>
                            <span style={{fontSize:13,fontWeight:700,color:'var(--gold)',minWidth:18,textAlign:'center'}}>{inBuild?.count||0}</span>
                            <button className="counter-btn" style={{width:24,height:24}} onClick={()=>setBuildList(bl=>{const cur=bl.find(b=>b.unitId===u.id);if(cur){if(cur.count>=maxBoxes)return bl;return bl.map(b=>b.unitId===u.id?{...b,count:b.count+1}:b);}return[...bl,{unitId:u.id,name:u.name,count:1}];})}>+</button>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                );
              })()}
            </div>
          )}

        </div>
      </div>
    );
  }

  // ── AGE OF SIGMAR: WARSCROLL BROWSER ──────────────────────────────────────
  function AoSWarscrollsScreen(){
    const [q,setQ]=useState('');
    const [openUnit,setOpenUnit]=useState(null);
    const [showTraits,setShowTraits]=useState(false);

    // Faction list
    if(!aosFactionId) return(<>
      <div className="topbar">
        <button className="btn btn-outline btn-sm" onClick={()=>setAppOpen(false)}>← Back</button>
        <span className="topbar-title">AoS Warscrolls</span>
      </div>
      <div className="content">
        {!aosIndex?<div className="loading"><div className="spinner"/></div>:(
          Object.entries(aosIndex).sort((a,b)=>a[1].name.localeCompare(b[1].name)).map(([fid,f])=>(
            <div key={fid} className="faction-card" onClick={()=>{setAosFactionId(fid);loadAosFaction(fid);}}>
              <div style={{flex:1}}>
                <div className="faction-card-name">{f.name}</div>
                <div className="faction-card-sub">{f.units} warscrolls</div>
              </div>
              <span className="faction-card-chevron">›</span>
            </div>
          ))
        )}
      </div>
    </>);

    // Warscroll list + detail
    const units=(aosFdata?.units||[]).filter(u=>!q||u.name.toLowerCase().includes(q.toLowerCase()));
    return(<>
      <div className="topbar">
        <button className="btn btn-outline btn-sm" onClick={()=>{setAosFactionId(null);setAosFdata(null);}}>← Factions</button>
        <span className="topbar-title">{aosFdata?.name||'Loading…'}</span>
        <span style={{fontSize:9,color:'var(--text3)'}}>{units.length}</span>
      </div>
      <div className="content">
        {aosLoading&&<div className="loading"><div className="spinner"/></div>}
        {!aosLoading&&aosFdata&&(<>
          {(aosFdata.battleTraits||[]).length>0&&(
            <div style={{background:'var(--bg1)',border:'1px solid var(--goldborder)',borderLeft:'3px solid var(--brass)',padding:'8px 12px',marginBottom:8}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',cursor:'pointer'}} onClick={()=>setShowTraits(v=>!v)}>
                <span style={{fontSize:9,letterSpacing:2,color:'var(--brass)',fontFamily:"'Cinzel',serif",textTransform:'uppercase'}}>Battle Traits ({aosFdata.battleTraits.length})</span>
                <span style={{fontSize:9,color:'var(--text3)'}}>{showTraits?'▲':'▼'}</span>
              </div>
              {showTraits&&aosFdata.battleTraits.map((t,i)=>(
                <div key={i} style={{marginTop:8,paddingTop:6,borderTop:'1px solid var(--border)'}}>
                  <div style={{fontSize:11,color:'var(--gold)',fontFamily:"'Cinzel',serif"}}>{t.name} <span style={{fontSize:8,color:'var(--text3)'}}>{t.type}</span></div>
                  {t.declare&&<div style={{fontSize:9,color:'var(--text3)',marginTop:2}}><b>Declare:</b> {t.declare}</div>}
                  {t.effect&&<div style={{fontSize:10,color:'var(--text2)',marginTop:2,lineHeight:1.5}}>{t.effect}</div>}
                </div>
              ))}
            </div>
          )}
          <input placeholder="Search warscrolls…" value={q} onChange={e=>setQ(e.target.value)} style={{width:'100%',marginBottom:8,fontSize:12}}/>
          {units.map(u=>{
            const open=openUnit===u.id;
            return(
              <div key={u.id} style={{marginBottom:5,background:'var(--bg1)',border:`1px solid ${open?'var(--goldborder)':'var(--border)'}`}}>
                <div style={{display:'flex',alignItems:'center',gap:8,padding:'8px 10px',cursor:'pointer'}} onClick={()=>setOpenUnit(open?null:u.id)}>
                  <div style={{flex:1}}>
                    <div style={{fontFamily:"'Cinzel',serif",fontSize:11,color:open?'var(--gold)':'var(--text)'}}>{u.name}</div>
                    <div style={{fontSize:9,color:'var(--text3)',marginTop:1}}>
                      {u.points?`${u.points} pts · `:''}{u.unitSize>1?`${u.unitSize} models · `:''}
                      M {u.move||'-'} · H {u.health||'-'} · Sv {u.save||'-'} · C {u.control||'-'}{u.ward?` · Ward ${u.ward}`:''}
                    </div>
                  </div>
                  <span style={{fontSize:10,color:'var(--text3)'}}>{open?'▲':'▼'}</span>
                </div>
                {open&&(
                  <div style={{padding:'0 10px 10px',borderTop:'1px solid var(--border)'}}>
                    {/* Stat blocks */}
                    <div style={{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:3,textAlign:'center',margin:'8px 0'}}>
                      {[['MOVE',u.move],['HEALTH',u.health],['SAVE',u.save],['CONTROL',u.control],['WARD',u.ward||'—']].map(([l,v])=>(
                        <div key={l} style={{background:'var(--bg2)',padding:'5px 2px',border:'1px solid var(--border)'}}>
                          <div style={{fontSize:7,color:'var(--text3)',letterSpacing:.5}}>{l}</div>
                          <div style={{fontSize:13,fontWeight:700,color:'var(--gold)',fontFamily:"'Cinzel',serif"}}>{v||'—'}</div>
                        </div>
                      ))}
                    </div>
                    {/* Weapons */}
                    {u.weapons.length>0&&(
                      <div style={{marginBottom:8}}>
                        <div style={{fontSize:8,letterSpacing:1.5,color:'var(--brass)',textTransform:'uppercase',fontFamily:"'Cinzel',serif",marginBottom:3}}>Weapons</div>
                        {u.weapons.map((w,i)=>(
                          <div key={i} style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',padding:'3px 0',borderBottom:'1px solid rgba(42,42,58,.5)'}}>
                            <div>
                              <span style={{fontSize:10,color:'var(--text)',fontFamily:"'Cinzel',serif"}}>{w.name}</span>
                              <span style={{fontSize:8,color:w.type==='Melee'?'#c6a':'var(--blueBright)',marginLeft:5}}>{w.type}{w.rng?` ${w.rng}`:''}</span>
                              {w.ability&&<span style={{fontSize:8,color:'var(--brass)',marginLeft:5}}>[{w.ability}]</span>}
                            </div>
                            <span style={{fontSize:9,color:'var(--text3)',flexShrink:0}}>A{w.atk} · {w.hit} · {w.wnd} · R{w.rnd||'0'} · D{w.dmg}</span>
                          </div>
                        ))}
                      </div>
                    )}
                    {/* Abilities */}
                    {u.abilities.length>0&&(
                      <div style={{marginBottom:6}}>
                        <div style={{fontSize:8,letterSpacing:1.5,color:'var(--brass)',textTransform:'uppercase',fontFamily:"'Cinzel',serif",marginBottom:3}}>Abilities</div>
                        {u.abilities.map((a,i)=>(
                          <div key={i} style={{marginBottom:6,padding:'5px 8px',background:'var(--bg2)',border:'1px solid var(--border)'}}>
                            <div style={{fontSize:10,color:'var(--gold)',fontFamily:"'Cinzel',serif"}}>
                              {a.name} <span style={{fontSize:8,color:'var(--text3)'}}>{(a.type||'').replace('Ability ','')}{a.timing?` · ${a.timing}`:''}</span>
                            </div>
                            {a.declare&&<div style={{fontSize:9,color:'var(--text3)',marginTop:2}}><b>Declare:</b> {a.declare}</div>}
                            {a.effect&&<div style={{fontSize:10,color:'var(--text2)',marginTop:2,lineHeight:1.5}}>{a.effect}</div>}
                            {a.keywords&&<div style={{fontSize:8,color:'var(--brass)',marginTop:2}}>{a.keywords}</div>}
                          </div>
                        ))}
                      </div>
                    )}
                    {/* Keywords */}
                    {u.keywords.length>0&&(
                      <div style={{display:'flex',gap:3,flexWrap:'wrap'}}>
                        {u.keywords.map((k,i)=>(
                          <span key={i} style={{fontSize:8,padding:'1px 5px',background:'var(--bg2)',border:'1px solid var(--border)',color:'var(--text3)',letterSpacing:.5}}>{k}</span>
                        ))}
                      </div>
                    )}
                  </div>
                )}
              </div>
            );
          })}
        </>)}
      </div>
    </>);
  }

    // ── MAIN APP RENDER ──────────────────────────────────────────────────────
  // Re-point the stable wrappers at THIS render's freshly-closed-over screen
  // functions every time App renders, so they always see current state/props
  // while keeping a constant component identity (see stableScreen() above).
  registerScreen('menu',MenuScreen);
  registerScreen('armies',ArmiesScreen);
  registerScreen('factions',FactionsScreen);
  registerScreen('smChapter',SmChapterScreen);
  registerScreen('detachments',DetachmentsScreen);
  registerScreen('army',ArmyScreen);
  registerScreen('unitBrowser',UnitBrowserScreen);
  registerScreen('collection',CollectionScreen);
  registerScreen('aosWarscrolls',AoSWarscrollsScreen);

  return(<>
    <StableMenuScreen/>
    <div className={`app ${appOpen?'open':''}`}>
      {indexStatus!=='ready'&&(
        <div style={{position:'fixed',inset:0,background:'var(--bg0)',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:16,zIndex:99}}>
          <div className="spinner"/>
          <div style={{color:'var(--gold)',fontSize:12,fontWeight:800,letterSpacing:3,textTransform:'uppercase'}}>Accessing Cogitator Network…</div>
          <div style={{color:'var(--text3)',fontSize:11}}>Connecting to Data Source</div>
          <div style={{color:'var(--text3)',fontSize:9,marginTop:4,opacity:.6}}>{DATA_BASE}</div>
        </div>
      )}
      {screen==='armies'&&<StableArmiesScreen/>}
      {screen==='factions'&&<StableFactionsScreen/>}
      {screen==='sm-chapter'&&<StableSmChapterScreen/>}
      {screen==='detachments'&&<StableDetachmentsScreen/>}
      {screen==='army'&&<StableArmyScreen/>}
      {screen==='unit-browser'&&<StableUnitBrowserScreen/>}
      {screen==='collection'&&<StableCollectionScreen/>}
      {screen==='archive'&&<ReferenceArchiveScreen coreStrats={coreStrats} onBack={()=>setAppOpen(false)}/>}
      {screen==='aos-warscrolls'&&<StableAoSWarscrollsScreen/>}
    </div>

    <button className="btn-settings-float" onClick={()=>setShowSettings(true)} title="Settings & Backup">⚙</button>

    {/* ── GAME-SYSTEM TRANSITION CINEMATIC ── */}
    {menuTransition&&(
      <div style={{position:'fixed',inset:0,zIndex:500,background:'#000',display:'flex',alignItems:'center',justifyContent:'center'}}
        onClick={()=>{setMenuPath(menuTransition.nextPath);setMenuTransition(null);}}>
        {/* This clip is portrait (9:16). On a landscape desktop window,
            object-fit:cover would blow it up and crop the sides down to a
            sliver — "too zoomed in" on wide screens. contain shows the whole
            frame letterboxed instead, correct on any window shape. */}
        <video src={menuTransition.video} autoPlay muted playsInline
          style={{width:'100%',height:'100%',objectFit:'contain'}}
          onEnded={()=>{setMenuPath(menuTransition.nextPath);setMenuTransition(null);}}
          onError={()=>{setMenuPath(menuTransition.nextPath);setMenuTransition(null);}}/>
        <div style={{position:'absolute',bottom:24,right:20,fontSize:10,color:'rgba(255,255,255,.6)',letterSpacing:2,fontFamily:"'Cinzel',serif"}}>TAP TO SKIP</div>
      </div>
    )}

    <SettingsModal/>
  </>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

</script>
</body>

</html>

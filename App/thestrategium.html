                            <div style={{fontSize:10,color:'var(--text2)',lineHeight:1.6}}>{s.rules_text}</div>
                          </ExpandableRow>
                        ))}
                      {(armyRulesData.stratagems||[]).filter(s=>{
                        const p=(s.phase||'').toLowerCase();
                        const ph=PHASES[phase].toLowerCase();
                        return !p||p.includes(ph)||p.includes('any')||p.includes('either');
                      }).length===0&&(
                        <div style={{textAlign:'center',padding:12,fontSize:10,color:'var(--text3)',fontFamily:"'Cinzel',serif",letterSpacing:1}}>
                          NO FACTION STRATAGEMS FOR THIS PHASE
                        </div>
                      )}
                    </>
                  )}

                  {/* Enhancements */}
                  {(armyRulesData.enhancements||[]).length>0&&(
                    <>
                      <div className="section-label">Enhancements ({armyRulesData.enhancements.length})</div>
                      {(armyRulesData.enhancements||[]).map((e,i)=>(
                        <ExpandableRow key={i} title={e.name} badge={e.points||undefined} badgeColor="var(--brass)">
                          {e.flavour_text&&<div style={{fontSize:10,color:'var(--text3)',fontStyle:'italic',marginBottom:6,lineHeight:1.5}}>{e.flavour_text}</div>}
                          <div style={{fontSize:10,color:'var(--text2)',lineHeight:1.6}}>{e.rules_text}</div>
                        </ExpandableRow>
                      ))}
                    </>
                  )}
                </>
              )}
            </div>
          )}

        </div>
      </div>
    </div>
  );
}

// ── REFERENCE ARCHIVE ────────────────────────────────────────────────────────
// Core Rules · Weapon Keywords · Core Stratagems · Key Definitions, all in one
// browsable screen. Fixes a crash: the main menu's "Reference Archive" pillar
// pointed at this component, but it had never actually been built.
function ReferenceArchiveScreen({coreStrats,onBack}){
  const [tab,setTab]=React.useState('rules');
  const [core,setCore]=React.useState(null);
  const [openPhase,setOpenPhase]=React.useState('command');
  React.useEffect(()=>{ fetchRepoJSON('WH40K/Rules/core-rules.json').then(setCore); },[]);

  // ── Army Rules & Units/Detachments — faction index, loaded once ──
  const [factionIndex,setFactionIndex]=React.useState(null);
  React.useEffect(()=>{ fetchRepoJSON('WH40K/Data/Unit Data/index.json').then(setFactionIndex); },[]);
  const [openArmyRule,setOpenArmyRule]=React.useState(null); // faction id expanded

  const [browseFid,setBrowseFid]=React.useState(null);
  const [browseFdata,setBrowseFdata]=React.useState(null);
  const [browseLoading,setBrowseLoading]=React.useState(false);
  const [browseSearch,setBrowseSearch]=React.useState('');
  const [browseUnit,setBrowseUnit]=React.useState(null);
  const [openDet,setOpenDet]=React.useState(null);
  function openFactionBrowse(fid){
    setBrowseFid(fid); setBrowseFdata(null); setBrowseSearch(''); setOpenDet(null);
    setBrowseLoading(true);
    fetchRepoJSON('WH40K/Data/Unit Data/'+factionIndex[fid].file).then(d=>{ setBrowseFdata(d); setBrowseLoading(false); });
  }

  const PHASE_TABS=[
    ['command','Command'],['movement','Movement'],['shooting','Shooting'],
    ['charge','Charge'],['fight','Fight'],
  ];

  return(<>
    <div className="topbar">
      <button className="btn-home" onClick={onBack} title="Main Menu">⌂</button>
      <span className="topbar-title">Reference Archive</span>
      <div/>
    </div>
    <div style={{display:'flex',borderBottom:'1px solid var(--border)',flexShrink:0,overflowX:'auto'}}>
      {[['rules','Core Rules'],['army','Army Rules'],['units','Units & Detachments'],['keywords','Weapon Keywords'],['strats','Stratagems'],['defs','Definitions']].map(([k,l])=>(
        <div key={k} className={`tab ${tab===k?'active':''}`} onClick={()=>setTab(k)} style={{whiteSpace:'nowrap'}}>{l}</div>
      ))}
    </div>
    <div className="content">
      {tab==='rules'&&(!core?(
        <div className="loading"><div className="spinner"/></div>
      ):(
        <div>
          <div style={{display:'flex',gap:4,flexWrap:'wrap',marginBottom:10}}>
            {PHASE_TABS.map(([k,l])=>(
              <button key={k} className={`btn btn-sm ${openPhase===k?'btn-gold':'btn-outline'}`} onClick={()=>setOpenPhase(k)}>{l}</button>
            ))}
          </div>
          {(()=>{
            const q=core.phaseQuickRef?.[openPhase];
            if(!q) return <div style={{color:'var(--text3)',fontSize:11}}>No quick reference for this phase.</div>;
            return(
              <div style={{background:'var(--bg1)',border:'1px solid var(--goldborder)',borderLeft:'3px solid var(--gold)',padding:'12px 14px',marginBottom:14}}>
                <div style={{fontFamily:"'Cinzel',serif",fontSize:12,color:'var(--gold)',letterSpacing:1,marginBottom:8,textTransform:'uppercase'}}>{PHASE_TABS.find(p=>p[0]===openPhase)[1]} Phase</div>
                {q.bothPlayersDo?.length>0&&(<>
                  <div style={{fontSize:9,color:'var(--brass)',letterSpacing:1,textTransform:'uppercase',marginBottom:3}}>Both Players</div>
                  {q.bothPlayersDo.map((t,i)=><div key={i} style={{fontSize:11,color:'var(--text2)',marginBottom:4}}>• {t}</div>)}
                </>)}
                {q.youDo?.length>0&&(<>
                  <div style={{fontSize:9,color:'var(--brass)',letterSpacing:1,textTransform:'uppercase',margin:'8px 0 3px'}}>Active Player</div>
                  {q.youDo.map((t,i)=><div key={i} style={{fontSize:11,color:'var(--text2)',marginBottom:4}}>• {t}</div>)}
                </>)}
              </div>
            );
          })()}
          <div className="section-label" style={{marginTop:0}}>Attack Sequence</div>
          {(core.attackSequence||[]).map((step,i)=>(
            <div key={i} style={{display:'flex',gap:8,padding:'6px 0',borderBottom:'1px solid var(--border)'}}>
              <div style={{width:18,flexShrink:0,fontFamily:"'Cinzel',serif",color:'var(--gold)',fontSize:11}}>{i+1}</div>
              <div style={{fontSize:11,color:'var(--text2)',lineHeight:1.5}}>{typeof step==='string'?step:step.name||step.step||JSON.stringify(step)}</div>
            </div>
          ))}
        </div>
      ))}

      {tab==='army'&&(
          <div>
            <div style={{fontSize:10,color:'var(--text3)',lineHeight:1.6,marginBottom:10}}>
              Every army's overarching faction rule — the one that applies to the whole force, distinct from any single detachment's rule (see Units &amp; Detachments for those).
            </div>
            {Object.entries(ARMY_ABILITIES)
              .sort((a,b)=>(factionIndex?.[a[0]]?.name||a[0]).localeCompare(factionIndex?.[b[0]]?.name||b[0]))
              .map(([fid,rule])=>{
                const open=openArmyRule===fid;
                return(
                  <div key={fid} style={{background:'var(--bg1)',border:'1px solid var(--goldborder)',marginBottom:6}}>
                    <div style={{padding:'9px 12px',cursor:'pointer',display:'flex',justifyContent:'space-between',alignItems:'center'}}
                      onClick={()=>setOpenArmyRule(open?null:fid)}>
                      <div>
                        <div style={{fontSize:9,color:'var(--brass)',letterSpacing:1,textTransform:'uppercase'}}>{factionIndex?.[fid]?.name||fid}</div>
                        <div style={{fontFamily:"'Cinzel',serif",fontSize:12,color:'var(--gold)',marginTop:2}}>{rule.name}</div>
                      </div>
                      <span style={{fontSize:10,color:'var(--text3)'}}>{open?'▲':'▼'}</span>
                    </div>
                    {open&&(
                      <div style={{padding:'0 12px 12px'}}>
                        <div style={{fontSize:10,color:'var(--text2)',lineHeight:1.6}}>{rule.summary}</div>
                        {(rule.options||[]).length>0&&(
                          <div style={{marginTop:8}}>
                            {rule.options.map((o,i)=>(
                              <div key={i} style={{background:'var(--bg2)',border:'1px solid var(--border)',padding:'6px 9px',marginTop:4}}>
                                <div style={{fontSize:10,color:'var(--gold)',fontFamily:"'Cinzel',serif"}}>{o.name}</div>
                                <div style={{fontSize:9,color:'var(--text3)',lineHeight:1.5,marginTop:2}}>{o.summary}</div>
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    )}
                  </div>
                );
              })}
          </div>
      )}

      {tab==='units'&&(
        !factionIndex?(
          <div className="loading"><div className="spinner"/></div>
        ):!browseFid?(
          <div>
            <div style={{fontSize:10,color:'var(--text3)',lineHeight:1.6,marginBottom:10}}>
              Pick a faction to browse its detachments (rule, stratagems, enhancements) and every unit datasheet.
            </div>
            {Object.entries(factionIndex).sort((a,b)=>a[1].name.localeCompare(b[1].name)).map(([fid,meta])=>(
              <div key={fid} onClick={()=>openFactionBrowse(fid)}
                style={{background:'var(--bg1)',border:'1px solid var(--border)',padding:'9px 12px',marginBottom:5,cursor:'pointer',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                <div style={{fontFamily:"'Cinzel',serif",fontSize:12,color:'var(--gold)'}}>{meta.name}</div>
                <div style={{fontSize:9,color:'var(--text3)'}}>{meta.units} units · {meta.detachments} detachments</div>
              </div>
            ))}
          </div>
        ):(
          <div>
            <button className="btn btn-outline btn-sm" style={{marginBottom:10}} onClick={()=>{setBrowseFid(null);setBrowseFdata(null);}}>← All Factions</button>
            {browseLoading||!browseFdata?(
              <div className="loading"><div className="spinner"/></div>
            ):(<>
              <div className="section-label" style={{marginTop:0}}>Detachments</div>
              {(browseFdata.detachments||[]).map(det=>{
                const open=openDet===det.id;
                return(
                  <div key={det.id} style={{background:'var(--bg1)',border:'1px solid var(--border)',marginBottom:5}}>
                    <div style={{padding:'9px 12px',cursor:'pointer',display:'flex',justifyContent:'space-between',alignItems:'center'}}
                      onClick={()=>setOpenDet(open?null:det.id)}>
                      <div>
                        <div style={{fontFamily:"'Cinzel',serif",fontSize:12,color:'var(--gold)'}}>{det.name}</div>
                        <div style={{fontSize:9,color:'var(--text3)',marginTop:2}}>{(det.stratagems||[]).length} Stratagems · {(det.enhancements||[]).length} Enhancements</div>
                      </div>
                      <span style={{fontSize:10,color:'var(--text3)'}}>{open?'▲':'▼'}</span>
                    </div>
                    {open&&(
                      <div style={{padding:'0 12px 12px'}}>
                        {det.legend&&<div style={{fontSize:10,color:'var(--text3)',fontStyle:'italic',lineHeight:1.5,marginBottom:8}}>{clean(det.legend)}</div>}
                        {(det.abilities||[]).map((a,i)=>(
                          <div key={i} style={{marginBottom:6}}>
                            <div style={{fontSize:10,color:'var(--gold)',fontFamily:"'Cinzel',serif"}}>{a.name}</div>
                            <div style={{fontSize:10,color:'var(--text2)',lineHeight:1.6}} dangerouslySetInnerHTML={{__html:a.description||''}}/>
                          </div>
                        ))}
                        {(det.enhancements||[]).length>0&&(<>
                          <div style={{fontSize:9,color:'var(--brass)',letterSpacing:1,textTransform:'uppercase',margin:'8px 0 3px'}}>Enhancements</div>
                          {det.enhancements.map((e,i)=>(
                            <div key={i} style={{fontSize:10,color:'var(--text2)',lineHeight:1.5,marginBottom:3}}>
                              <strong style={{color:'var(--text)'}}>{e.name}</strong> ({e.cost||e.cp}pts) — {clean(e.description||e.legend||'')}
                            </div>
                          ))}
                        </>)}
                      </div>
                    )}
                  </div>
                );
              })}
              {(browseFdata.detachments||[]).length===0&&<div style={{fontSize:10,color:'var(--text3)',marginBottom:10}}>No detachments in this dataset.</div>}

              <div className="section-label">Units ({browseFdata.units?.length||0})</div>
              <input placeholder="Search units…" value={browseSearch} onChange={e=>setBrowseSearch(e.target.value)} style={{width:'100%',marginBottom:8,fontSize:12}}/>
              {(browseFdata.units||[])
                .filter(u=>!browseSearch||u.name.toLowerCase().includes(browseSearch.toLowerCase()))
                .map(u=>(
                  <div key={u.id} onClick={()=>setBrowseUnit(u)}
                    style={{background:'var(--bg1)',border:'1px solid var(--border)',padding:'7px 12px',marginBottom:3,cursor:'pointer',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                    <span style={{fontFamily:"'Cinzel',serif",fontSize:11,color:'var(--text)'}}>{u.name}</span>
                    <span style={{fontSize:9,color:'var(--text3)'}}>{u.role}</span>
                  </div>
                ))}
            </>)}
            {browseUnit&&(
              <UnitDetailModal unit={browseUnit} factionId={browseFid} fdata={browseFdata}
                onClose={()=>setBrowseUnit(null)} readOnly/>
            )}
          </div>
        )
      )}

      {tab==='keywords'&&(
        <div>
          {Object.entries(WEAPON_KW_EXPLANATIONS).map(([kw,ex])=>(
            <div key={kw} style={{background:'var(--bg1)',border:'1px solid var(--border)',padding:'8px 12px',marginBottom:5}}>
              <div style={{fontFamily:"'Cinzel',serif",fontSize:11,color:'var(--gold)',marginBottom:2}}>{kw}</div>
              <div style={{fontSize:10,color:'var(--text2)',lineHeight:1.5}}>{ex}</div>
            </div>
          ))}
        </div>
      )}

      {tab==='strats'&&(
        (coreStrats||[]).length===0?<div style={{color:'var(--text3)',fontSize:11,textAlign:'center',padding:20,lineHeight:1.6}}>Universal Core Stratagems have not been added to the rules data yet — this tab will populate automatically once WH40K/Rules/core-rules.json includes them.<br/><br/>Detachment-specific stratagems are already available per-army under The Armoury → your army → Stratagems.</div>:
        <div>
          {coreStrats.map((s,i)=>(
            <StratCard key={i} s={s}/>
          ))}
        </div>
      )}

      {tab==='defs'&&(
        <div>
          {[
            {a:'M',l:'Movement',d:'How far the unit can move in inches per turn'},
            {a:'T',l:'Toughness',d:'Resistance to wounds — compared against weapon Strength'},
            {a:'SV',l:'Save',d:'Armour save value — roll equal to or higher to negate a wound'},
            {a:'W',l:'Wounds',d:'Number of wounds before the model is destroyed'},
            {a:'LD',l:'Leadership',d:'Used for Battle-shock tests at the end of each phase'},
            {a:'OC',l:'Objective Control',d:'How much this unit contributes to controlling objectives'},
            {a:'BS',l:'Ballistic Skill',d:'Ranged attack accuracy — roll equal to or higher to hit'},
            {a:'WS',l:'Weapon Skill',d:'Melee attack accuracy — roll equal to or higher to hit'},
            {a:'A',l:'Attacks',d:'Number of attack dice rolled per model in combat'},
            {a:'S',l:'Strength',d:'Weapon strength — compared against target Toughness to wound'},
            {a:'AP',l:'Armour Penetration',d:'Reduces target armour save. AP-1 means save is 1 worse'},
            {a:'D',l:'Damage',d:'Wounds dealt per successful, unsaved wound'},
            {a:'INV',l:'Invulnerable Save',d:'Always available regardless of AP — cannot be modified'},
            {a:'FNP',l:'Feel No Pain',d:'Roll after wound allocated — success negates the wound'},
          ].map(({a,l,d})=>(
            <div key={a} style={{display:'flex',gap:10,padding:'6px 0',borderBottom:'1px solid var(--border)',alignItems:'flex-start'}}>
              <div style={{width:32,flexShrink:0,fontFamily:"'Share Tech Mono',monospace",fontSize:12,fontWeight:700,color:'var(--gold)',textAlign:'center',paddingTop:1}}>{a}</div>
              <div style={{flex:1}}>
                <div style={{fontSize:11,color:'var(--text)',fontFamily:"'Cinzel',serif",letterSpacing:.3,marginBottom:1}}>{l}</div>
                <div style={{fontSize:10,color:'var(--text3)',lineHeight:1.5}}>{d}</div>
              </div>
            </div>
          ))}
          {core?.keyDefinitions&&(<>
            <div className="section-label">Core Definitions</div>
            {Object.entries(core.keyDefinitions).map(([k,v])=>(
              <div key={k} style={{marginBottom:8}}>
                <div style={{fontFamily:"'Cinzel',serif",fontSize:11,color:'var(--gold)',textTransform:'capitalize'}}>{k.replace(/([A-Z])/g,' $1').trim()}</div>
                <div style={{fontSize:10,color:'var(--text2)',lineHeight:1.5}}>{v}</div>
              </div>
            ))}
          </>)}
        </div>
      )}
    </div>
  </>);
}

// ── COMMANDER ARMY SCREEN (selector) ─────────────────────────────────────────
function CommanderScreen({armies,onBack}){
  const [selFid,setSelFid]=React.useState(null);
  const selCmd=selFid?COMMANDERS[selFid]:null;

  const factions=Object.entries(COMMANDERS);

  if(selCmd){
    return(
      <div style={{display:'flex',flexDirection:'column',height:'100%'}}>
        <div className="topbar">
          <button className="btn btn-outline btn-sm" onClick={()=>setSelFid(null)}>← All</button>
          <span className="topbar-title">Commander</span>
          <div/>
        </div>
        <div style={{flex:1,overflowY:'auto'}}>
          {selCmd.img&&(
            <div style={{position:'relative',background:selCmd.colour||'var(--bg1)'}}>
              <img src={selCmd.img} alt={selCmd.name}
                style={{width:'100%',height:260,objectFit:'cover',objectPosition:selCmd.imgPos||'center top',display:'block',opacity:.85,
                  maskImage:'linear-gradient(to bottom,black 60%,transparent 100%)',
                  WebkitMaskImage:'linear-gradient(to bottom,black 60%,transparent 100%)'}}
                onError={e=>{e.target.style.height='60px';e.target.style.opacity=0}}/>
              <div style={{position:'absolute',bottom:0,left:0,right:0,padding:'14px 16px',background:'linear-gradient(to top,rgba(9,9,14,.98),transparent)'}}>
                <div style={{fontFamily:"'Cinzel',serif",fontSize:22,fontWeight:900,letterSpacing:3,color:selCmd.accent||'var(--gold)',lineHeight:1}}>{selCmd.name}</div>
                <div style={{fontSize:10,letterSpacing:2,color:'var(--text3)',textTransform:'uppercase',marginTop:4}}>{selCmd.title}</div>
                <div style={{fontSize:10,color:'var(--text3)',marginTop:4,fontStyle:'italic'}}>{selCmd.personality}</div>
              </div>
            </div>
          )}
          <div style={{padding:14}}>
            <div className="section-label" style={{marginTop:0}}>Standing Orders</div>
            {(selCmd.reminders||[]).map((r,i)=>(
              <div key={i} style={{display:'flex',gap:8,padding:'7px 0',borderBottom:'1px solid var(--border)',alignItems:'flex-start'}}>
                <div style={{width:5,height:5,background:selCmd.accent||'var(--gold)',flexShrink:0,marginTop:4,transform:'rotate(45deg)'}}/>
                <div style={{fontSize:11,color:'var(--text2)',lineHeight:1.6}}>{r}</div>
              </div>
            ))}
            <div className="section-label">Commanding Faction</div>
            {armies.filter(a=>a.factionId===selFid).map(a=>(
              <div key={a.id} style={{background:'var(--bg1)',border:'1px solid var(--border)',padding:'10px 12px',marginBottom:4}}>
                <div style={{fontFamily:"'Cinzel',serif",fontSize:11,color:'var(--gold)'}}>{a.name}</div>
                <div style={{fontSize:9,color:'var(--text3)',marginTop:2}}>{a.detachment?.name||'No Detachment'} · {a.units?.length||0} units</div>
              </div>
            ))}
            {armies.filter(a=>a.factionId===selFid).length===0&&(
              <div style={{fontSize:11,color:'var(--text3)',padding:'10px 0',fontStyle:'italic'}}>No armies registered for this faction.</div>
            )}
          </div>
        </div>
      </div>
    );
  }

  return(
    <div style={{display:'flex',flexDirection:'column',height:'100%'}}>
      <div className="topbar">
        <button className="btn btn-outline btn-sm" onClick={onBack}>← Back</button>
        <span className="topbar-title">The Strategium</span>
        <div/>
      </div>
      <div style={{background:'var(--bg1)',borderBottom:'1px solid var(--goldborder)',padding:'12px 14px'}}>
        <div style={{fontFamily:"'Cinzel',serif",fontSize:9,letterSpacing:4,color:'var(--brass)',textTransform:'uppercase',marginBottom:4}}>Commander Dossiers</div>
        <div style={{fontSize:11,color:'var(--text3)',lineHeight:1.6}}>Select a faction to review your commander's dossier and standing orders.</div>
      </div>
      <div style={{flex:1,overflowY:'auto',padding:12}}>
        {factions.map(([fid,cmd])=>(
          <div key={fid} onClick={()=>setSelFid(fid)}
            style={{
              background:'var(--bg1)',border:'1px solid var(--border)',
              marginBottom:6,cursor:'pointer',overflow:'hidden',
              transition:'border-color .15s',display:'flex',gap:12,alignItems:'stretch',
              borderLeft:`3px solid ${cmd.accent||'var(--border)'}`,
            }}
            onMouseEnter={e=>e.currentTarget.style.borderColor=cmd.accent||'var(--goldborder)'}
            onMouseLeave={e=>e.currentTarget.style.borderColor='var(--border)'}>
            {cmd.img&&(
              <img src={cmd.img} alt={cmd.name}
                style={{width:64,height:64,objectFit:'cover',objectPosition:cmd.imgPos||'center top',flexShrink:0,opacity:.85}}
                onError={e=>{e.target.style.display='none'}}/>
            )}
            <div style={{padding:'10px 10px 10px 0',flex:1,minWidth:0}}>
              <div style={{fontFamily:"'Cinzel',serif",fontSize:12,fontWeight:700,color:cmd.accent||'var(--gold)',letterSpacing:.5}}>{cmd.name}</div>
              <div style={{fontSize:9,color:'var(--text3)',letterSpacing:1,textTransform:'uppercase',marginTop:2}}>{cmd.title}</div>
              <div style={{fontSize:9,color:'var(--text3)',marginTop:3,fontStyle:'italic'}}>{cmd.personality}</div>
            </div>
            <div style={{display:'flex',alignItems:'center',paddingRight:10,color:'var(--text3)',fontSize:14,flexShrink:0}}>›</div>
          </div>
        ))}
      </div>
    </div>
  );
}

const STRAT_PHASES=[
  {id:'command',label:'Command Phase',match:['command']},
  {id:'movement',label:'Movement Phase',match:['movement']},
  {id:'shooting',label:'Shooting Phase',match:['shooting']},
  {id:'charge',label:'Charge Phase',match:['charge']},
  {id:'fight',label:'Fight Phase',match:['fight']},
  {id:'any',label:'Any Phase / Special Rules',match:['any','either','both','']},
];

function getStratPhase(s){
  const p=(s.phase||s.when||'').toLowerCase();
  for(const ph of STRAT_PHASES){
    if(ph.id==='any') continue;
    if(ph.match.some(m=>p.includes(m))) return ph.id;
  }
  return 'any';
}

function PhaseStratagems({coreStrats,detStrats,detName}){
  const [open,setOpen]=React.useState({command:true}); // command open by default
  function toggle(id){setOpen(o=>({...o,[id]:!o[id]}))}
  
  // Merge all strats, tag with source
  const allStrats=[
    ...coreStrats.map(s=>({...s,_source:'Core'})),
    ...detStrats.map(s=>({...s,_source:detName||'Detachment'})),
  ];

  return(
    <div>
      {STRAT_PHASES.map(ph=>{
        const strats=allStrats.filter(s=>getStratPhase(s)===ph.id);
        if(!strats.length) return null;

        return(
          <div key={ph.id} style={{marginBottom:4}}>

                  color:isOpen?'var(--gold)':'var(--text2)'}}>{ph.label}</span>
                <span style={{fontSize:9,padding:'2px 6px',border:'1px solid var(--border)',
                  color:'var(--text3)'}}>{strats.length}</span>
              </div>
              <span style={{fontSize:12,color:isOpen?'var(--gold)':'var(--text3)',

// key below is a client key by design — access is limited by row-level
// security, and a room is only reachable by whoever has its random code.
// HIDDEN INFORMATION: Secret Missions (and any mission card flagged secret)
// are never uploaded — they live only on their owner's device until revealed.
const MP_URL='https://raodnacctikccblmblsh.supabase.co';
const MP_KEY='sb_publishable_HM_QY33m7UUMJ54fKHEhfw_LHcFEXz0';
const MP_HEADERS={'apikey':MP_KEY,'Authorization':'Bearer '+MP_KEY,'Content-Type':'application/json'};
function mpNewCode(){
  const alphabet='ABCDEFGHJKMNPQRSTUVWXYZ23456789'; // no confusable 0/O/1/I/L
  let c='';
  for(let i=0;i<6;i++) c+=alphabet[Math.floor(Math.random()*alphabet.length)];
  return c;
}
async function mpGetRoom(code){
  const r=await fetch(`${MP_URL}/rest/v1/strategium_rooms?code=eq.${encodeURIComponent(code)}&select=*`,{headers:MP_HEADERS});
  if(!r.ok) throw new Error('room fetch failed ('+r.status+')');
  const rows=await r.json();
  return rows[0]||null;
}
async function mpCreateRoom(code,meta){
  const r=await fetch(`${MP_URL}/rest/v1/strategium_rooms`,{
    method:'POST',headers:{...MP_HEADERS,Prefer:'return=minimal'},
    body:JSON.stringify({code,meta,state:{},version:0}),
  });
  if(!r.ok) throw new Error('room create failed ('+r.status+')');
  return code;
}
async function mpPatchRoom(code,fields){
  const r=await fetch(`${MP_URL}/rest/v1/strategium_rooms?code=eq.${encodeURIComponent(code)}`,{
    method:'PATCH',headers:{...MP_HEADERS,Prefer:'return=minimal'},
    body:JSON.stringify({...fields,updated_at:new Date().toISOString()}),
  });
  if(!r.ok) throw new Error('room update failed ('+r.status+')');
}

async function fetchJSON(path){
  if(cache[path]) return cache[path];
  const url = `${DATA_BASE}/${path}`;
  console.log('[Strategium] Fetching:', url);
  const r = await fetch(url);
  console.log('[Strategium] Response:', path, r.status, r.ok);
  if(!r.ok) throw new Error(`HTTP ${r.status} for ${url}`);
  const text = await r.text();
  try{
    const d=JSON.parse(text);
    cache[path]=d; return d;
  }catch(e){
    console.error('[Strategium] JSON parse error for',path,':',e.message);
    throw e;
  }
}

const pts=(unit,si)=>{
  if(!unit.costs?.length) return 0;
  return parseInt(unit.costs[Math.min(si,unit.costs.length-1)]?.cost)||0;
};
// Extract the number of models in a unit at a given size index, from its costs[].description
// (e.g. "5 models" -> 5). Falls back to 1 if no count can be parsed.
const modelCount=(unit,si)=>{
  const desc=unit.costs?.[Math.min(si,(unit.costs?.length||1)-1)]?.description||'';
  const m=desc.match(/(\d+)\s*model/i);
  return m?parseInt(m[1]):1;
};
const isEpicHero=u=>u.keywords?.includes('Epic Hero');
const isLeader=u=>u.leads?.length>0;
const isChar=u=>u.role==='Characters'||u.role==='Character';
// Some Epic Heroes have a "Supreme Commander" ability that forces them to be the Warlord
// despite the normal rule that Epic Heroes cannot be Warlord (e.g. Ghazghkull Thraka).
const hasSupremeCommander=u=>(u.abilities||[]).some(a=>(a.name||'').toUpperCase().includes('SUPREME COMMANDER'));
// A unit can be set as Warlord if it's a Character and either not an Epic Hero,
// or an Epic Hero with the Supreme Commander exception.
const canBeWarlordRule=u=>isChar(u)&&(!isEpicHero(u)||hasSupremeCommander(u));
// A unit MUST be the Warlord if it has Supreme Commander (army is illegal otherwise).
const mustBeWarlord=u=>hasSupremeCommander(u);
const clean=s=>s?s.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim():'';
// Some ability descriptions embed the ability's own name (in caps) as the first words
// of the cleaned text (e.g. "DEEP STRIKE Some units make their way..."). When the name
// is already shown as a heading elsewhere, strip that duplicate leading name here.
const cleanAbilityDesc=(desc,name)=>{
  const c=clean(desc);
  if(!name) return c;
  const upper=name.toUpperCase();
  if(c.toUpperCase().startsWith(upper)) return c.slice(upper.length).trim();
  return c;
};
const stratTiming=t=>{
  const l=(t||'').toLowerCase();
  return l.includes('your')?'your':l.includes('opponent')?'opp':'either';
};

// Maps a raw stat value to a 1-5 "pip" level for the compact visual summary —
// e.g. a Damage of 1 and a Damage of 6 both read at a glance without forcing
// the player to parse an exact number every roll.
function pipLevel(value,thresholds){
  for(let i=0;i<thresholds.length;i++) if(value<=thresholds[i]) return i+1;
  return thresholds.length+1;
}

}
// Compact, number-free read on a weapon's profile — the default view in combat

    const map={};
    for(const w of ws){
      const k=w.line||w.name;
      if(!map[k]) map[k]={name:w.name,profiles:[]};
      map[k].profiles.push(w);
    }
    return Object.values(map);
  }

  function renderKeywords(abStr){
    if(!abStr) return null;
    const kws=abStr.split(',').map(s=>s.trim().toLowerCase()).filter(Boolean);
    return(
      <div className="weapon-ability-row" style={{gap:3,flexWrap:'wrap',display:'flex',marginTop:3}}>
        {kws.map((kw,i)=>{
          const def=WEAPON_KEYWORDS[kw];
          const isKnown=!!def;
          return(
            <span key={i}
              style={{
                fontSize:8,padding:'2px 6px',letterSpacing:.5,textTransform:'uppercase',
                background:isKnown?'rgba(200,168,75,.12)':'var(--bg2)',
                border:`1px solid ${isKnown?'var(--goldborder)':'var(--border)'}`,
                color:isKnown?'var(--gold)':'var(--text3)',
                cursor:isKnown?'pointer':'default',
                fontFamily:"'Share Tech Mono',monospace",
              }}
              onClick={isKnown?()=>setKwTip(kwTip===kw?null:kw):undefined}>
              {kw.toUpperCase()}
            </span>
          );
        })}
        {kwTip&&WEAPON_KEYWORDS[kwTip]&&(
          <div style={{
            width:'100%',marginTop:4,padding:'8px 10px',
            background:'var(--bg1)',border:'1px solid var(--goldborder)',
            borderLeft:'3px solid var(--gold)',fontSize:11,
            color:'var(--text2)',lineHeight:1.6,
          }}>
            <div style={{fontFamily:"'Cinzel',serif",fontSize:9,color:'var(--gold)',letterSpacing:1,textTransform:'uppercase',marginBottom:4}}>{kwTip.toUpperCase()}</div>
            {WEAPON_KEYWORDS[kwTip]}
            <button onClick={e=>{e.stopPropagation();setKwTip(null);}}
              style={{float:'right',background:'none',border:'none',color:'var(--text3)',cursor:'pointer',fontSize:11,marginTop:-4}}>✕</button>
          </div>
        )}
      </div>
    );
  }

  function renderGroup(ws,label){
    if(!ws.length) return null;
    const groups=buildGroups(ws);
    return(
      <div className="weapon-section">
        <div className="weapon-type-label">{label}</div>
        <div className="weapon-row hdr">
          <span>Weapon</span><span>Rng</span><span>A</span><span>Hit</span><span>S</span><span>AP</span><span>D</span>
        </div>
        {groups.map((g,gi)=>g.profiles.map((p,pi)=>(
          <React.Fragment key={`${gi}-${pi}`}>
            <div className="weapon-row">
              <span className="weapon-name">{pi===0?g.name:'↳ '+p.name}</span>
              <span>{p.range||'-'}</span>
              <span>{p.attacks||'-'}</span>
              <span>{p.bs_ws?p.bs_ws+'+':'-'}</span>
              <span>{p.strength||'-'}</span>
              <span>{p.ap==='0'||p.ap===0?'0':p.ap||'-'}</span>
              <span>{p.damage||'-'}</span>
            </div>
            {p.abilities&&renderKeywords(p.abilities)}
          </React.Fragment>
        )))}
      </div>
    );
  }

  return(
    <div>
      {renderGroup(ranged,'Ranged Weapons')}
      {renderGroup(melee,'Melee Weapons')}
      {options?.length>0&&(
        <div style={{marginTop:8}}>
          <div className="section-label">Wargear Options</div>
          {options.map((o,i)=>(
            <div key={i} style={{fontSize:12,color:'var(--text2)',marginBottom:6,lineHeight:1.6,
              padding:'6px 10px',background:'var(--bg2)',
              borderLeft:'2px solid var(--gold)',borderRadius:'0 4px 4px 0'}}>
              {clean(o)}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ── STRATAGEM CARD ────────────────────────────────────────────────────────────
function StratCard({s}){
  const [open,setOpen]=useState(false);
  const t=stratTiming(s.turn);
  const cls=t==='your'?'your-turn':t==='opp'?'opp-turn':'either';
  const tc=t==='your'?'#4488ff':t==='opp'?'#ff4444':'#44cc66';
  const tl=t==='your'?'YOUR TURN':t==='opp'?'OPP TURN':'EITHER';
  const src=s._source??(s.type?.includes('Core')?'Core':'Detachment');
  return(
    <div className={`strat-card ${cls}`} onClick={()=>setOpen(o=>!o)}>
      {/* Meta row: source tag | phase | timing | cp | chevron */}
      <div style={{display:'flex',alignItems:'center',gap:4,marginBottom:5,flexWrap:'wrap'}}>
        {src&&<span style={{fontSize:8,padding:'1px 5px',background:'var(--bg0)',border:'1px solid var(--border)',color:'var(--text3)',letterSpacing:1,textTransform:'uppercase',flexShrink:0}}>{src==='Core'?'CORE':'DET'}</span>}
        {s.phase&&<span style={{fontSize:8,padding:'1px 5px',background:'var(--bluedim)',border:'1px solid rgba(42,122,176,.4)',color:'var(--blueBright)',letterSpacing:1,textTransform:'uppercase',flexShrink:0}}>{s.phase.toUpperCase()}</span>}
        <span style={{background:'rgba(0,0,0,.4)',color:tc,padding:'1px 5px',fontSize:8,fontWeight:800,letterSpacing:.5,flexShrink:0}}>{tl}</span>
        <span style={{flex:1}}/>
        <span className="tag tag-gold" style={{flexShrink:0}}>{s.cp||s.cp_cost||"?"}CP</span>
        <span style={{fontSize:10,color:'var(--text3)'}}>{open?'▲':'▼'}</span>
      </div>
      <div style={{fontWeight:800,fontSize:12,textTransform:'uppercase',letterSpacing:.5,color:'var(--text)'}}>{s.name}</div>
      {open&&<div className="strat-card-body">{clean(s.description)}</div>}
    </div>
  );
}

// Battle-context stratagem card: shows the same reference info as StratCard, plus a
// CP-deducting "Use" button so the player can actually spend CP on it during a battle.
function StratCardCP({s,cost,canAfford,onUse}){
  const [open,setOpen]=useState(false);
  const t=stratTiming(s.turn);
  const cls=t==='your'?'your-turn':t==='opp'?'opp-turn':'either';
  const tc=t==='your'?'#4488ff':t==='opp'?'#ff4444':'#44cc66';
  const tl=t==='your'?'YOUR TURN':t==='opp'?'OPP TURN':'EITHER';
  const src=s._source??(s.type?.includes('Core')?'Core':'Detachment');
  return(
    <div className={`strat-card ${cls}`} style={{opacity:!canAfford&&cost>0?0.55:1}}>
      <div onClick={()=>setOpen(o=>!o)} style={{cursor:'pointer'}}>
        <div style={{display:'flex',alignItems:'center',gap:4,marginBottom:5,flexWrap:'wrap'}}>
          {src&&<span style={{fontSize:8,padding:'1px 5px',background:'var(--bg0)',border:'1px solid var(--border)',color:'var(--text3)',letterSpacing:1,textTransform:'uppercase',flexShrink:0}}>{src==='Core'?'CORE':'DET'}</span>}
          {s.phase&&<span style={{fontSize:8,padding:'1px 5px',background:'var(--bluedim)',border:'1px solid rgba(42,122,176,.4)',color:'var(--blueBright)',letterSpacing:1,textTransform:'uppercase',flexShrink:0}}>{s.phase.toUpperCase()}</span>}
          <span style={{background:'rgba(0,0,0,.4)',color:tc,padding:'1px 5px',fontSize:8,fontWeight:800,letterSpacing:.5,flexShrink:0}}>{tl}</span>
          <span style={{flex:1}}/>
          <span style={{fontSize:10,color:'var(--text3)'}}>{open?'▲':'▼'}</span>
        </div>
        <div style={{fontWeight:800,fontSize:12,textTransform:'uppercase',letterSpacing:.5,color:'var(--text)'}}>{s.name}</div>
        {open&&<div className="strat-card-body">{clean(s.description)}</div>}
      </div>
      <div style={{display:'flex',gap:8,marginTop:8,alignItems:'center'}}>
        <button className={`btn btn-sm ${canAfford?'btn-gold':'btn-outline'}`} disabled={!canAfford} style={{flex:1}} onClick={onUse}>
          {cost===0?'Use (Free)':`Use ${cost}CP`}
        </button>
      </div>
    </div>
  );
}

// ── UNIT DETAIL MODAL ─────────────────────────────────────────────────────────
function UnitDetailModal({unit,factionId,fdata,onClose,onAdd,existingUnits,readOnly}){
  const [si,setSi]=React.useState(0);
  const [kwTip,setKwTip]=React.useState(null);
  if(!unit) return null;
  const cost=pts(unit,si);
  const blocked=isEpicHero(unit)&&existingUnits?.some(e=>e.unit.id===unit.id);

  // Resolve leader/bodyguard names using fdata (same faction) + stored names
  const unitMap=React.useMemo(()=>{
    const m={};
    (fdata?.units||[]).forEach(u=>m[u.id]=u.name);
    return m;
  },[fdata]);

  function resolveName(id,fallbackList,idx){
    return unitMap[id]||(fallbackList&&fallbackList[idx])||id;
  }

  // Which units in the army can this leader attach to (not yet occupied)
  const eligibleInArmy=React.useMemo(()=>{
    if(!isLeader(unit)||!existingUnits) return [];
    return existingUnits.filter(e=>
      (unit.leads||[]).includes(e.unit.id)&&!e.attachedLeader
    );
  },[unit,existingUnits]);

  // Which unattached leaders in army can this bodyguard attach to
  const attachableLeaders=React.useMemo(()=>{
    if(isLeader(unit)||!existingUnits) return [];
    return existingUnits.filter(e=>
      isLeader(e.unit)&&(e.unit.leads||[]).includes(unit.id)&&!e.attachedTo
    );
  },[unit,existingUnits]);

  const sections=[
    {id:'stats',label:'Stats'},
    {id:'ranged',label:'Ranged'},
    {id:'melee',label:'Melee'},
    {id:'abilities',label:'Abilities'},
    {id:'leader',label:'Leader'},
    {id:'composition',label:'Composition'},
    {id:'keywords',label:'Keywords'},
  ].filter(s=>{
    if(s.id==='ranged') return (unit.weapons||[]).some(w=>w.type==='Ranged');
    if(s.id==='melee')  return (unit.weapons||[]).some(w=>w.type==='Melee');
    if(s.id==='leader') return isLeader(unit)||(unit.led_by||[]).length>0;
    if(s.id==='abilities') return (unit.abilities||[]).some(a=>a.name);
    if(s.id==='composition') return (unit.unit_composition||[]).length>0;
    if(s.id==='keywords') return (unit.keywords||[]).length>0;
    return true;
  });

  const [activeTab,setActiveTab]=React.useState(sections[0]?.id||'stats');

  function renderKwRow(abStr){
    if(!abStr) return null;
    const kws=abStr.split(',').map(s=>s.trim().toLowerCase()).filter(Boolean);
    return(
      <div style={{marginTop:3}}>
        {kws.map((kw,i)=>{
          const def=WEAPON_KEYWORDS[kw];
          return(
            <span key={i}
              className={'kw-tag'+(def?' kw-interactive':'')}
              onClick={def?()=>setKwTip(kwTip===kw?null:kw):undefined}>
              {kw}
            </span>
          );
        })}
        {kwTip&&WEAPON_KEYWORDS[kwTip]&&(
          <div className="kw-tooltip">
            <span className="kw-tooltip-name">{kwTip.toUpperCase()}</span>
            {' — '}{WEAPON_KEYWORDS[kwTip]}
          </div>
        )}
      </div>
    );
  }

  function renderWeaponTable(weapons,label){
    if(!weapons.length) return null;
    const groups={};
    weapons.forEach(w=>{ const k=w.line||w.name; if(!groups[k]) groups[k]={name:w.name,profiles:[]}; groups[k].profiles.push(w); });
    return(
      <div className="weapon-section">
        <div className="weapon-row hdr">
          <span>Weapon</span><span>Rng</span><span>A</span><span>Hit</span><span>S</span><span>AP</span><span>D</span>
        </div>
        {Object.values(groups).map((g,gi)=>g.profiles.map((p,pi)=>(
          <React.Fragment key={`${gi}-${pi}`}>
            <div className="weapon-row">
              <span className="weapon-name">{pi===0?g.name:'↳ '+p.name}</span>
              <span>{p.range||'-'}</span>
              <span>{p.attacks||'-'}</span>
              <span>{p.bs_ws?p.bs_ws+'+':'-'}</span>
              <span>{p.strength||'-'}</span>
              <span>{p.ap===0||p.ap==='0'?'0':p.ap||'-'}</span>
              <span>{p.damage||'-'}</span>
            </div>
            {p.abilities&&renderKwRow(p.abilities)}
          </React.Fragment>
        )))}
      </div>
    );
  }

  const rangedWeps=(unit.weapons||[]).filter(w=>w.type==='Ranged');
  const meleeWeps=(unit.weapons||[]).filter(w=>w.type==='Melee');

  // ── Unit photo (repo kit photo, OR your own captured photo) ──
  const [imgVer,setImgVer]=React.useState(0);
  const [showPhotoPicker,setShowPhotoPicker]=React.useState(false);
  const [pickerImages,setPickerImages]=React.useState(null);
  const [aiBusy,setAiBusy]=React.useState(false);
  const [aiProgress,setAiProgress]=React.useState('');
  const aiCancelRef=React.useRef(false);
  const repoPhotoURL=unitImageURL(factionId,unit.id);

  // Your own camera/gallery photo of THIS specific model, stored locally
  // (IndexedDB) on this device. Takes priority over the repo's stock photo.
  const [customPhoto,setCustomPhoto]=React.useState(null);      // saved photo, data URL
  const [capturePreview,setCapturePreview]=React.useState(null); // just-picked, unsaved
  const [bgBusy,setBgBusy]=React.useState(false);
  const [bgErr,setBgErr]=React.useState(null);
  const fileInputRef=React.useRef(null);
  React.useEffect(()=>{
    let alive=true;
    getCustomPhoto(factionId,unit.id).then(p=>{ if(alive) setCustomPhoto(p); }).catch(()=>{});
    return ()=>{alive=false;};
  },[factionId,unit.id,imgVer]);

  const photoURL=customPhoto||repoPhotoURL;

  async function openPhotoPicker(){
    setShowPhotoPicker(true);
    setCapturePreview(null); setBgErr(null);
    const idx=await loadImagesIndex();
    setPickerImages(idx[factionId]||[]);
  }
  async function onPickFile(e){
    const file=e.target.files?.[0];
    e.target.value='';
    if(!file) return;
    setBgErr(null);
    try{ setCapturePreview(await fileToDataURL(file)); }
    catch(err){ setBgErr('Could not read that photo.'); }
  }
  async function applyBgRemoval(){
    if(!capturePreview||bgBusy) return;
    setBgBusy(true); setBgErr(null);
    try{ setCapturePreview(await geminiRemoveBackground(capturePreview)); }
    catch(err){ setBgErr(String(err.message||err)); }
    finally{ setBgBusy(false); }
  }
  async function saveCapture(){
    if(!capturePreview) return;
    await saveCustomPhoto(factionId,unit.id,capturePreview);
    setCapturePreview(null); setImgVer(v=>v+1); setShowPhotoPicker(false);
  }
  async function removeCustomPhotoNow(){
    await deleteCustomPhoto(factionId,unit.id);
    setImgVer(v=>v+1);
  }
  // Gemini-vision pass over this faction's photos: assigns every photo it can
  // confidently name to the matching datasheet (skips already-assigned ones).
  async function autoIdentifyFaction(){
    if(aiBusy) return;
    if(!getGeminiKey()){ alert('Set your Gemini API key first (Menu → Settings & Backup).'); return; }
    const idx=await loadImagesIndex();
    const imgs=idx[factionId]||[];
    const units=fdata?.units||[];
    if(!imgs.length||!units.length){ alert('No photos or unit list available for this faction.'); return; }
    setAiBusy(true); aiCancelRef.current=false;
    const assigned=await identifyFactionPhotos(factionId,units,imgs,{
      onProgress:(i,total,n)=>setAiProgress(`${i}/${total} — ${n} matched`),
      cancelRef:aiCancelRef
    });
    setAiProgress(`Done — ${assigned} new photo${assigned!==1?'s':''} assigned.`);
    setAiBusy(false); setImgVer(v=>v+1);
  }

  return(
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal anim-slide-up" style={{padding:0,overflow:'hidden',display:'flex',flexDirection:'column',maxHeight:'88vh'}}>

        {/* Header */}
        <div style={{padding:'14px 16px 0',flexShrink:0}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:10}}>
            {photoURL&&(
              <img key={imgVer} src={photoURL} alt=""
                onClick={openPhotoPicker}
                style={{width:56,height:56,objectFit:'cover',border:'1px solid var(--goldborder)',flexShrink:0,cursor:'pointer'}}
                onError={e=>{e.target.style.display='none';}}/>
            )}
            <div style={{flex:1,minWidth:0}}>
              <div className="modal-title" style={{marginBottom:4}}>{unit.name}</div>
              <div style={{display:'flex',gap:4,flexWrap:'wrap'}}>
                <span className={`role-badge role-${(unit.role||"Other").replace(/\s+/g,"-")}`}>{unit.role}</span>
                {isEpicHero(unit)&&<span className="tag tag-gold">Epic Hero</span>}
                {isLeader(unit)&&<span className="tag tag-blue">Leader</span>}
                <span onClick={openPhotoPicker} style={{fontSize:8,padding:'1px 6px',border:'1px solid var(--border)',color:'var(--text3)',cursor:'pointer',letterSpacing:.5}}>
                  📷 {photoURL?'change photo':'assign photo'}
                </span>
              </div>
            </div>
            <button className="btn btn-ghost btn-sm" onClick={onClose} style={{fontSize:14,padding:'4px 8px',flexShrink:0,fontFamily:"Cinzel,serif",letterSpacing:2}}>✕</button>
          </div>

          {/* Photo picker overlay */}
          {showPhotoPicker&&(
            <div style={{position:'fixed',inset:0,zIndex:600,background:'rgba(0,0,0,.92)',display:'flex',flexDirection:'column',padding:12}}
              onClick={e=>e.target===e.currentTarget&&setShowPhotoPicker(false)}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8,gap:8}}>
                <div style={{fontFamily:"'Cinzel',serif",fontSize:11,color:'var(--gold)',letterSpacing:1}}>Photo — {stripHTML(unit.name)}</div>
                <div style={{display:'flex',gap:6,alignItems:'center'}}>
                  {aiBusy
                    ?<button className="btn btn-outline btn-xs" onClick={()=>{aiCancelRef.current=true;}}>Stop</button>
                    :<button className="btn btn-gold btn-xs" onClick={autoIdentifyFaction}>✨ Auto-identify faction (AI)</button>}
                  <button className="btn btn-ghost btn-xs" onClick={()=>setShowPhotoPicker(false)}>✕</button>
                </div>
              </div>
              {aiProgress&&<div style={{fontSize:9,color:'var(--brass)',marginBottom:6}}>{aiProgress}</div>}

              {/* ── Your own photo of this exact model ── */}
              <div style={{background:'var(--bg1)',border:'1px solid var(--goldborder)',padding:10,marginBottom:10}}>
                <div style={{fontSize:9,letterSpacing:1.5,color:'var(--brass)',textTransform:'uppercase',fontFamily:"'Cinzel',serif",marginBottom:6}}>Your Own Photo</div>
                <div style={{fontSize:9,color:'var(--text3)',lineHeight:1.5,marginBottom:8}}>

                <input ref={fileInputRef} type="file" accept="image/*" capture="environment" style={{display:'none'}} onChange={onPickFile}/>

                    {customPhoto&&(
                      <img src={customPhoto} alt="" style={{width:52,height:52,objectFit:'cover',border:'1px solid var(--gold)',flexShrink:0}}/>
                    )}
                    <div style={{display:'flex',flexDirection:'column',gap:5,flex:1}}>
                      <button className="btn btn-gold btn-sm" onClick={()=>fileInputRef.current?.click()}>

                      </button>
                      {customPhoto&&(
                        <button className="btn btn-outline btn-xs" onClick={removeCustomPhotoNow}>Remove My Photo</button>
                      )}
                    </div>
                  </div>
                ):(
                  <div>
                    <img src={capturePreview} alt="" style={{width:'100%',maxHeight:220,objectFit:'contain',background:'var(--bg0)',border:'1px solid var(--border)',marginBottom:6}}/>
                    {bgErr&&<div style={{fontSize:9,color:'var(--redBright)',marginBottom:6,lineHeight:1.5}}>{bgErr}</div>}
                    <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>

                      <button className="btn btn-ghost btn-xs" onClick={()=>{setCapturePreview(null);setBgErr(null);}}>Discard</button>

                    <div style={{fontSize:8,color:'var(--text3)',marginTop:5,lineHeight:1.5}}>
                      Background removal edits the photo only — it never repaints or alters the miniature. Requires image-generation access on your Gemini key (separate from the Commander's text quota).
                    </div>
                  </div>
                )}
              </div>

              <div style={{fontSize:9,letterSpacing:1.5,color:'var(--brass)',textTransform:'uppercase',fontFamily:"'Cinzel',serif",marginBottom:6}}>Official Kit Photos</div>
              <div style={{flex:1,overflowY:'auto',display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(86px,1fr))',gap:6}}>
                {pickerImages===null&&<div className="spinner"/>}

                {(pickerImages||[]).map(p=>{

                      style={{width:'100%',aspectRatio:'1',objectFit:'cover',cursor:'pointer',
                        border:`2px solid ${sel?'var(--gold)':'var(--border)'}`,opacity:sel?1:.85}}/>

                })}
              </div>
            </div>
          )}

          {/* Size selector */}
          {unit.costs?.length>1&&(
            <div className="size-select" style={{marginTop:10}}>
              {unit.costs.map((c,i)=>(
                <button key={i} className={`size-btn ${si===i?'active':''}`} onClick={()=>setSi(i)}>

                  border:'none',borderBottom:activeTab===s.id?'2px solid var(--gold)':'2px solid transparent',

                {s.label}

// ── WARGEAR PARSER ────────────────────────────────────────────────────────────
// Parses wargear option text into selectable groups
// Parses WH40K wargear option sentences into structured per-model swap rules.
// Scope detection:
//  - "This model" / "This model's X"        -> scope:'single' (always model index 0)
//  - "1 model" / "1 model's X"               -> scope:'one' (pick exactly one model from the unit)
//  - "Any number of models can each..."      -> scope:'any' (every model decides independently)
// Each group also carries the replaced item (if any) and the list of choices (items that can be taken).
const WARGEAR_WORDNUM={one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10};
// A "new clause opener" — used only to detect and repair the data-scrape bug
// where 2+ independent swap clauses get concatenated into a single options[]
// string with no separating punctuation. Must be followed shortly by an
// actual replace/equip verb, otherwise a plain choice value like "1 Harlequin's
// blade" would itself look like the start of a new clause and cause a false split.
const WARGEAR_OPENER="(?:for every \\d+ models?|up to \\d+ models?|up to (?:one|two|three|four|five)\\b|any number of models|1 model(?:'s|’s)?|one model(?:'s|’s)?|\\d+\\s+[A-Z][A-Za-z' ]{0,30}?(?:'s|’s)\\s+(?:[a-z\\-]+\\s+){0,4}?(?:can (?:be |each )?(?:have|replace)|is replaced|can be replaced))";
const WARGEAR_OPENER_RE=new RegExp(WARGEAR_OPENER,'i');
function splitBundledWargearClauses(raw){
  const withBreaks=raw.replace(new RegExp(`([a-z])(\\s+)(?=${WARGEAR_OPENER})`,'gi'),'$1.$2');
  return withBreaks.split(new RegExp(`(?<=\\.)\\s+(?=${WARGEAR_OPENER})`,'i')).map(p=>p.trim()).filter(Boolean);
}
function parseWargearOptions(options){
  if(!options?.length) return [];
  const groups=[];
  for(let i=0;i<options.length;i++){
    const original=options[i]||'';
    if(!original||clean(original).trim().toLowerCase()==='none') continue;

    // Determine scope from the sentence opening (check before stripping HTML).
    // ratioN/maxN encode the legality limits enforced by the panel:
    //   'ratio' → "For every 5 models … 1 model can …"  (limit = floor(n/ratioN)×perN)
    //   'upto'  → "Up to 2 models can …" / "Up to one Recon Trooper" (limit = maxN)
    let scope='any';
    let ratioN=null, perN=1, maxN=null;
    const ratioMatch=original.match(/^for every (\d+) models?[^,]*,?\s*(?:up to\s*)?(\d+)?\s*model/i);
    const uptoMatch=original.match(/^up to (\d+|one|two|three|four|five|six|seven|eight|nine|ten)\b/i);
    if(ratioMatch){ scope='ratio'; ratioN=parseInt(ratioMatch[1]); perN=parseInt(ratioMatch[2]||'1'); }
    else if(uptoMatch){ scope='upto'; const w=uptoMatch[1].toLowerCase(); maxN=WARGEAR_WORDNUM[w]||parseInt(w); }
    else if(/^any number of/i.test(original)) scope='any';
    else if(/^(?:1|one)\s+\S/i.test(original)) scope='one';
    else if(/^this model/i.test(original)) scope='single';

    // Extract the replaced item from the cleaned sentence prefix — covers both
    // passive ("X can be replaced with") and active ("replace their X with") phrasing.
    const cleanedFull=clean(original).replace(/\u2019/g,"'");
    let replaced=null;
    let replMatch=cleanedFull.match(/(?:their|'s|its)\s+([a-z0-9 \-]+?)\s+(?:can be |)replaced with/i);
    if(!replMatch) replMatch=cleanedFull.match(/replace\s+(?:their|its|this model'?s?)\s+([a-z0-9 '\-]+?)\s+with/i);
    if(replMatch) replaced=replMatch[1].trim();

    // Extract choices. If the sentence contains a <li> list, split there BEFORE stripping tags
    // (joining list items after stripping tags loses the boundary between options).
    let choices=[];
    const hasLi=/<li>/i.test(original);
    if(hasLi){
      const liMatches=[...original.matchAll(/<li>(.*?)<\/li>/gi)];
      choices=liMatches.map(m=>clean(m[1]).replace(/\.$/,'').trim()).filter(Boolean);
    } else {
      const withMatch=cleanedFull.match(/(?:replaced with|equipped with|can\s+(?:each\s+)?replace\s+(?:their|its|this model'?s?)\s+[a-z0-9 '\-]+?\s+with)\s+(.+?)\.?$/i);
      if(withMatch) choices=[withMatch[1].trim()];
    }

    // Repair: the scraper sometimes concatenates 2+ independent swap clauses into
    // one plain-text entry with no separating punctuation, so a lazy capture bleeds
    // into the next clause (e.g. two "Up to N models can replace X with Y" swaps
    // joined into one). Detect the bleed-over and re-split + recurse — this never
    // touches well-formed <li> lists, only broken plain-text captures.
    if(!hasLi&&choices.length===1&&WARGEAR_OPENER_RE.test(choices[0])){
      const subClauses=splitBundledWargearClauses(original);
      if(subClauses.length>1){
        for(const sc of subClauses) groups.push(...parseWargearOptions([sc]));
        continue;
      }
    }

    if(choices.length>=1){
      const scopeNote=
        scope==='any' ? '(any number of models)' :
        scope==='one' ? '(1 model)' :
        scope==='ratio' ? `(${perN} per ${ratioN} models)` :
        scope==='upto' ? `(up to ${maxN} models)` : '';
      const label=replaced
        ? `Replace ${replaced} ${scopeNote}`.trim()
        : `Equip ${scopeNote}`.trim();
      // For per-model swap groups, the default/base item is also a valid choice
      // (a model can simply keep its standard wargear instead of swapping).
      const fullChoices=(replaced&&scope!=='single')?[`${replaced} (default)`,...choices]:choices;
      groups.push({label,choices:fullChoices,raw:cleanedFull,scope,replaced,ratioN,perN,maxN,fixed:false});
    } else {
      groups.push({label:cleanedFull,choices:[],raw:cleanedFull,scope,ratioN,perN,maxN,fixed:true});
    }
  }
  return groups;
}

// ── WARGEAR PANEL ─────────────────────────────────────────────────────────────
// Wargear assignment data shape stored in entry.wargear:
//   { [groupIdx]: { [modelIdx]: choiceIdx } }  for scope 'any' and 'one' (per-model)
//   { [groupIdx]: choiceIdx }                   for scope 'single' (always applies to the one model in the unit)
function WargearPanel({entry,onSave}){
  const u=entry.unit;
  const nModels=modelCount(u,entry.sizeIdx||0);
  const optionGroups=React.useMemo(()=>parseWargearOptions(u.options||[]),[u.id]);
  const [selections,setSelections]=React.useState(()=>{
    const init=entry.wargear?{...entry.wargear}:{};
    return init;
  });

  if(!optionGroups.length) return(
    <div className="wargear-panel">
      <div style={{fontSize:11,color:'var(--text3)',letterSpacing:.5}}>No configurable wargear options for this unit.</div>
    </div>
  );

  function selectSingle(groupIdx,choiceIdx){
    setSelections(s=>({...s,[groupIdx]:choiceIdx}));
  }
  // Legal maximum number of models that may take a non-default choice in a
  // group, based on the datasheet wording ("1 model", "up to 2 models",
  // "for every 5 models, 1 model", "any number of models").
  function groupLimit(g){
    if(g.scope==='one') return 1;
    if(g.scope==='upto') return g.maxN||1;
    if(g.scope==='ratio') return Math.floor(nModels/(g.ratioN||1))*(g.perN||1);
    return Infinity; // 'any'
  }

  function selectForModel(groupIdx,modelIdx,choiceIdx){
    setSelections(s=>{
      const g=optionGroups[groupIdx];
      const groupSel={...(s[groupIdx]||{})};
      if(g.scope==='one'){
        // Only one model total may take a non-default choice — clear any other model's pick first
        for(const k of Object.keys(groupSel)) delete groupSel[k];
        if(choiceIdx!==0) groupSel[modelIdx]=choiceIdx; // 0 = default/keep
      } else {
        if(choiceIdx===0) delete groupSel[modelIdx];
        else {
          // Enforce the datasheet limit: block the swap if the group is full
          const limit=groupLimit(g);
          const takenElsewhere=Object.entries(groupSel).filter(([mi,ci])=>ci!==0&&parseInt(mi)!==modelIdx).length;
          if(takenElsewhere>=limit) return s; // illegal — ignore the click
          groupSel[modelIdx]=choiceIdx;
        }
      }
      return {...s,[groupIdx]:groupSel};
    });
  }

  // Validation: every configurable group must have an explicit decision before saving.
  // "single" groups need a selection; "one"/"any" groups are always valid (default = no swap)
  // but we still require the user to have opened/confirmed them at least once via Save.
  const allGroupsResolved=optionGroups.every((g,gi)=>{
    if(g.fixed) return true;
    if(g.scope==='single') return selections[gi]!=null;
    return true; // per-model groups default to "keep all" which is a valid configuration
  });

  function saveLoadout(){
    onSave(selections);
  }

  // Build current loadout summary for display
  const loadoutParts=optionGroups.map((g,gi)=>{
    if(g.fixed) return null;
    if(g.scope==='single'){
      const sel=selections[gi];
      return sel!=null?g.choices[sel]:null;
    }
    const groupSel=selections[gi]||{};
    const swapped=Object.entries(groupSel).filter(([,ci])=>ci!==0);
    if(!swapped.length) return null;
    const counts={};
    swapped.forEach(([,ci])=>{counts[ci]=(counts[ci]||0)+1;});
    return Object.entries(counts).map(([ci,n])=>`${n}× ${g.choices[ci]}`).join(', ');
  }).filter(Boolean);

  return(
    <div className="wargear-panel">
      <div style={{fontSize:9,letterSpacing:3,color:'var(--brass)',fontFamily:"'Cinzel',serif",textTransform:'uppercase',marginBottom:4}}>
        Wargear Configuration
      </div>
      <div style={{fontSize:10,color:'var(--text3)',marginBottom:10,lineHeight:1.5}}>
        {nModels>1?`This unit has ${nModels} models. Assign wargear per model below.`:'Choose this model\'s wargear loadout below.'}
      </div>
      {optionGroups.map((g,gi)=>{
        if(g.fixed){
          return(
            <div key={gi} style={{fontSize:10,color:'var(--text3)',padding:'5px 0',borderBottom:'1px solid var(--border)',marginBottom:8,fontStyle:'italic'}}>
              {g.label}
            </div>
          );
        }
        if(g.scope==='single'){
          return(
            <div key={gi} className="wargear-group" style={{marginBottom:12}}>
              <div className="wargear-group-label">{g.label}</div>
              {g.choices.map((choice,ci)=>(
                <button key={ci}
                  className={`wargear-option ${selections[gi]===ci?'selected':''}`}
                  onClick={()=>selectSingle(gi,ci)}>
                  <div className={`wargear-radio ${selections[gi]===ci?'sel':''}`}/>
                  <span className="wargear-option-name">{choice}</span>
                </button>
              ))}
            </div>
          );
        }
        // scope 'any' / 'one' / 'upto' / 'ratio' — per-model assignment with a legal limit
        const groupSel=selections[gi]||{};
        const takenCount=Object.values(groupSel).filter(ci=>ci!==0).length;
        const limit=groupLimit(g);
        const atLimit=takenCount>=limit;
        return(
          <div key={gi} className="wargear-group" style={{marginBottom:14}}>
            <div className="wargear-group-label" style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
              <span>{g.label}</span>
              {isFinite(limit)&&<span style={{fontSize:9,color:takenCount>0?(atLimit?'var(--redBright)':'var(--gold)'):'var(--text3)',letterSpacing:.5}}>{takenCount}/{limit} assigned</span>}
            </div>
            {g.scope==='ratio'&&(
              <div style={{fontSize:9,color:'var(--text3)',marginTop:2}}>
                Datasheet allows {g.perN} per {g.ratioN} models — at {nModels} models the legal maximum is {limit}.
              </div>
            )}
            <div style={{display:'flex',flexDirection:'column',gap:5,marginTop:6}}>
              {Array.from({length:nModels},(_,mi)=>{
                const current=groupSel[mi]??0;
                return(
                  <div key={mi} style={{display:'flex',alignItems:'center',gap:8,background:'var(--bg2)',border:'1px solid var(--border)',padding:'6px 10px'}}>
                    <span style={{fontSize:10,color:'var(--text2)',width:60,flexShrink:0,fontFamily:"'Cinzel',serif"}}>Model {mi+1}</span>
                    <select
                      value={current}
                      onChange={e=>selectForModel(gi,mi,parseInt(e.target.value))}
                      style={{flex:1,fontSize:10,background:'var(--bg1)',border:'1px solid var(--border)',color:current!==0?'var(--gold)':'var(--text2)',padding:'4px 6px'}}>
                      {g.choices.map((choice,ci)=>(
                        <option key={ci} value={ci} disabled={ci!==0&&ci!==current&&atLimit}>
                          {choice}
                        </option>
                      ))}
                    </select>
                  </div>
                );
              })}
            </div>
          </div>
        );
      })}
      <button className="btn btn-gold btn-sm" style={{width:'100%',marginTop:4,opacity:allGroupsResolved?1:.5}}
        disabled={!allGroupsResolved} onClick={saveLoadout}>
        {allGroupsResolved?'Save Loadout':'Select Required Wargear First'}
      </button>
      {loadoutParts.length>0&&(
        <div style={{marginTop:8,fontSize:10,color:'var(--text3)',letterSpacing:.3}}>
          Current: {loadoutParts.join(' · ')}
        </div>
      )}
    </div>
  );
}


// ── ROSTER GROUPS ─────────────────────────────────────────────────────────────
const ROSTER_GROUP_ORDER = [
  'Characters','Battleline','Infantry','Mounted','Fly','Beast','Monster',
  'Vehicle','Walker','Dedicated Transports','Fortifications','Allied Units','Other'
];

function RosterGroups({armyGrouped,active,removeUnit,setWarlord,saveWargear,renameEntry,expandTarget}){
  // All groups start collapsed
  const [open,setOpen]=React.useState({});
  // Auto-expand the group containing the expandTarget unit (jump-to-fix)
  React.useEffect(()=>{
    if(expandTarget){
      for(const [role,entries] of Object.entries(armyGrouped)){
        if(entries.some(e=>e.id===expandTarget.entryId)){
          setOpen(o=>({...o,[role]:true}));
          break;
        }
      }
    }
  },[expandTarget]);
  function toggle(r){setOpen(o=>({...o,[r]:!o[r]}))}

  const sorted=Object.entries(armyGrouped).sort((a,b)=>{
    const ai=ROSTER_GROUP_ORDER.indexOf(a[0]),bi=ROSTER_GROUP_ORDER.indexOf(b[0]);
    return(ai===-1?99:ai)-(bi===-1?99:bi);
  });

  return(
    <div>
      {sorted.map(([role,entries])=>{
        const isOpen=!!open[role];
        const totalPts=entries.reduce((s,e)=>s+pts(e.unit,e.sizeIdx),0);
        return(
          <div key={role} style={{marginBottom:4}}>
            {/* Group header - always visible, acts as toggle */}
            <div
              onClick={()=>toggle(role)}
              style={{
                display:'flex',alignItems:'center',justifyContent:'space-between',
                padding:'10px 14px',cursor:'pointer',userSelect:'none',
                background:isOpen?'var(--bg2)':'var(--bg1)',
                border:`1px solid ${isOpen?'var(--goldborder)':'var(--border)'}`,
                borderLeft:`3px solid ${isOpen?'var(--gold)':'var(--border)'}`,
                transition:'all .15s',
              }}>
              <div style={{display:'flex',alignItems:'center',gap:10}}>
                <span style={{
                  fontFamily:'Cinzel,serif',fontSize:11,fontWeight:700,
                  letterSpacing:1.5,textTransform:'uppercase',
                  color:isOpen?'var(--gold)':'var(--text2)',
                }}>{role}</span>
                <span style={{
                  fontSize:9,padding:'2px 7px',border:'1px solid var(--border)',
                  color:'var(--text3)',letterSpacing:.5,
                }}>
                  {entries.length} {entries.length===1?'unit':'units'}
                </span>
              </div>
              <div style={{display:'flex',alignItems:'center',gap:10}}>
                <span style={{fontSize:10,color:'var(--text3)',fontFamily:'Cinzel,serif'}}>{totalPts}pts</span>
                <span style={{fontSize:12,color:isOpen?'var(--gold)':'var(--text3)',transition:'transform .2s',display:'inline-block',transform:isOpen?'rotate(180deg)':'rotate(0deg)'}}>▾</span>
              </div>
            </div>
            {/* Units - only shown when open */}
            {isOpen&&(
              <div style={{borderLeft:'3px solid var(--goldborder)',marginLeft:0}}>
                {entries.map(e=>(
                  <ArmyUnitRow key={e.id} entry={e} onRemove={removeUnit}
                    onWarlord={setWarlord} isWarlord={active.warlordId===e.id}
                    allEntries={active.units} onSaveWargear={saveWargear}
                    onRename={renameEntry}
                    forceOpen={expandTarget?.entryId===e.id}
                    jumpToWargear={expandTarget?.entryId===e.id&&expandTarget?.field==='wargear'}/>
                ))}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}


// ── ARMY UNIT ROW ─────────────────────────────────────────────────────────────
function ArmyUnitRow({entry,onRemove,onWarlord,isWarlord,allEntries,onSaveWargear,onRename,forceOpen,jumpToWargear}){
  const [intelAbility,setIntelAbility]=useState(null);
  const [exp,setExp]=useState(false);
  const [rosterTab,setRosterTab]=useState('stats'); // stats | wargear
  const [editingName,setEditingName]=useState(false);
  const [nameDraft,setNameDraft]=useState(entry.nickname||'');
  React.useEffect(()=>{
    if(forceOpen){
      setExp(true);
      if(jumpToWargear) setRosterTab('wargear');
    }
  },[forceOpen,jumpToWargear]);
  const u=entry.unit;
  const cost=pts(u,entry.sizeIdx);
  const leaderEntry=entry.attachedLeader?allEntries.find(e=>e.id===entry.attachedLeader):null;
  const hasWargear=(u.options||[]).length>0;
  
  // Build current wargear loadout label
  const wargearSummary=React.useMemo(()=>{
    if(!hasWargear||!entry.wargear) return null;
    const groups=parseWargearOptions(u.options||[]);
    const parts=groups.map((g,i)=>{
      if(g.fixed) return null;
      if(g.scope==='single'){
        const sel=entry.wargear[i];
        return sel!=null?g.choices[sel]:null;
      }
      const groupSel=entry.wargear[i]||{};
      const swapped=Object.entries(groupSel).filter(([,ci])=>ci!==0);
      if(!swapped.length) return null;
      const counts={};
      swapped.forEach(([,ci])=>{counts[ci]=(counts[ci]||0)+1;});
      return Object.entries(counts).map(([ci,n])=>`${n}× ${g.choices[ci]}`).join(', ');
    }).filter(Boolean);
    return parts.length?parts.join(' · '):null;
  },[entry.wargear,u.options]);

  // A unit needs wargear configuration if it has any swap groups and the player has
  // never saved a loadout for it yet (entry.wargear is unset). Once saved — even if every
  // model kept the default item — it's considered resolved.
  const needsWargear=React.useMemo(()=>{
    if(!hasWargear) return false;
    const groups=parseWargearOptions(u.options||[]);
    const choosable=groups.filter(g=>!g.fixed);
    return choosable.length>0&&!entry.wargear;
  },[entry.wargear,u.options,hasWargear]);

  const canBeWarlord=canBeWarlordRule(u);
  const mustBeWarlordUnit=mustBeWarlord(u);

  const displayName=entryDisplayName(entry,allEntries);

  return(
    <div className={`unit-card ${isWarlord?'warlord':''} ${leaderEntry?'attached':''}`}>
      <div className="unit-card-header" onClick={()=>{if(!editingName)setExp(o=>!o);}}>
        <div style={{flex:1,minWidth:0}}>
          <div style={{display:'flex',alignItems:'center',gap:6,flexWrap:'wrap'}}>
            {editingName?(
              <div onClick={e=>e.stopPropagation()} style={{display:'flex',alignItems:'center',gap:4}}>
                <input autoFocus value={nameDraft} placeholder={u.name}
                  onChange={e=>setNameDraft(e.target.value)}
                  onKeyDown={e=>{if(e.key==='Enter'){onRename?.(entry.id,nameDraft);setEditingName(false);}if(e.key==='Escape')setEditingName(false);}}
                  style={{fontSize:11,padding:'2px 6px',width:140}}/>
                <button className="btn btn-xs btn-gold" onClick={()=>{onRename?.(entry.id,nameDraft);setEditingName(false);}}>✓</button>
                <button className="btn btn-xs btn-ghost" onClick={()=>setEditingName(false)}>✕</button>
              </div>
            ):(
              <span className="unit-name" onClick={e=>{e.stopPropagation();setNameDraft(entry.nickname||'');setEditingName(true);}} title="Click to rename">
                {displayName} <span style={{fontSize:9,opacity:.4}}>✎</span>
              </span>
            )}
            {isWarlord&&<span style={{color:'var(--gold)',fontSize:9,fontWeight:800,letterSpacing:2,fontFamily:"'Cinzel',serif",border:"1px solid var(--gold)",padding:"2px 6px"}}>WARLORD</span>}
          </div>
          <div style={{marginTop:4,display:'flex',gap:4,flexWrap:'wrap',alignItems:'center'}}>
            <span className={`role-badge role-${(u.role||"Other").replace(/\s+/g,"-")}`}>{u.role}</span>
            {isEpicHero(u)&&<span className="tag tag-gold">Epic Hero</span>}
            {isLeader(u)&&<span className="tag tag-blue">Leader</span>}
            {leaderEntry&&<span className="tag tag-blue">Led by {leaderEntry.unit.name}</span>}
            {needsWargear&&<span style={{fontSize:9,padding:'2px 6px',background:'rgba(255,170,68,.12)',border:'1px solid #ffaa44',color:'#ffaa44',letterSpacing:.5,fontWeight:700}}>⚠ WARGEAR NEEDED</span>}
          </div>
          {wargearSummary&&(
            <div style={{marginTop:3,fontSize:9,color:'var(--text3)',letterSpacing:.3,fontStyle:'italic'}}>
              ⚙ {wargearSummary}
            </div>
          )}
        </div>
        <div style={{display:'flex',alignItems:'center',gap:8,flexShrink:0}}>
          <span className="pts-badge">{cost}pts</span>
          <span style={{color:'var(--text3)',fontSize:11}}>{exp?'▲':'▼'}</span>
        </div>
      </div>
      {exp&&(
        <div className="unit-card-body" style={{padding:0}}>
          {/* Mini tab strip inside unit card */}
          <div style={{display:'flex',borderBottom:'1px solid var(--border)',background:'var(--bg2)'}}>
            {[
              {k:'stats',l:'Stats & Weapons'},
              ...(hasWargear?[{k:'wargear',l:'Wargear'}]:[]),
            ].map(t=>(
              <button key={t.k}
                onClick={()=>setRosterTab(t.k)}
                style={{padding:'7px 12px',fontSize:9,letterSpacing:1.5,textTransform:'uppercase',
                  border:'none',borderBottom:rosterTab===t.k?'2px solid var(--gold)':'2px solid transparent',
                  background:'none',color:rosterTab===t.k?'var(--gold)':'var(--text3)',
                  cursor:'pointer',fontFamily:"'Cinzel',serif",fontWeight:700,flexShrink:0}}>
                {t.l}
              </button>
            ))}
          </div>
          {rosterTab==='stats'&&(
            <div style={{padding:'12px 14px'}}>
              <StatBlock models={u.models}/>
              <WeaponProfile weapons={u.weapons}/>
              {(u.abilities||[]).filter(a=>{
                                const n=(a.name||'').toLowerCase().trim();
                                return a.name&&n!=='leader'&&n!=='supreme commander'&&n!=='epic hero'&&!n.startsWith('leader (')&&!n.startsWith('damaged');
                              }).slice(0,4).map((a,i)=>(
                <div key={i} style={{cursor:'pointer'}} onClick={()=>setIntelAbility(a)} title="Tap for ability analysis">
                  <AbilityBubble a={a}/>
                </div>
              ))}
              {(u.abilities||[]).filter(a=>a.name&&a.name!=='Leader').length>0&&<div style={{fontSize:9,color:'var(--text3)',letterSpacing:.5,marginTop:4}}>◆ Tap any ability for rules analysis</div>}
              <div style={{display:'flex',gap:8,marginTop:12,flexWrap:'wrap',alignItems:'center'}}>
                {isChar(u)&&!isEpicHero(u)&&(
                  <button className={`btn btn-sm ${isWarlord?'btn-gold':'btn-outline'}`} onClick={()=>onWarlord(entry.id)}>
                    {isWarlord?'[WARLORD]':'Set Warlord'}
                  </button>
                )}
                <button className="btn btn-sm btn-danger" onClick={()=>onRemove(entry.id)}>Dismiss</button>
                {!isChar(u)&&(
                  <span style={{fontSize:9,color:'var(--text3)',letterSpacing:.3,fontStyle:'italic'}}>
                    Only CHARACTER units can be Warlord
                  </span>
                )}
                {isChar(u)&&isEpicHero(u)&&!mustBeWarlordUnit&&(
                  <span style={{fontSize:9,color:'var(--text3)',letterSpacing:.3,fontStyle:'italic'}}>
                    Epic Heroes cannot be Warlord
                  </span>
                )}
                {mustBeWarlordUnit&&!isWarlord&&(
                  <span style={{fontSize:9,color:'#ffaa44',letterSpacing:.3,fontStyle:'italic'}}>
                    ⚠ Supreme Commander: must be Warlord
                  </span>
                )}
              </div>
            </div>
          )}
          {rosterTab==='wargear'&&(
            <WargearPanel entry={entry} onSave={(selections)=>{
              if(onSaveWargear) onSaveWargear(entry.id,selections);
              setRosterTab('stats');
            }}/>
          )}
        </div>
      )}
    </div>
  );
}

// Compose the full tactical-counsel system prompt for a commander.
function buildCounselSystemPrompt(cmdKey,cmd){
  const d=COMMANDER_DOCTRINES[cmdKey];
  const parts=[cmd?.voice||`You are ${cmd?.name||'a veteran commander'} of Warhammer 40,000.`];
  if(d){
    parts.push(`CORE PHILOSOPHY: ${d.philosophy}`);
    parts.push(`PERSONALITY: ${d.personality}`);
    parts.push(`SPEECH STYLE: ${d.speech}`);
    parts.push(`TACTICAL PRIORITIES: ${d.priorities}`);
    if(d.encourages) parts.push(`ENCOURAGES: ${d.encourages}`);
    if(d.dislikes) parts.push(`DISLIKES: ${d.dislikes}`);
    parts.push(`EXAMPLE OF YOUR VOICE (do not repeat verbatim): ${d.example}`);
  }
  parts.push(GLOBAL_COMMANDER_DOCTRINE);
  parts.push('For tactical counsel: reply in character, 2-4 sentences maximum. Give ONE clear recommendation and the strategic reason behind it. If the numbers make an attack a poor trade, say so and offer the better line of play.');
  return parts.join('\n\n');
}

// ── PROBABILITY ENGINE ──────────────────────────────────────────────────────
// Local expected-value maths for roll-offs: no external service needed and it
// works offline. Handles dice notation, hit/wound/save/FNP, and the common
// weapon abilities (torrent, lethal/sustained hits, devastating wounds,
// twin-linked, rapid fire).
function avgDice(s){
  if(s==null) return 0;
  const t=String(s).trim().toUpperCase();
  const m=t.match(/^(\d*)D(\d+)([+-]\d+)?$/);
  if(m){
    const n=parseInt(m[1]||'1'), faces=parseInt(m[2]), add=parseInt(m[3]||'0');
    return n*(faces+1)/2+add;
  }
  return parseFloat(t)||0;
}
function probFromTarget(t){
  if(!t||t>=7) return 0;
  return Math.max(0,Math.min(5,7-Math.max(2,t)))/6;
}
// P(2D6 >= n) — charge rolls
function probCharge(dist){
  if(dist<=2) return 1;
  if(dist>12) return 0;
  let ways=0;
  for(let a=1;a<=6;a++)for(let b=1;b<=6;b++) if(a+b>=dist) ways++;
  return ways/36;
}
// Full attack sequence expectation.
// opts: {attacks, models, hitTarget, autoHit, sustainedX, lethal, devastating,
//        twinLinked, rerollHit1|rerollHitAll, woundTarget, saveTarget(null=none),
//        fnp(null), damage, targetWounds, targetModels}
function attackMath(o){
  const A=(o.attacks||0)*(o.models||1);
  let pHit=o.autoHit?1:probFromTarget(o.hitTarget);
  const pCrit=o.autoHit?0:1/6;
  if(!o.autoHit){
    if(o.rerollHitAll) pHit=pHit+(1-pHit)*pHit;
    else if(o.rerollHit1) pHit=pHit+(1/6)*pHit;
  }
  const extraHits=o.sustainedX?A*pCrit*avgDice(o.sustainedX):0;
  const hits=A*pHit+extraHits;
  let pW=probFromTarget(o.woundTarget);
  if(o.twinLinked) pW=pW+(1-pW)*pW;
  // lethal hits: crit hits auto-wound (skip wound roll)
  const critHits=o.autoHit?0:A*pCrit;
  const normalHits=Math.max(0,hits-(o.lethal?critHits:0));
  let wounds=normalHits*pW+(o.lethal?critHits:0);
  // devastating wounds: crit wounds skip the save entirely
  const pWCrit=1/6;
  let mortals=0;
  if(o.devastating){
    const critWounds=normalHits*pWCrit;
    mortals=critWounds;
    wounds=Math.max(0,wounds-critWounds);
  }
  const pFail=o.saveTarget?1-probFromTarget(o.saveTarget):1;
  let unsaved=wounds*pFail+mortals;
  const dmgPer=avgDice(o.damage||1);
  let totalDmg=unsaved*dmgPer;
  if(o.fnp){ totalDmg*=(1-probFromTarget(o.fnp)); }
  const perModelW=Math.max(1,o.targetWounds||1);
  // damage does not spill between models: whole models slain per unsaved wound
  const slainPerWound=Math.min(1,dmgPer/perModelW);
  let modelsSlain=unsaved*Math.min(1,(dmgPer*(o.fnp?(1-probFromTarget(o.fnp)):1))/perModelW);
  modelsSlain=Math.min(o.targetModels||Infinity,modelsSlain);
  return {
    attacks:A,
    hits:+hits.toFixed(1),
    wounds:+(wounds+mortals).toFixed(1),
    unsaved:+unsaved.toFixed(1),
    damage:+totalDmg.toFixed(1),
    modelsSlain:+modelsSlain.toFixed(1),
  };
}
